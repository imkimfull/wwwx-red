<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wwwx.red — 紅品牌策略</title>
<meta name="description" content="紅品牌策略 wwwx.red：把散落的訊息收斂成一個講得清楚的品牌核心，再讓它在市場的雜訊裡站得住。">
<meta name="theme-color" content="#05070c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M72 160H114L161 346L222 207L279 339L312 251' fill='none' stroke='%23F7F5F2' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M410 118L312 251L410 394' fill='none' stroke='%23FC1016' stroke-width='72' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- 文字形狀可選的字型。兩個 Noto 同時涵蓋中文和英文，四個拉丁海報體只有英文 ——
     所以拉丁那幾個在 CSS 裡都接一個 Noto 當後備（見面板的 option value）。
     沒接的話打中文會掉到系統預設，同一串字混兩種字型，點雲裡看得很清楚。

     Google Fonts 是按 unicode-range 切片的，實際只會下載用到的那幾塊，
     不是把整套中文字型抓下來 —— 所以多載一級的成本很小。

     **這條 URL 的字重清單不能亂加字型。** css2 有三種行為，實測過的：

       1. 靜態家族 + 要它沒有的字重 → **整條 HTTP 400**
          （`Anton:wght@700`、`Bebas+Neue:wght@700` 都是 400）
          一個字型寫錯，六個家族一起沒了，而且是靜默的 —— 瀏覽器不會報錯，
          只會安靜地用系統字型。
       2. 變數家族 + 只要一個超出軸範圍的值 → **也是整條 400**
          （`Manrope:wght@900`、`Manrope:wght@100` 都是 400；Manrope 的軸是 200~800）
       3. 變數家族 + 清單裡**混著**軸內和軸外的值 → **回 200，但軸外那幾級靜默消失**
          （`Manrope:wght@600;700;800;900` 回 200，回來的只有 600/700/800）

     第 3 種最危險：狀態碼是 200、看起來沒事，那一級卻不存在，
     瀏覽器會照 CSS 的字重配對規則往別級掉。所以加字型之前不是只確認回 200，
     **要把回應裡的 font-weight 逐個數出來，確認你要的每一級都在**。
     **字重是逐家族指定的**，所以「只有單一字重的字型」不是不能用，是不能跟它要
     600~800 —— 寫 `family=Bebas+Neue`（不帶 wght）就回 200。真正的海報標題體
     多半是這種：Anton、Bebas Neue、Archivo Black、Fjalla One 都只有 400。
     曾經因為統一要一整段字重而把它們整批排除掉，那是自己給自己的限制。
     **但現在不能直接加**：處理單一字重的那一套（釘住字重、停用下拉）已經移除了，
     直接加進來會拿到瀏覽器合成的假粗體，而 `document.fonts.check()` 對合成字重
     回 true，底下那道「字型沒載到」的警告抓不到 —— 完全靜默。
     要加就先照 references/insights.md 把 data-fixed 那一套加回去。
     另外 Oswald、Teko、Space Grotesk 有變數字重但只給到 700。

     **Noto Sans TC 要留著 400 和 500，即使字重選單只開 600~800。**
     body 是 `system-ui, "Noto Sans TC"`，而 system-ui 在 Windows 是 Segoe UI、
     沒有中文字 —— 所以整頁的中文都靠這支網頁字型。頁面實際用到的字重是
     400（h1、內文）和 500（面板的下拉、滑桿數值、輔助線標籤，全站共 14 處中文）。
     少載一級，CSS 就會照配對規則往別級掉，整批中文變粗或變細一級，
     同一行的英數卻不變（英數被 system-ui 先接走）。
     **字重選單是「文字形狀」的事，和頁面本身的排版是兩回事**，兩邊的清單不能綁在一起。
     Noto Serif TC 不用補：它只出現在下拉的 value 裡，不參與頁面排版。 -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Manrope:wght@600;700;800&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* color-scheme 讓瀏覽器自己的 UI（頁面捲軸、表單控制項）跟著走深色，
     不用手動改樣式。淺色捲軸配深色頁面很突兀 */
  html { background: #05070c; color-scheme: dark; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; overflow-x: hidden; }

  /* 畫布釘住不動，內容從它上面捲過去。
     原站的做法是把 canvas 放進一個橫跨兩個 section 的 sticky 容器；
     這裡直接用 fixed，效果一樣而且不必多包一層 */
  #stage { position: fixed; inset: 0; z-index: 0; }
  #stage canvas { display: block; }

  /* ---- 控制面板 ---- */
  #panel {
    position: fixed; top: 68px; right: 16px; z-index: 10;
    width: 252px; padding: 14px;
    background: rgba(10, 14, 24, 0.86);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 140, 200, 0.2);
    border-radius: 12px;
    color: #dfe6ff; font-size: 12px;
    /* 面板用 dvh：它要塞進「當下真的看得到」的範圍，網址列收合時應該跟著長高。
       和版面用 svh 的理由剛好相反 —— 版面怕變，面板要跟著變 */
    max-height: calc(100dvh - 84px); overflow-y: auto;

    /* stable 讓捲軸的空間**永遠**預留著。不留的話，滑桿一多讓內容超出高度時
       捲軸突然出現，整個面板的內容會往左跳一次 */
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: rgba(74, 92, 148, 0.5) transparent;
  }
  /* 舊版 Chrome 不吃上面兩行標準屬性，用這組補 */
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb {
    background: rgba(74, 92, 148, 0.5); border-radius: 4px;
  }
  #panel::-webkit-scrollbar-thumb:hover { background: rgba(104, 128, 196, 0.95); }

  /* 四個大區塊要一眼分得開。單靠一條 7% 的細線分不出來 ——
     實際做出區隔的是**留白**：標題上方 22px、下方 9px，比區塊內
     滑桿之間的 8px 大一倍以上，眼睛才會把它讀成「換一段」。
     線本身加到 12% 並往左延伸出面板內距，變成貫穿整條的分隔線 */
  #panel h2 {
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
    color: #97a5cc; text-transform: uppercase;
    margin: 22px -14px 9px; padding: 18px 14px 0;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  #panel h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  /* 按鈕列到下一支滑桿之間原本只有 3px，比滑桿彼此的 8px 還窄，擠在一起 */
  .btns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }
  .btns button {
    flex: 1 1 auto; min-width: 60px; padding: 6px 7px;
    background: rgba(255,255,255,0.05); color: #b9c4e4;
    border: 1px solid rgba(255,255,255,0.10); border-radius: 7px;
    font-size: 12px; font-family: inherit; cursor: pointer;
    transition: all .15s;
  }
  .btns button:hover { background: rgba(255,255,255,0.11); color: #fff; }
  .btns button.on {
    background: linear-gradient(135deg, #46608f, #5d7fa8);
    color: #fff; border-color: transparent;
  }
  /* 背景形態固定三顆一列。用 grid 不用 flex-wrap：這六顆的字數會變
     （選下去多一個 A 或 B），flex 是照內容寬度分配的，字一多整列就會挪位。
     grid 的三等分和內容無關，點下去只有字變、框不動 */
  #fieldBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  #fieldBtns button { min-width: 0; }
  /* A / B 那個小字：做成標記而不是名字的一部分，才看得出來「還有另一個」 */
  #fieldBtns button i {
    font-style: normal; font-size: 10px; font-weight: 600;
    margin-left: 3px; opacity: 0.72; letter-spacing: 0.04em;
  }
  /* 只剩三種方向，排成一橫排最省高度。原本是九宮格（按鈕的位置就是粒子的
     移動方向），左右兩個方向拿掉之後那個圖示已經不成立了，就不留位置了。 */
  #dirBtns {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
  }
  #dirBtns button { min-width: 0; padding: 7px 2px; font-size: 11px; }
  .slider { margin-bottom: 8px; }
  /* 收斂形狀那一區的滑桿分三種：
       共用       —— 形狀大小、粒子密度、粒子大小，每個形狀都要
       only-shape —— 分布打散、自轉速度，文字用不到（打散會把筆畫推歪，
                     文字也不自轉），選文字時讓位給揮散那兩根
       only-text  —— 文字內容、字形字重、揮散範圍、揮散粒子

     注意「藏起來」和「關掉」是兩件事：uScatter 是全域 uniform，只把滑桿
     藏掉的話，在圓球上調高的值會跟著捲到文字身上。真正的關閉在 shader 的
     scatter()，那裡文字傳 gate = 0。 */
  .only7, .only-text, .only-waft { display: none; }
  body.shape7 .only7 { display: block; }
  /* only-text  只有文字有：文字內容、字形字重（那是「要排什麼字」的設定）
     only-waft  形狀文字這一類都有：揮散範圍、揮散粒子
     only-shape 這一類都沒有：分布打散、自轉速度 */
  body.shapeText .only-text { display: block; }
  body.shapePinned .only-waft { display: block; }
  body.shapePinned .only-shape { display: none; }
  .slider input[type="text"] {
    width: 100%; height: auto; padding: 6px 9px;
    background: rgba(255,255,255,0.06); color: #dfe6ff;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 7px;
    font: 600 13px/1.3 inherit; letter-spacing: 0.06em;
  }
  /* 兩個下拉並排。min-width:0 是必要的 —— flex 項目的預設最小寬度是內容寬度，
     不歸零的話最長的那個選項會把整列撐出面板 */
  /* 字型名比字重長（"Montserrat" 64px 對 "900" 24px），所以不是對半分。
     1.35 分完是 85 / 54px 的文字空間，兩邊各留 20px 以上 —— 換個系統字型
     或使用者調字級都還撐得住。字重的標籤不加中文也是為了這個，見 sWeight。 */
  .pair { display: flex; gap: 5px; }
  .pair select { flex: 1 1 0; min-width: 0; }
  .pair select:first-child { flex-grow: 1.35; }
  /* 底色要是**不透明的深色**，不能用半透明白。
     `html` 有 color-scheme: dark，照理說原生選單本來就會是深的 —— 但只要你
     自己指定了 background，瀏覽器就改用你給的值，而 rgba(255,255,255,0.06)
     疊在選單自己的淺色底上就變成一片白。等於是自己把深色選單關掉了。
     給實色之後，關著和展開才是同一個顏色。
     <option> 也要各自上色：Windows 的 Chrome 不會從 select 繼承過去。
     （原生選單截不到圖，這條是照著主人回報的症狀和 CSS 的合成規則推的。） */
  .slider select {
    width: 100%; padding: 6px 8px;
    background: #10141f; color: #dfe6ff;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 7px;
    font: 500 12px/1.3 inherit; cursor: pointer;
  }
  .slider select:hover { background: #191f2e; }
  .slider select option { background: #10141f; color: #dfe6ff; }
  #bakeMsg:not(:empty) {
    margin: 6px 0 2px; padding: 5px 8px; border-radius: 6px;
    background: rgba(111, 140, 255, 0.14); color: #a9bcff; font-size: 11px;
  }
  #credits {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.07);
    color: #5c6889; font-size: 10px; line-height: 1.6;
  }
  #credits a { color: #7386b8; }
  .slider label {
    display: flex; justify-content: space-between;
    color: #8d99bd; margin-bottom: 3px;
  }
  .slider label b { color: #dfe6ff; font-weight: 500; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; height: 14px; accent-color: #6f8cff; cursor: pointer; }

  /* 摺疊的細部調整。用原生 <details>，展開邏輯瀏覽器自己有，不必寫 JS。
     摺起來的是「調完就不太會再動」的那幾支；形態按鈕留在外面，
     因為那才是這一區真正要人點的東西 */
  /* 下方的空間要用 padding 不能用 margin：這一塊後面接的是 h2，而 h2 的
     margin-top 有 22px —— 相鄰的上下 margin 會合併成比較大的那個，所以
     margin-bottom 只要小於 22 就等於沒寫。padding 不會合併，一定算數。
     順便把最後一支滑桿的 margin 歸零，展開和收合的下方留白才會一樣 */
  .fold { margin-bottom: 8px; padding-bottom: 10px; }
  .fold > .slider:last-child { margin-bottom: 0; }
  .fold > summary {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 0 6px; color: #7f8cb2; cursor: pointer;
    list-style: none; user-select: none;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  /* 箭頭：收著的時候朝下（點了東西會往下展開），展開後朝上（點了會收回去）。
     用同一個 '›' 轉 ±90 度 —— 兩個方向共用一個字，轉場才是連續的 */
  .fold > summary::after {
    content: '›'; font-size: 15px; line-height: 1;
    transition: transform .15s; transform: rotate(90deg);
  }
  .fold[open] > summary::after { transform: rotate(-90deg); }
  .fold > summary:hover { color: #b9c4e4; }
  .fold > summary .line { flex: 1; height: 1px; background: rgba(255,255,255,0.09); }

  /* 收斂進度不是「設定」，是「先把畫面調到某一格來看」的把手 —— 它決定你
     現在看到的是哪一瞬間，不是這個作品長什麼樣。

     所以它要比其他控制項**更低調**，不是更醒目：真正在調作品的是上面那些，
     這一根只是預覽用的臨時把手，不該搶走注意力。做法是整組壓暗一階
     （標籤、數字、軌道都比一般滑桿再淡一點），框和底色全部拿掉。 */
  .scrub { margin: 0 0 8px; }
  .scrub label { color: #6b7899; }
  .scrub label b { color: #9aa6c9; }
  .scrub .tag {
    margin-left: 5px; color: #5f6b8c;
    font: 400 9px/1.5 inherit; font-style: normal; letter-spacing: 0.08em;
    vertical-align: 1px;
  }
  /* 軌道是一條很細的淺灰線。一旦把 appearance 關掉，accent-color 就不管用了，
     顏色要自己給；把手也要自己畫，不然會整個不見。 */
  .scrub input {
    -webkit-appearance: none; appearance: none;
    height: 14px; background: transparent;
  }
  .scrub input::-webkit-slider-runnable-track {
    height: 2px; border-radius: 1px; background: #c9ced8;
  }
  .scrub input::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; margin-top: -4px;
    border-radius: 50%; background: #c9ced8;
  }
  .scrub input::-moz-range-track { height: 2px; border-radius: 1px; background: #c9ced8; }
  .scrub input::-moz-range-thumb {
    width: 10px; height: 10px; border: 0; border-radius: 50%; background: #c9ced8;
  }
  #mode {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.09);
    color: #6b7899; font-size: 11px; line-height: 1.55;
  }
  .check {
    display: flex; align-items: center; gap: 7px;
    margin-top: 12px; padding-top: 11px;
    border-top: 1px solid rgba(255,255,255,0.07);
    color: #8d99bd; cursor: pointer;
  }
  .check input { accent-color: #6f8cff; cursor: pointer; }

  /* ---- 版面除錯輔助線 ---- */
  /* 線 15%、標籤 50%。兩者分開設，不要統一套在 #guides 上 ——
     opacity 是相乘的，父層給 15% 的話標籤只剩 15% × 50% = 7.5% */
  #guides { display: none; position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  body.guides #guides { display: block; }
  #guides .g { position: absolute; left: 0; right: 0; border-top: 1px solid; }
  #guides .g.s { border-color: rgba(110, 220, 255, 0.15); }
  #guides .g.c { border-top-style: dashed; border-color: rgba(255, 186, 90, 0.15); }
  #guides .g b {
    position: absolute; left: 14px; top: 4px;
    padding: 2px 8px; border-radius: 5px;
    background: rgba(5, 7, 12, 0.82);
    font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    opacity: 0.5;
  }
  #guides .g.s b { color: #6edcff; }
  #guides .g.c b { color: #ffba5a; }
  #fps { float: right; color: #5f7ae0; font-variant-numeric: tabular-nums; }

  /* ---- 導覽列 ---- */
  /* 導覽列本身滿版（背景、邊界要跟著視窗），內容靠 .bar 收在 1280px 內。
     排版用的 flex 屬性全部搬到 .bar —— 留在 #nav 上的話，項目會攤在整個
     視窗寬度上，max-width 就白設了。 */
  /* 上內距 8px。**高度要跟著加 8px。**
     全站是 box-sizing: border-box，height 含內距；.bar 又是 height: 100%
     （＝內容區高度）。只加內距不加高度的話，內容區反而少 2px，
     裡面的東西置中之後只往下移一半 —— 看起來就像「沒有變」。
     56 + 8 = 64 才讓內容區維持 56px，整排真的往下 8px。 */
  #nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: 64px; padding: 8px 24px 0;
  }
  #nav .bar {
    max-width: 1280px; margin: 0 auto; height: 100%;
    display: flex; align-items: center; gap: 30px; font-size: 13px;
  }
  /* 左邊那三個連結是 16px。用 > 限定**直接子層** —— 右上的工具鈕包在
     .tools 裡，不該跟著變。 */
  #nav .bar > a:not(.logo):not(.play) { font-size: 16px; }
  /* 字標和第一個連結之間再多留一點：那是兩種東西的分界，
     和連結之間的間距一樣寬的話會讀成四個並列的項目。 */
  #nav .logo + a { margin-left: 8px; }
  /* 字標比旁邊的中文連結再往上 2px。字標的視覺重心偏下（下面那排
     w 的谷底比中文字的下緣還低），照盒子對齊會看起來比連結低一截。
     用 transform 不用 margin：不影響排版，只挪看得見的位置。 */
  #nav .logo {
    display: flex; align-items: center; text-decoration: none; flex: none;
    transform: translateY(-2px);
  }
  /* 正式字標是 900×100 的橫式 SVG。**只給高度、寬度交給 viewBox** ——
     9:1 自己推出 180px，剛好是要的 180×20；兩邊都寫死的話，哪天字標改長度就會被拉扁。 */
  #nav .logo svg { height: 20px; width: auto; display: block; }
  /* 右上那組工具鈕自己一個 flex，間距比導覽連結的 26px 密 ——
     三顆圓鈕排在一起是一組，用同樣的間距會散掉。 */
  #nav .tools { display: flex; align-items: center; gap: 9px; flex: none; }
  /* 細框線圓鈕：框由 CSS 畫（1px），裡面的圖形只負責形狀。
     和導覽列的其他元素用同一組邊框與底色。 */
  #nav .icon {
    width: 30px; height: 30px; border-radius: 999px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: none; padding: 0; color: #8e93a6; cursor: pointer;
  }
  #nav .icon:hover { background: rgba(255, 255, 255, 0.08); color: #dfe6ff; }
  /* ── 右側的段落指示 ────────────────────────────────
     四個畫面四顆點，目前那一顆放大並轉白。點**可以按**（跳到那一章），
     但容器維持 pointer-events: none —— 底下整片畫布要能拖著轉形狀，
     只有點自己收事件。點擊範圍用 ::after 往外撐 9px：7px 的目標太小，
     但撐的是偽元素，不影響排版，看得見的還是 7px。 */
  #dots {
    position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
    z-index: 15; display: flex; flex-direction: column; gap: 20px;
    pointer-events: none;
  }
  #dots .dot {
    position: relative; width: 7px; height: 7px; border-radius: 999px;
    background: #8e93a6; opacity: 0.22; border: 0; padding: 0;
    cursor: pointer; pointer-events: auto;
    transition: transform .35s ease, opacity .35s ease;
  }
  #dots .dot::after { content: ''; position: absolute; inset: -9px; }
  #dots .dot:hover { opacity: 0.5; }
  #dots .dot.on { transform: scale(1.7); opacity: 0.6; background: #fff; }
  /* 播放中：整顆鈕（框線和三角形一起）慢慢閃 —— 只閃圖形的話，
     框還亮著會看起來像圖形壞掉。
     顏色同時轉成品牌那支鮮紅 —— 這是全站唯一一處**暫時性**的紅，
     只在播放中出現，停下來就收回去。 */
  @keyframes navBlink { 50% { opacity: 0.28; } }
  #nav .play.playing {
    animation: navBlink 1.1s ease-in-out infinite;
    color: #ff2233; border-color: rgba(255, 34, 51, 0.55);
  }
  #nav .icon svg { width: 14px; height: 14px; display: block; }
  /* 三角形的視覺重心偏左，照盒子置中會看起來偏左一點 */
  #nav .play svg { transform: translateX(1px); }
  /* ── 兩顆開關 ────────────────────────────────────
     深底版的選取態是**黑底白字**：滑塊比軌道更暗，字反白。
     （淺底版之後要反過來，屆時整組色一起換。）
     狀態掛在 aria-pressed 上，**不另外加 class** ——
     一個狀態兩處記，遲早會不同步。 */
  #nav .switch {
    position: relative; height: 30px; width: 56px; flex: none;   /* 高度對齊旁邊的圓鈕 */
    border-radius: 999px; padding: 0; cursor: pointer;
    font: inherit;   /* button 預設不繼承字體，不寫會掉回 Arial */
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: none;   /* 只留框線，不要淡底 */
  }
  #nav .switch .knob {
    position: absolute; top: 50%; left: 25%; width: 24px; height: 24px;
    border-radius: 999px; background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
    transition: left .22s ease;
  }
  #nav .switch[aria-pressed="true"] .knob { left: 75%; }
  #nav .switch .knob svg { width: 13px; height: 13px; display: block; }
  /* 語言：兩個字都留在軌道上，滑塊底下那一個反白 —— 這樣一眼看得出
     「現在是哪一個」，而不是只看得到滑塊停在哪一邊。 */
  #nav .switch--lang .opt {
    position: absolute; top: 0; width: 50%; height: 100%; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 0.03em; color: #8e93a6;
    /* 兩個標籤各自的光學微調寫在下面（padding-left／transform）——
       text-indent 在 flex 容器上不生效，別用它。 */
  }
  /* 同樣 11px，EN 的墨水高只有 8px、中 是 10px —— 中文字面本來就比拉丁字大。
     縮到 10px 之後兩邊的墨水高剛好都是 8px（EN 是 8/0、中 是 7/1），
     看起來才一樣重。 */
  /* 光學對齊。這幾個數字是量出來的，不是猜的（量法：用零寬探針取基線，
     再配合 canvas 的 actualBoundingBox 算墨水中心，和軌道中心相減）：
       水平 — 字距多加在最後一個字後面，EN 的墨水中心偏左 0.47px。
              border-box 之下 padding-left 只把內容中心推一半，所以給 0.93px。
       垂直 — 行框置中不等於墨水置中：EN 偏低 0.29px、中（10px）偏低 1px。 */
  #nav .switch--lang .opt--l {
    left: 0; padding-left: 0.93px; transform: translateY(-0.29px);
  }
  #nav .switch--lang .opt--r {
    right: 0; font-size: 10px; transform: translateY(-1px);
  }
  #nav .switch--lang[aria-pressed="false"] .opt--l,
  #nav .switch--lang[aria-pressed="true"]  .opt--r { color: #fff; }
  #nav a { color: #939fbc; text-decoration: none; transition: color .15s; }
  #nav a:hover { color: #fff; }
  #nav .gap { flex: 1; }

  /* ---- 版面 ---- */
  /* overflow-x: clip 是手機版的關鍵。內文底下的柔光罩（.copy::before）
     左右各吐出 60vw，那一層把版面寬度擐到 600px —— 390px 的手機上
     整頁被縮成 65%。body 那行 overflow-x: hidden 救不了：html 是 visible 時
     body 的滿出行為會**傳給視窗**，body 自己反而回到 visible，沒人剪。

     用 clip 不用 hidden：hidden 會把這一層變成捲動容器，而且強迫另一軸
     也跟著剪（垂直方向的 -18vh 會一起死）。clip 只剪指定的那一軸。
     剪掉的部分看不見：漸層在 74% 就完全透明了，邊緣本來就是空的。 */
  main { position: relative; z-index: 1; overflow-x: clip; }

  /* Hero 剛好一個視窗高 —— 「這個 section 被捲掉多少」就是收斂的**輸入**
     （輸出還要過一道 easeConverge，見那邊）。

     版面高度一律用 svh 不用 vh：手機網址列收合時 vh 會跟著變，
     而 hero 的高度正是進度公式的分母 —— 分母中途變了，形狀就會抖一下。
     svh 是「網址列展開時的高度」，固定不變。前一行是舊瀏覽器的退路。 */
  .sec--hero { height: 100vh; height: 100svh; }
  .sec--hero .pin {
    position: relative; height: 100vh; height: 100svh;
    display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    justify-items: center; text-align: center;
  }
  /* minmax(0, 1fr) 不寫 1fr：1fr 的下限是 auto，內容一長列就會被撐開，
     上下兩列不再等高，標題就歪了。 */
  .sec--hero h1 { grid-row: 2; }
  /* 逐字浮現：**每個字從頭到尾都在版面上**，只是透明度 0 → 1（由 JS 逐格給）。
     不逐字插進 DOM 是因為那樣每多一個字整行就重排一次，中文標題會左右抖。
     這裡先設 0，免得 JS 還沒跑到的第一格整行閃一下。 */
  .sec--hero h1 .ch { display: inline-block; opacity: 0; }
  /* 提示的透明度由 JS 給（等標題打完才進來），這裡先設 0 免得第一格閃一下 */
  .sec--hero .hint { opacity: 0; }
  h1 {
    /* 垂直置中。原站是壓到偏下方（translateY(14vh)）把上半部留給波浪，
       這裡不那樣排 —— .pin 是置中的 flex，不加位移就是正中間。 */
    font-size: clamp(34px, 6.2vw, 82px); font-weight: 400;
    letter-spacing: -0.02em; line-height: 1.5;
  }
  h1 .dim { color: #9c8a8d; display: block; }
  h1 .lit { color: #ffffff; display: block; }
  /* 落在第三列（標題下方那整塊空間）的正中間。
     不用絕對定位貼底 —— 貼底是「離下緣多遠」，這裡要的是「在下方空間的中央」。 */
  .hint {
    grid-row: 3; align-self: center;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    color: #8a6d71; font-size: 12px; letter-spacing: 0.2em;
  }
  /* 只有符號在呼吸，文字不動 —— 兩個一起晃會像整塊在抖。 */
  .hint svg { width: 34px; height: 12px; display: block;
              animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(7px); } }

  /* 變形的 section。上面留白讓變形先跑完，內文才從下方捲進來 ——
     兩件事錯開，各自才看得清楚。
     第一段留最多，因為那是整片波浪收攏，比後面的形狀互換慢得多。
     下方留白也要夠：變形是在下一段越過視窗中線時觸發的，留太少會在
     上一段的內文還在畫面上時就開始變形 */
  /* 上下留白**必須對稱**。捲動的停點取的是 section 的中心（見 STOPS），
     而內文就擺在中心；留白一邊多一邊少，停點就會偏離內文，
     變成「形狀站定的時候內文還沒到」。

     144svh 是配著 STOP_HOLD（0.81 個視窗高）算的：section 高約 360svh、
     停點間距也是 360svh，扣掉兩端各 81svh 的靜止區，中間 198svh 跑變形。
     內文的淡入範圍是中心 ±62svh（見 REVEAL_NONE），整段落在靜止區裡 ——
     「內文亮著的時候形狀不動」是這三個數字一起保證的，改一個要重算另外兩個。

     **這一組（含 STOP_HOLD 和分段揭示那段的高度）是整頁捲動長度的旋鈕。**
     原始值是 80svh / 0.45 / 260svh，這裡整組乘 1.8，所以全頁的捲動距離、
     每一段變形和每一次揭示都跟著變 1.8 倍。要再快或再慢就整組一起乘。
     （試過乘二，太拖了。） */
  .sec--shape { padding: 144vh 24px; padding: 144svh 24px; }
  /* 最後一段的下留白單獨壓小：它決定「捲到底時停在哪一格」。
     和別段一樣留 144svh 的話，頁尾會停在內文已經淡出之後 ——
     捲到最底反而看不到聯絡信箱。25svh 讓頁尾剛好落在內文全亮那一刻。
     只有最後一段能這樣破壞對稱：它後面沒有停點了，錯開的中心不影響任何變形。 */
  #brand { padding-bottom: 25vh; padding-bottom: 25svh; }
  .copy {
    position: relative; max-width: 560px; margin: 0 auto;
    text-align: center; color: #b3a5a7; font-size: 15px; line-height: 1.85;
  }
  /* 內文底下的柔光罩：球是加色混合畫的，沒有這層字會被光點吃掉。
     只壓一半，另一半交給球自己退到背景（見 contentDim）——
     全靠暗罩的話會在球上壓出一塊看得出邊界的暗斑 */
  .copy::before {
    content: ''; position: absolute; inset: -18vh -60vw; z-index: -1;
    background: radial-gradient(ellipse 44% 46% at 50% 50%, rgba(5,7,12,0.62), rgba(5,7,12,0) 74%);
  }
  .copy h2 {
    font-size: clamp(26px, 3.4vw, 40px); font-weight: 400;
    color: #fff; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 18px;
  }
  .copy h2 em { font-style: normal; color: #d4707d; }
  /* 文字形狀那一段的內文**釘在畫面上**，不隨捲動移動 ——
     它要固定落在畫面垂直 50% 的下方，上半留給粒子寫的那五個字。

     三種做法只有 fixed 能給「固定的螢幕位置」：

       padding  盒子跟著 section 長高，但內文仍隨捲動一路往上跑，
                只有經過畫面中心的那一格剛好落在想要的位置
       sticky   要先把 #brand 的內距改成高度（內距不算在 sticky 的
                containing block 裡），會連帶動到停點間距
       fixed    螢幕位置從頭到尾固定，看不看得見完全交給透明度
                （由收斂完成那一刻起算的計時淡入，見 BRAND_FADE_S）

     top 是**盒子的上緣**：50% 讓整塊剛好從中線起算，佔滿下半螢幕
     （top + bottom 一起給，高度就是剩下的那一半）。那句話貼在最上面，
     信箱和地址包成 .tail 用 flex 吃掉剩下的空間並置中 —— 所以它們是
     「那句話下方剩餘空間的正中間」，不是離那句話固定幾 px。

     transform 只留給水平置中 —— tick 裡的 copyEls 迴圈會跳過這一段，
     不然每幀寫進去的 translateY 會把它蓋掉。 */
  .copy--low {
    position: fixed; left: 50%; top: 50%;
    transform: translateX(-50%);
    width: min(560px, calc(100% - 48px));
    opacity: 0; pointer-events: none;
  }
  /* 三行字的位置全部是**相對量**：那句話由 JS 釘在文字形狀下方
     TEXT_GAP_PX（見 placeBrandCopy），信箱與地址再往下 135px。
     盒子的高度就是這三行，下面不再留任何空間。 */
  .copy--low .tail { margin-top: 135px; }
  /* .contact 的上邊距是給一般段落用的；在 .tail 裡它是第一個孩子，
     留著會和 .tail 自己的上邊距疊起來。 */
  .copy--low .tail .contact { margin-top: 0; }
  /* 柔光罩收窄：盒子不再被內距撐高，照 .copy 原本的 -18vh 會往上
     蓋到粒子寫的那五個字。 */
  .copy--low::before { inset: -8vh -60vw; }
  /* ── 分段揭示的那一段 ────────────────────────────────
     柔光罩要**跟著內文**淡入淡出，不能罩在整個 .copy 上。
     罩在 .copy 上的話，標題才剛開始淡入、球就已經被壓暗了 ——
     而這一段要的正好相反：標題出現的時候球維持原樣。
     所以把罩子搬進 .stage-body（它自己的透明度由 JS 給），
     標題那一段就完全不動到球。 */
  /* ── 內文釘在畫面正中間 ──────────────────────────────
     用 sticky，**不要用 JS 逐格寫 transform** —— 捲動由合成執行緒跑、
     transform 由主執行緒隔一格才寫進去，兩者差一幀，看起來就是一跳一跳。
     sticky 由瀏覽器自己處理，沒有這個時間差。

     **這一段的高度要用 height 給，不能用 padding 撐。**
     sticky 只能在自己的 containing block（父層的 content box）裡移動，
     而**內距不算在 content box 裡**。照 .sec--shape 的排法
     （80svh 內距 + 100svh 的 .stage-pin + 80svh 內距），content box 只有
     100svh、和 .stage-pin 一樣高 —— 可移動範圍是 0，sticky 等於沒生效。
     實測就是這樣：內文一路跟著捲動往上飄，完全沒有停住。
     改成 padding: 0 + height，content box 就等於整個 section，
     可移動範圍 = 高度 − 100svh。

     **高度不能小於 (2 × STOP_HOLD + 1) 個視窗高**，不然 sticky 罩不住
     整個靜止區，揭示跑到一半內文就脫鉤往上飄。
     STOP_HOLD = 0.81 → 至少 262svh；468svh 是和別段一起乘 1.8 來的，
     多出來的部分留給前後兩段變形跑。 */
  .sec--shape[data-reveal="staged"] { padding: 0; height: 468vh; height: 468svh; }
  .stage-pin {
    position: sticky; top: 0;
    height: 100vh; height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 0 24px;   /* .sec--shape 的左右內距被上面那條清掉了，補回來 */
  }
  /* **分段揭示的兩段都不要柔光罩。**

     那層罩子（一個橢圓漸層）本來是為了讓內文壓得住底下的亮點，但它是
     一塊有邊界的暗斑：不管底下是均勻的離散場還是那顆球，都看得出
     標題下方多了一片暗色，背景被局部壓掉。

     這兩段的可讀性改成完全交給 contentDim（內文亮著時整片粒子降到 55%）——
     那一道是**全畫面等比壓暗**，不會留下任何邊。
     第 4 段的 .copy--low 仍然留著罩子：那一段的內文壓在粒子寫的字上，
     字本身就是要讀的主體，只靠整片壓暗吃不住。 */
  .copy::before, .copy--low::before { display: none; }
  /* 這一段的內文比別段大一級。理由是內容量：只有兩句話，撐得起 19px；
     第 3、4 段是整段敘述，同樣的字級會太重。**標題不動**。

     字級是流體的：360px 寬時 17px，1280px 以上 19px，中間線性內插
     （斜率 2px / 920px = 0.217vw）。clamp 的兩端都夾死，所以超寬螢幕
     不會繼續長、比 360px 更窄也不會掉到 17px 以下。
     最後一段的 .lead 用同一條，兩處要一起改。 */
  .copy--staged .stage-body { font-size: clamp(17px, 16.22px + 0.217vw, 19px); line-height: 1.9; }
  .copy--staged .stage-body p:first-child { margin-top: 24px; }
  .copy--staged .stage-body p + p { margin-top: 16px; }
  /* 標題拆成一個字一個 span 之後才轉得動（見 splitTitle）。
     inline 元素吃不到 transform，一定要 inline-block。 */
  .stage-title .ch { display: inline-block; }
  /* 聯絡信箱：頁面上唯一一處用品牌那支鮮紅。粒子刻意不用它（見 COLORS） */
  .copy--low .lead { font-size: clamp(17px, 16.22px + 0.217vw, 19px); line-height: 1.9; }
  .copy .contact { margin-top: 26px; }
  .copy .contact a {
    color: #ff2233; text-decoration: none;
    font-size: 16px; letter-spacing: 0.02em;
    border-bottom: 1px solid rgba(255, 34, 51, 0.35); padding-bottom: 2px;
  }
  .copy .contact a:hover { border-bottom-color: #ff2233; }
  .copy .addr { margin-top: 12px; font-size: 12px; color: #7d7276;
                letter-spacing: 0.02em; }
  /* 1024px 以上就固定 20px；以下維持上面那條流體曲線（360px → 17px）。
     這裡是 min-width，所以要放在流體那兩條的**後面**才蓋得過去。 */
  @media (min-width: 1024px) {
    .copy--staged .stage-body,
    .copy--low .lead { font-size: 20px; }
  }
  .copy p + p { margin-top: 14px; }
  .copy code {
    padding: 2px 7px; border-radius: 5px; font-size: 13px;
    background: rgba(120, 140, 200, 0.16); color: #cdd8f5;
    font-family: ui-monospace, "Cascadia Code", monospace;
  }
  .stats {
    display: flex; justify-content: center; gap: 34px;
    margin-top: 34px; padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.09);
  }
  .stats div b {
    display: block; font-size: 22px; font-weight: 500; color: #dfe6ff;
    font-variant-numeric: tabular-nums; margin-bottom: 2px;
  }
  .stats div span { font-size: 12px; color: #6b7899; letter-spacing: 0.04em; }

  /* ── 控制面板：整組不顯示 ──────────────────────────────
     官網要的是純效果，不是實驗室。**但 DOM 留著** —— 面板裡的每一個
     input 都是某個 uniform 的預設值來源（setShape 讀 #shapeBtns、
     文字形狀讀 #sText、烘焙訊息寫 #bakeMsg），拆掉要連帶改動上千行。
     留著的成本是幾 KB 的死標記，換掉的是整組回歸風險。
     要調參數就改對應 input 的 value，效果和拖滑桿一樣。 */
  #panel, #panelToggle { display: none !important; }

  /* ---- 面板開關（只在窄螢幕出現）---- */
  #panelToggle {
    display: none;
    position: fixed; top: 62px; right: 12px; z-index: 11;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(10, 14, 24, 0.86);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 140, 200, 0.28);
    color: #dfe6ff; font-size: 12px; font-family: inherit; cursor: pointer;
  }

  /* ---- RWD ---- */
  /* 斷點只設一個。分成兩個的話，導覽列和面板會在不同寬度各自變形，
     中間那一段的排版誰都沒實際看過 —— 一個斷點只有兩種版面要驗。 */
  @media (max-width: 720px) {
    /* 導覽列的中間四個連結是**整頁版面寬度的下限**：
       七個項目的文字寬 396px + 六個 26px 間距 156px + 內距 48px = 600px，
       而它們都是不能換行、不能壓縮的文字。#nav 是 fixed，
       它的容器是視窗不是 body，所以 body 的 overflow-x: hidden 管不到 ——
       瀏覽器改用 600px 當版面寬度，390px 的手機上整頁被縮成 65%，
       標題、內文、面板全部跟著縮。**這才是手機版真正的病灶** ——
       去調字級和間距只是在治症狀，收起之後 innerWidth 就等於裝置寬度。
       連結指向的三個 section 本來就是一路捲下去會碰到的，手機上不損失導覽。 */
    #nav { height: 54px; padding: 2px 14px 0; }
    #nav .bar { gap: 14px; }
    #nav .bar > a:not(.logo):not(.play) { display: none; }
    #nav .logo svg { height: 15px; }

    /* 面板改成底部抽屜，預設收起。
       252px 的側邊面板在 390px 的螢幕上佔 65%，而這頁要看的是動畫。
       用 transform 不用 display：收起、展開才滑得出來，而且面板自己的
       捲動位置不會被重置。visibility 是配套的 —— 只移出畫面的話，
       鍵盤 Tab 還是會跳進一個看不見的面板。 */
    #panel {
      top: auto; bottom: 0; left: 0; right: 0; width: auto;
      max-height: 62dvh;
      border-radius: 14px 14px 0 0;
      border-left: 0; border-right: 0; border-bottom: 0;
      visibility: hidden; transform: translateY(100%);
      transition: transform .26s ease, visibility .26s;
    }
    body.panelOpen #panel { visibility: visible; transform: translateY(0); }
    /* 開關放右上角而不是右下角：右下角會被展開的抽屜蓋住，
       那就得跟著抽屜的高度跑，多一個要同步的數字。右上角永遠不會撞到。 */
    /* #panelToggle 在官網一律不出現，見上方 */

    /* 抽屜捲到底不要接著捲整頁 */
    #panel { overscroll-behavior: contain; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<!-- 開關放在面板**前面**：Tab 的順序才是「先碰到開關、再進面板」。
     放後面的話得往回 Tab 才進得去，鍵盤使用者根本不會還從那邊足 -->
<button id="panelToggle" type="button" aria-controls="panel" aria-expanded="false">調整</button>

<div id="panel">
  <h2>背景形態 <span id="fps"></span></h2>
  <div class="btns" id="fieldBtns"></div>
  <!-- 粒子密度擺在摺疊外面：這根是最常動的（換一款背景形態就想試不同的疏密），
       藏在「細部調整」裡等於每次都要多點一下。其餘四根是調好就不太動的 -->
  <div class="slider">
    <label>粒子密度 <b id="vCount">60000</b></label>
    <input type="range" autocomplete="off" id="sCount" min="5000" max="150000" step="1000" value="90000">
  </div>
  <details class="fold">
    <summary>細部調整<span class="line"></span></summary>
    <div class="slider">
      <label>粒子大小 <b id="vDotWave">0.30</b></label>
      <input type="range" autocomplete="off" id="sDotWave" min="0.15" max="1.5" step="0.01" value="0.3">
    </div>
    <div class="slider">
      <label>鋪開寬度 <b id="vSpread">0.30</b></label>
      <input type="range" autocomplete="off" id="sSpread" min="0.1" max="1.5" step="0.01" value="0.3">
    </div>
    <div class="slider">
      <label>起伏高度 <b id="vWaveH">1.0</b></label>
      <input type="range" autocomplete="off" id="sWaveH" min="0.1" max="5" step="0.05" value="1">
    </div>
    <div class="slider">
      <label>流動速度 <b id="vWaveS">1.0</b></label>
      <input type="range" autocomplete="off" id="sWaveS" min="0.1" max="5" step="0.05" value="1">
    </div>
  </details>

  <h2>轉場</h2>
  <div class="btns" id="dirBtns"></div>
  <div class="slider scrub">
    <label><span>收斂進度<i class="tag">預覽</i></span> <b id="vProgress">0.00</b></label>
    <input type="range" autocomplete="off" id="sProgress" min="0" max="1" step="0.005" value="0">
  </div>

  <h2>鏡頭</h2>
  <details class="fold">
    <summary>細部調整<span class="line"></span></summary>
    <div class="slider">
      <label>景深 <b id="vDof">100 · 夢幻</b></label>
      <input type="range" autocomplete="off" id="sDof" min="0" max="100" step="1" value="100">
    </div>
    <div class="slider">
      <label>對焦距離 <b id="vFocus">50 · 中段</b></label>
      <input type="range" autocomplete="off" id="sFocus" min="0" max="100" step="1" value="50">
    </div>
    <div class="slider">
      <label>發光度 <b id="vEmissive">0.75</b></label>
      <input type="range" autocomplete="off" id="sEmissive" min="0" max="1" step="0.01" value="0.75">
    </div>
  </details>

  <h2>收斂形狀</h2>
  <div class="btns" id="shapeBtns"></div>
  <div id="bakeMsg"></div>
  <!-- 只有選「文字」時才出現 -->
  <div class="slider only-text">
    <!-- maxlength 只會數字元，表達不了「全形算兩格」，所以它只是硬上限
         （全部半形時剛好等值），真正的規則在 JS 的 fitCells -->
    <label>文字內容 <b id="vTextLeft">剩 13 格</b></label>
    <input type="text" autocomplete="off" id="sText" value="紅品牌策略" maxlength="20">
  </div>
  <!-- 字形和字重並排 —— 兩個下拉各給一整列的話面板太長。
       不是對半分，字型名比三位數字長，見 .pair 的註解 -->
  <div class="slider only-text">
    <label>字形 · 字重</label>
    <div class="pair">
      <!-- 拉丁那幾個後面都接 "Noto Sans TC"：它們沒有中文字，不接的話打中文
           會掉到系統預設，一串字混兩種字型。接了就是英文用海報體、中文用黑體。

           只寫字型名，不加中文說明：關起來的時候寬度只有一半，加了會被切掉。
           四個的長相：Montserrat 幾何無襯線、Manrope 現代葛羅特斯克、
           Sofia Sans Extra Condensed 海報標題體、Playfair 高反差襯線。

           Manrope 是主人指定加的。量過站得住：離 Montserrat 0.549、離 Playfair 0.695、
           離 Sofia 0.922。**但離黑體只有 0.226** —— 那是拿拉丁字串量的，
           意思是「用黑體打英文」和「用 Manrope 打英文」在點雲裡很像。
           參考：insights.md 有一條「距離 0.251 就是同一款」。兩件事緩頰：
           現役的 Playfair–明體 只有 0.154 也接受了（同樣是「拉丁體 vs 中文體打拉丁字」），
           而且**那些距離是各批次自己全距正規化算的，跨批次不能直接比**。
           記在這裡是為了下一輪有人重量時知道我查過。
           它的字腔比 Montserrat 開很多（700 時 33.1% 對 24.6%），筆畫也細一截
           （27.1 對 32.8）—— 在點雲裡是「比較輕、比較透」的那一款。

           **第二格換過四次**（Barlow Condensed → Fira Sans Condensed → Bebas Neue →
           Sofia Sans Extra Condensed）。前兩款是「文字字型的窄體版」，做得出來但沒有
           氣勢；Bebas Neue 是對的方向，可惜只有 400 一個字重。
           Sofia 超窄是**兼得**：有完整 500~900，而且長得夠像 Bebas ——
           寬高比 4.55 對 4.28、筆畫 21.7 對 22.2 這兩項最貼近，字腔 19.9% 對 15.7%
           略鬆（那一項 Alumni Sans 的 16.4% 更近）。複合距離 0.145 排第二，
           第一名是 Big Shoulders 的 0.100。
           **最後是烘出來決定的，不是算出來的**：Big Shoulders 在 700 太瘦、
           筆畫在點雲裡站不住。Sofia 還額外賺到有小寫（Bebas 打小寫會變成大寫）。
           同場淘汰：Saira 超窄比較方硬、Anton 字腔只剩 7.7% 糊成一塊、
           Archivo Black 和 League Spartan 離 Montserrat 太近。

           選字型的尺（點雲的三個指標）在 references/insights.md。
           **要再加字型就照那一節量，別靠眼睛看字體樣本。** -->
      <select id="sFont" autocomplete="off">
        <option value='Montserrat, "Noto Sans TC", sans-serif'>Montserrat</option>
        <option value='Manrope, "Noto Sans TC", sans-serif'>Manrope</option>
        <option value='"Sofia Sans Extra Condensed", "Noto Sans TC", sans-serif'>Sofia 超窄</option>
        <option value='"Playfair Display", "Noto Serif TC", serif'>Playfair</option>
        <!-- 中文擺最後 -->
        <option value='"Noto Sans TC", sans-serif' selected>黑體</option>
        <option value='"Noto Serif TC", serif'>明體</option>
      </select>
      <!-- 只留 600 / 700 / 800。上下都砍掉是有理由的：
             400、500 太細，筆畫在點雲裡會斷成一串虛線
             900 —— **Manrope 只到 800**，跟它要 900 只會拿到 800（css2 對變數
             字型是夾在軸的範圍內，不會報錯），那是靜默的錯位
           六個家族的 600 / 700 / 800 都實際確認過有（不是瀏覽器假造的）。
           只寫數字不寫「粗／特粗」：兩個下拉共用 216px，扣掉各自的內距、邊框和
           原生箭頭（每個約 38px），剩給文字的只有 135px。字型名就要 64px，
           字重再寫兩個中文字（53px）就只剩 1px 餘裕 —— 那不是餘裕。 -->
      <!-- 字重也決定字距：每重一級 +0.02em，見 textTracking() -->
      <select id="sWeight" autocomplete="off">
        <option value="600">600</option>
        <option value="700" selected>700</option>
        <option value="800">800</option>
      </select>
    </div>
  </div>
  <!-- 只有選「超級形狀」時才出現，不然面板會被用不到的滑桿灌爆 -->
  <div class="slider only7">
    <label>瓣數 <b id="vSuperM">6</b></label>
    <input type="range" autocomplete="off" id="sSuperM" min="0" max="14" step="1" value="6">
  </div>
  <div class="slider only7">
    <label>尖銳度 <b id="vSuperN1">0.60</b></label>
    <input type="range" autocomplete="off" id="sSuperN1" min="0.2" max="3" step="0.05" value="0.6">
  </div>
  <div class="slider only7">
    <label>圓潤度 <b id="vSuperN2">1.00</b></label>
    <input type="range" autocomplete="off" id="sSuperN2" min="0.2" max="4" step="0.05" value="1">
  </div>
  <div class="slider">
    <label>形狀大小 <b id="vScale">20.0</b></label>
    <input type="range" autocomplete="off" id="sScale" min="10" max="30" step="0.5" value="20">
  </div>
  <!-- 和「背景形態」那根粒子密度是**同一個值**的第二個入口。全場只有一組粒子，
       波浪和形狀共用；擺這裡是因為調形狀時那一根在面板最上面，捲上去很麻煩 -->
  <div class="slider">
    <label>粒子密度 <b id="vCountShape">60000</b></label>
    <input type="range" autocomplete="off" id="sCountShape" min="5000" max="150000" step="1000" value="90000">
  </div>
  <div class="slider">
    <label>粒子大小 <b id="vDotShape">0.30</b></label>
    <input type="range" autocomplete="off" id="sDotShape" min="0.1" max="0.9" step="0.01" value="0.3">
  </div>
  <!-- 這兩根形狀文字那一類都用不到：打散會把筆畫和角推歪，這一類也不自轉 -->
  <div class="slider only-shape">
    <label>分布打散 <b id="vScatter">0.50</b></label>
    <input type="range" autocomplete="off" id="sScatter" min="0" max="3" step="0.05" value="0.5">
  </div>
  <div class="slider only-shape">
    <label>自轉速度 <b id="vSpin">0.10</b></label>
    <input type="range" autocomplete="off" id="sSpin" min="0" max="1.5" step="0.01" value="0.1">
  </div>
  <!-- 形狀文字那一類頂上兩根的位置：粒子從形體四面八方飄出去，飄多遠、飄幾成 -->
  <div class="slider only-waft">
    <label>揮散範圍 <b id="vWaft">0.50</b></label>
    <input type="range" autocomplete="off" id="sWaft" min="0" max="1" step="0.01" value="0.50">
  </div>
  <div class="slider only-waft">
    <!-- 數字和單位要包在同一個 span：label 是 space-between 的 flex，
         拆成兩個項目的話百分號會被推到最右邊、和數字中間空一大段 -->
    <label>揮散粒子 <span><b id="vWaftPick">50</b>%</span></label>
    <input type="range" autocomplete="off" id="sWaftPick" min="0" max="100" step="1" value="50">
  </div>

  <label class="check"><input type="checkbox" autocomplete="off" id="cGuides"> 顯示區塊邊界</label>

  <div id="mode">目前：跟隨捲動<br>拖動「收斂進度」可手動預覽，再捲動即回到跟隨模式。</div>
</div>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   場景尺度 — 數值取自 degirum.videinfra.com 的原始碼
   ══════════════════════════════════════════════════════════ */
const MAX_COUNT   = 150000;
// 烘焙形狀的查表貼圖尺寸。512×512 = 262144 個格子，裝得下 MAX_COUNT 還有餘裕
const TEX_W = 512, TEX_H = 512;
const START_COUNT = 60000;                      // 也是曝光補償的基準點（原站用 50000）
const PLANE  = { x: 300, y: 10, z: 150 };       // 原站 objectSize
const ORIGIN = { x: 0, y: 20, z: 0 };           // 平面懸浮在 y=20

// 相機：FOV 50、站在 (0,0,100) 往上仰 0.126 弧度（約 7.2°）看那片網面。
// 用 rotation 而不是 lookAt — 這是「從下往上看」的關鍵，也是原站的做法
const CAM = { fov: 50, pos: [0, 0, 100], rot: [0.126, 0, 0] };

// 形狀：原站球半徑 = sphereSize(10) × SPHERE_SCALE(2) = 20，中心偏移在鏡頭前方
const CENTER = { x: 0, y: 7.9, z: 30 };
/* 文字形狀往上抬多少（世界單位）。11 是量出來的：文字在畫面上約佔
   0.13 個視窗高，原本中心落在中線下方一點，抬 11 之後整片（含下緣）
   都在中線以上，還留了餘裕給揮散飄出去的粒子。
   只有文字吃這個值，其他形狀維持置中（見 shader 的 uTextLift）。 */
const TEXT_LIFT = 11.0;

/* 配色：原站是低飽和的灰 → 靛藍 → 青。這裡把三個色相整組搬到紅這一側
   （暖灰 → 深緋 → 磚紅），**飽和度和明度逐色維持原值**。

   只換色相不換飽和度是刻意的：低飽和才是這個效果的質感來源，
   換成品牌那支鮮紅 #FF2233 會立刻變廉價（見 skill/SKILL.md 第 2 條）。
   鮮紅留給頁面上的字和連結，粒子只負責氛圍。 */
const COLORS = {
  waveA: '#908084', waveB: '#743440', waveC: '#8f4d3a',
  shapeA: '#a69a9c', shapeB: '#8b3e4a', shapeC: '#a55c42',
};

const REF_DIST = 100;   // 透視錨點：約當波浪帶中段的距離

// 透視強度：點大小隨距離縮放的曲線。1 = 標準透視，近端會爆大到 12 像素、糊成一片；
// 0.4 讓整片維持 3.5~6.9 像素的細點，這是網格紋理看得見的前提。
// 沒做成滑桿是因為它和「粒子大小」容易混淆 —— 粒子大小是等比縮放（遠近一起變），
// 這個是改變遠近的「比例」，兩者不能互相取代。要換風格才動這裡。
const PERSPECTIVE = 0.4;

// 錯開幅度：每顆粒子出發時間的分散程度。
// **不能設 0** —— 設 0 的話所有粒子同時出發，九宮格那五個方向會全部變成同一個效果。
// 0.5~0.7 之間都好看，調對一次就不用再動，所以不做成滑桿。
const STAGGER = 0.55;

/* 收斂緩動：把「捲動到哪裡」換算成「形狀成形到哪裡」。0 = 兩者相等（等速）。

   兩端是釘死的（0→0、1→1），所以**平均速度永遠等於等速** ——
   要後段慢，前段就一定得快。「開頭維持等速、之後一路變慢」在數學上不存在。

   用有理函數而不用 1-(1-p)^k：後者的終點速度是 0，最後那一段捲動幾乎
   推不動形狀，看起來像卡住。這條曲線的首尾速度都是正的：
     起點 1+a 倍、終點 1/(1+a) 倍，尾巴比開頭慢 (1+a)² 倍。
   a = 1.0 → 起點 2 倍、終點 0.5 倍，尾巴慢 4 倍。 */
const CONVERGE_EASE = 1.0;
const easeConverge = (p) => p * (1 + CONVERGE_EASE) / (1 + CONVERGE_EASE * p);

// 飛行弧度：粒子飛行途中被拋高多少（負值則下沉）。要跟場景尺度成比例 ——
// 粒子的旅程動輒上百單位，弧度低於 5 根本看不出來，和 0 沒兩樣。
const ARC = 12;

// 波浪帶前後緣離鏡頭的距離，在相機建好後量測（見 measureDepth）。
// 對焦距離滑桿是 0～100 的百分比，對映到這個區間 ——
// 直接用場景單位的話，使用者得先知道場景多大才調得動
let DEPTH = { near: 27, far: 176 };

/* ── 形狀清單 ──────────────────────────────────────────────
   兩種來源，介面一樣（吃粒子編號、吐單位空間裡的一點），所以可以互相變形：

     函式型（沒有 src）：shader 裡的 shapeAt() 直接算。零載入、零記憶體，

     烘焙型（有 src）：  CPU 端算好 9 萬個目標座標存進貼圖，shader 查表。
                        文字走這條。

   3D 模型也曾經走烘焙型這條路（十二個模型、體素化、視角砍除）。整組移到
   3d-object-proj/ 保存了 —— 主程式留下的是最小的形狀集合。烘焙管線沒有拆掉，
   因為文字還要用，所以要把模型接回來只需補上 sampleModel 和幾行清單。 */
const SHAPES = [
  { id: 0,  name: '圓球' },
  { id: 6,  name: '離散圓' },
  { id: 17, name: '隨機離散' },
  { id: 200, name: '文字', src: { type: 'text' } },
  // 螺旋（id 5）從面板拿掉了，shader 的 shapeHelix 還在，把 { id: 5, name: '螺旋' }
  // 貼回來就回來。沒被呼叫的函式編譯時會被拿掉，不佔成本。

  /* 三個「隨機」先從面板收起來。**程式一行都沒刪** —— shader 的函式、擲骰、
     密度補償、碰撞尺寸全都還在，把下面三行貼回上面就整組回來：
       { id: 8,  name: '隨機圓' },      旋轉曲面：直立／橫躺橢圓、雞蛋、葫蘆
       { id: 9,  name: '隨機螺旋' },    上下鏡射：單螺旋、雙螺旋、編織籃
       { id: 16, name: '隨機離散' },    旋轉曲面的霧，帶空心核與亮度偏壓
     為什麼要對稱、密度怎麼補、擲骰的門檻怎麼定，寫在
     skill/references/shapes.md 和 insights.md。 */

  // shader 裡還留著幾個純函式的形狀，加回這個陣列就會出現在面板上：
  //   1 立方體、2 三角錐、3 圓錐、4 甜甜圈、7 超級形狀、10 大腦、
  //   11~15 五種用數學式捏的臉
  // 具象的那幾個（臉、腦）已經被真模型取代 —— 留著是為了對照，不是備案
];
// 排成九宮格。cell 是 [列, 行]，按鈕的位置就是粒子的移動方向 ——
// 「由下往上」放最上格，因為形狀是往上長的
/* 收斂前的背景形態。十八個都佔同一塊位置、吃同一組滑桿，換的只有起伏的規則。
   六個名字 × A/B/C 三種結構 —— 三款不是同一支的參數調一調，是三套不同的
   規則。哪三套、差在哪，寫在 shader 裡各自的函式上面。
   要再加：在 shader 的 fieldAt() 補一個分支，然後在這裡加一行。

   注意三支漩渦會動到粒子的面內位置，而目標配對（buildPairing）是拿網格的
   行列當畫面座標的替身算的 —— 選漩渦時那個假設會失準，收斂的軌跡會比其他
   形態交叉得多。這是刻意不修的：重算配對要在切換的當下改掉每顆粒子的目標
   編號，畫面會整個跳一下，比軌跡交叉更難看 */
/* 一個名字一顆按鈕，五種結構藏在同一顆裡：沒選的時候只寫名字，選下去是 A，
   再點依序換 B、C、D、E，再點回 A。三十個東西六顆按鈕。

   ids 的順序就是 A、B、C、D、E —— 裡面的數字是 shader 裡 fieldAt() 的分支
   編號，不能改；要調按鈕位置就調這個陣列的順序（三顆一列）。

   編號看起來很跳，因為它是「第幾個被做出來的」而不是「排第幾」：18~29 是
   後來補的 D、E，極光和山岳的 B、C 又對調過。要找函式請看 fieldAt()。 */
const FIELDS = [
  { name: '極光', ids: [3, 15, 10, 18, 19] },   // 直幕、冕、皺褶簾幕、橫弧、脈斑
  { name: '漩渦', ids: [5, 11, 17, 20, 21] },   // 漩渦、亂流、渦街、吐納、渦格
  { name: '離散', ids: [4,  8, 13, 22, 23] },   // 隨機、陣風、區塊、靜頂、環爆
  { name: '波浪', ids: [0,  7, 12, 24, 25] },   // 波浪、湧浪、駐波、碎波、群浪
  { name: '漣漪', ids: [1,  6, 16, 26, 27] },   // 漣漪、水滴、干涉、捲波、順流
  { name: '山岳', ids: [2, 14,  9, 28, 29] },   // 山脈全境、群峰、峽谷、斷塊、方山
];
/* 橫向那兩個（由左至右 id 3、由右至左 id 4）拿掉了 ——
   shader 的分支還在，把它們加回這個陣列就會回來。

   「由近而遠」（依螢幕上離形狀多遠排序）做過又拿掉了 —— shader 的分支、
   參考相機、uniform 全部一起移除，做法和三個坑完整留在 references/tuning.md。

   沒有 cell：三顆自己依序排進 #dirBtns 那三欄，就是一橫排。
   （cell 是九宮格時代用的絕對格位 [列, 行]，留著的話會把它們釘在同一欄
     疊成一直行 —— 欄數怎麼改都沒用，那是兩件事。）

   三個方向共用同一個 STAGGER。曾經讓項目自己帶 stagger（由近而遠要 0.82），
   那個方向拿掉之後就沒有第二個值了，那層泛化也一起收掉。 */
const DIRECTIONS = [
  { id: 1, name: '由下往上' },
  { id: 0, name: '同時' },
  { id: 2, name: '由上往下' },
];

/* ══════════════════════════════════════════════════════════
   場景
   ══════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false });
/* 算圖解析度的上限。粗指標（觸控）裝置降到 1.5：
   這一段是 fill rate 綁死的 —— 六萬顆點用 additive 疊加，每一顆都要讀寫
   一次 framebuffer，成本跟像素數成正比。 2 → 1.5 少算 44% 的像素（1.5²/2² = 0.5625）。
   副作用是粒子看起來稍微大一點：gl_PointSize 的單位是**裝置像素**，
   解析度降下來、點的裝置像素數不變，換算成 CSS 像素就大了 4/3 倍。
   手機上反而是好事：手機的視窗矮，點大小基準是視窗高/1200×4，
   本來就比桌機細（390×844 算出來只有 0.84 CSS 像素，降完是 1.13）。 */
const maxDPR = () => (matchMedia('(pointer: coarse)').matches ? 1.5 : 2);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxDPR()));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor('#05070c');
// 色調映射：原站有開，這裡跟著開 —— 但要知道它對**自訂 ShaderMaterial 是空轉**。
// Three.js 是在每個材質的 fragment shader 結尾插 #include <tonemapping_fragment>，
// 內建材質有、自訂的沒有。實測開關切換後畫面逐像素完全相同。
// 壓過曝真正有效的是密度補償（見 applyWaveAlpha），不是這裡。
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CAM.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(...CAM.pos);
camera.rotation.set(...CAM.rot);

/* ── 形狀釘在畫面上，不釘在世界裡 ──────────────────────────
   CENTER 是形狀在**基準姿態**下的世界座標。但鏡頭視差每一格都會動相機
   （左右平移 ±4、俯仰 ±0.02），形狀若留在世界座標，畫面上的中心點就會跟著飄：
   實測滑鼠掃過整個畫面，橫移 116px（畫面寬 8.1%）、直移 41px（畫面高 4.3%）。

   以前無所謂 —— 視差本來就是要讓整個場景動。現在滑鼠同時負責左右轉形狀，
   「轉」和「飄」疊在一起，看起來就不是原地自轉，而是整團在畫面上滑。

   解法是把形狀改成釘在**相機座標系**：先把 CENTER 換算成「相對相機的偏移量」，
   之後每一格再用相機當下的姿態換算回世界座標。相機和形狀同時移動相同的量，
   兩者的相對位置完全沒變，所以中心點、大小、透視、景深距離全部一格不動 ——
   這是精確抵銷，不是近似。視差只剩背景那片粒子在跑，深度感照舊。 */
const SHAPE_OFFSET = new THREE.Vector3(CENTER.x, CENTER.y, CENTER.z)
  .sub(new THREE.Vector3(...CAM.pos))
  .applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(...CAM.rot)).invert());

// 量出波浪帶前後緣離鏡頭有多遠，給對焦距離的百分比滑桿當刻度。
// 改了平面尺寸或相機位置也會自動跟上，不用手動改數字
(function measureDepth() {
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  const p = new THREE.Vector3();
  const distAt = (dz) => {
    p.set(0, ORIGIN.y, ORIGIN.z + dz).applyMatrix4(camera.matrixWorldInverse);
    return -p.z;
  };
  DEPTH = { near: distAt(PLANE.z / 2), far: distAt(-PLANE.z / 2) };
})();

/* ── 畫面正中央落在平面上的哪一點 ──────────────────────────
   `uOrigin` 是那片網面的原點，**不等於畫面中央**。鏡頭站在 (0,0,100) 往上仰
   看，所以「觀眾眼中的正中央」要從相機射一條線出去、和粒子平面 y = ORIGIN.y
   求交，交點才是。這個算不進 shader —— 相機的位置和角度它拿不到。

   只跟相機位置、俯仰角、平面高度有關。FOV 和視窗長寬比都不影響（這條射線
   就是視錐的中軸），所以 **resize 不用重算**，開頁面算一次就好。

   鏡頭視差會讓相機每格微幅晃動，這裡刻意只取基準姿態：交角很淺（仰角才 7 度），
   跟著晃的話圓心會在平面上滑動好幾十個單位，比不對齊還難看。 */
function screenCenterOnPlane(planeY) {
  camera.updateMatrixWorld();
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const t = (planeY - camera.position.y) / dir.y;
  // 鏡頭若拉成水平（dir.y = 0）就永遠交不到，退回平面原點
  if (!isFinite(t) || t <= 0) return new THREE.Vector3(ORIGIN.x, planeY, ORIGIN.z);
  return camera.position.clone().addScaledVector(dir, t);
}
const SCREEN_CENTER = screenCenterOnPlane(ORIGIN.y);

/* ── 粒子座標：規則網格，不是隨機 ──
   這是原站質感的核心。整齊的點陣被波浪扭曲後會產生摩爾紋般的細密紋理，
   隨機分布做不出來（會變成一團雜訊）。 */
const positions = new Float32Array(MAX_COUNT * 3);
const indices   = new Float32Array(MAX_COUNT);
const alphas    = new Float32Array(MAX_COUNT);
const shapeIdx  = new Float32Array(MAX_COUNT);   // 見 buildPairing
const geometry  = new THREE.BufferGeometry();

function buildGrid(count) {
  // 依平面長寬比決定每列幾個點，讓格子接近正方形
  const cols = Math.floor(Math.sqrt((PLANE.x / PLANE.z) * count));
  const rows = count / cols;
  for (let i = 0; i < count; i++) {
    const rowN = Math.floor(i / cols) / rows;   // 0 = 最遠, 1 = 最近
    const colN = (i % cols) / cols;
    positions[i * 3 + 0] = PLANE.x * (colN - 0.5) + ORIGIN.x;
    positions[i * 3 + 1] = ORIGIN.y;
    positions[i * 3 + 2] = PLANE.z * (rowN - 0.5) + ORIGIN.z;
    indices[i] = i;
    // 遠端淡出：最遠處完全透明，往近處漸漸實心。原站是 clamp(1.5 * rowN, 0, 1)
    alphas[i] = Math.min(1, Math.max(0, 1.5 * rowN));
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.aIndex.needsUpdate = true;
  geometry.attributes.aAlpha.needsUpdate = true;
  geometry.setDrawRange(0, count);
}

/* ── 目標配對 ──────────────────────────────────────────────
   預設情況下，網格上第 i 顆粒子飛到形狀的第 i 個位置。這兩套編號毫無關聯
   （網格是一列一列排的，Fibonacci 球是黃金角跳著排的），所以軌跡大量交叉，
   看起來像「一團粒子亂飛然後湊出形狀」。

   把兩邊都按「在畫面上的方位角」排序後對位，軌跡就幾乎不交叉，變成
   「整片布被拉成一個形狀」。**shader 成本是零** —— 只是換一個查表用的編號。

   兩個實作上的決定：

   1. 用格子座標 (colN, rowN) 當畫面座標的替身，不真的去投影。因為 colN
      對應螢幕左右、rowN 對應螢幕上下，都是單調的，排序結果一樣。好處是
      不受「鋪開寬度」「形狀大小」這些滑桿影響，不用跟著重算。

   2. **只為「波浪要收斂成的那個形狀」配一次，之後不再重配。** 重配會讓每顆
      粒子的目標編號改變 —— 形狀正顯示著的時候重配，畫面會整個跳一下。
      而且真正看得出交叉的是波浪→形狀那段長距離飛行；形狀之間的互換
      距離很短，配對好不好幾乎看不出來。

   3. 排序鍵**先左右、再上下**，而不是用方位角。實測比較過三種：
        不配對 = 0%｜格子空間方位角 = 16.6%｜螢幕方位角 = -0.1%｜左右優先 = 18.6%
      方位角會失敗是因為波浪帶又寬又扁、形狀中心就落在帶子上，角度全擠在
      0 度和 180 度兩端。**水平對應才是這個版面的主軸。** */
const GOLDEN_JS = 2.39996322972865;

// shader 裡形狀函式的 JS 版本，回傳 [x, y]（z 排序用不到）。
// 離散圓的半徑抖動是純徑向的、不改左右順序，所以它和圓球共用同一份。
// 頭和大腦也走圓球那一支：它們本來就是從球面捏出來的，左右／上下的先後
// 順序沒被打亂，配對只看順序不看實際座標，所以夠用
function jsShapeXY(id, i, n) {
  if (id === 5) {                                   // 螺旋
    const k = Math.floor(i / 2) / (n * 0.5);
    const t = k * 3 * 2 * Math.PI + (i % 2) * Math.PI;
    return [Math.cos(t) * 0.55, k * 2 - 1];
  }
  const y = 1 - (i / n) * 2;                        // 圓球 / 離散圓
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  return [Math.cos(GOLDEN_JS * i) * r, y];
}

function argsort(keys, count) {
  const order = new Uint32Array(count);
  for (let i = 0; i < count; i++) order[i] = i;
  return order.sort((a, b) => keys[a] - keys[b]);
}

function buildPairing(count, shapeId) {
  const cols = Math.floor(Math.sqrt((PLANE.x / PLANE.z) * count));
  const rows = Math.ceil(count / cols);

  // 形狀側：先按左右排，切成 cols 個直條（每條 rows 個），條內再按上下排。
  // 用「等數量」切條而不是「等寬度」，形狀邊緣稀疏的地方才不會有空條
  const sx = new Float64Array(count), sy = new Float64Array(count);
  for (let i = 0; i < count; i++) { const p = jsShapeXY(shapeId, i, count); sx[i] = p[0]; sy[i] = p[1]; }
  const byX = argsort(sx, count);
  for (let c = 0; c < cols; c++) {
    const lo = c * rows, hi = Math.min(count, lo + rows);
    if (hi - lo > 1) byX.subarray(lo, hi).sort((a, b) => sy[a] - sy[b]);
  }

  // 網格側：網格是一列一列存的，改成一「行」一行讀，就和上面的直條對齊。
  // rowN 越大 = 越靠近鏡頭 = 螢幕上越高，和形狀的 y 越大同向
  const gk = new Float64Array(count);
  for (let i = 0; i < count; i++) gk[i] = (i % cols) * count + Math.floor(i / cols);
  const gOrder = argsort(gk, count);
  for (let r = 0; r < count; r++) shapeIdx[gOrder[r]] = byX[r];

  geometry.attributes.aShapeIndex.needsUpdate = true;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
geometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
geometry.setAttribute('aShapeIndex', new THREE.BufferAttribute(shapeIdx, 1));
buildGrid(START_COUNT);
buildPairing(START_COUNT, +(document.querySelector('[data-shape]')?.dataset.shape ?? 0));
geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 600);

/* 兩張目標座標貼圖，對應 shader 的「來源形狀」和「目標形狀」。
   只要兩張就夠 —— 任何時刻最多只有兩個形狀同時在畫面上（正在互變的那兩個）。
   換形狀時把現在的那張當成來源，新的烘進另一張。 */
const makeTargetTex = () => {
  const t = new THREE.DataTexture(new Float32Array(TEX_W * TEX_H * 4),
                                  TEX_W, TEX_H, THREE.RGBAFormat, THREE.FloatType);
  t.minFilter = t.magFilter = THREE.NearestFilter;   // 查表用的，絕不能內插
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
};
const targetTex = [makeTargetTex(), makeTargetTex()];

const uniforms = {
  uTime:       { value: 0 },
  uProgress:   { value: 0 },
  uReveal:     { value: 0 },
  uMouse:      { value: new THREE.Vector2(0, 0) },
  uPlaneSize:  { value: new THREE.Vector3(PLANE.x, PLANE.y, PLANE.z) },
  uOrigin:     { value: new THREE.Vector3(ORIGIN.x, ORIGIN.y, ORIGIN.z) },

  uCount:      { value: START_COUNT },
  uDotWave:    { value: 0 },      // 由滑桿依視窗高度換算
  uWaveAlpha:  { value: 1.0 },   // 實際值由 applyWaveAlpha() 算：基準 × 密度補償
  uWaveHeight: { value: 1.0 },
  uWaveSpeed:  { value: 1.0 },
  uSpread:     { value: 0.3 },

  /* 1 = 純加色（原本的行為），0 = 一般透明混合。
     0.70 是實測出來的甜蜜點：死白像素從 0.87% 降到 0.02%，平均亮度只掉 9%。
     再往下壓亮度掉得比過曝改善得快，而且會開始失去「越密越亮」的層次 */
  uEmissive:   { value: 0.75 },
  uPerspective:{ value: PERSPECTIVE },
  uBlur:       { value: 0.5 },
  uFocus:      { value: 90 },
  uFocusRange: { value: 55 },

  uWaft:       { value: 0.50 },   // 揮散範圍（飄多遠），只有文字用得到
  uWaftPick:   { value: 0.50 },   // 揮散粒子（飄幾成），滑桿是百分比，這裡是 0~1
  uShapeFrom:  { value: 0 },
  uShapeTo:    { value: 0 },
  uShapeMix:   { value: 1 },
  uCenter:     { value: new THREE.Vector3(CENTER.x, CENTER.y, CENTER.z) },
  uScale:      { value: 20.0 },
  uTextFit:    { value: 1.0 },   // 文字形狀的尺寸上限，見 textFit()
  uSphereFit:  { value: 1.0 },   // 第 2 段那顆球的尺寸，見 sphereFit()
  uTextKeep:   { value: 1.0 },   // 文字形狀的密度折扣，見 textKeep()
  uTextLift:   { value: TEXT_LIFT },   // 文字形狀往上抬多少，見 TEXT_LIFT
  uDotShape:   { value: 0 },
  uShapeAlpha: { value: 0.55 },
  uSpin:       { value: 0.10 },
  uScatter:    { value: 0 },      // 實際值由 applyScatter() 依粒子密度換算
  uSuperM:     { value: 6 },      // 超級形狀：瓣數（0 = 退化成圓球）
  uSuperN1:    { value: 0.6 },    //           尖銳度
  uSuperN2:    { value: 1.0 },    //           圓潤度
  uSuperNorm:  { value: 0.75 },   //           正規化係數，由 applySuper() 實測
  /* 隨機圓（旋轉曲面）。這五個由 rollEgg() 擲出來，預設值就是一顆正圓球 */
  uEgN:        { value: 2.0 },    // 超橢圓次方：2 正圓、大於 2 桶狀、小於 2 紡錘
  uEgH:        { value: 1.0 },    // 垂直半徑：>1 直立橢圓、<1 橫躺橢圓
  uEgSkew:     { value: 0.0 },    // 蛋形：最寬的一圈往上（正）或往下（負）
  uEgWaist:    { value: 0.0 },    // 腰身：負的收腰成葫蘆、正的中段鼓起
  uEgNorm:     { value: 1.0 },    // 剪影面積校正，rollEgg() 算好塞進來
  uEgGainNorm: { value: 1.0 },    // 密度補償的正規化，同上

  // 一開始就指向真的貼圖，不能放 null —— shader 裡宣告了 sampler，
  // 就算 uToBaked 是 0 沒去取樣，WebGL 還是會把它綁定一次
  uTexFrom:    { value: targetTex[0] },
  uTexTo:      { value: targetTex[1] },
  uTexSize:    { value: new THREE.Vector2(TEX_W, TEX_H) },
  uFromBaked:  { value: 0 },
  uToBaked:    { value: 0 },

  /* uField 是 shader 裡 fieldAt() 的分支編號。這張表是給人看的對照，
     真正的來源是 FIELDS 陣列 —— 兩邊不一致的話以 FIELDS 為準。

              波浪  離散  山岳  極光  漣漪  漩渦
        A       0     4     2     3     1     5
        B       7     8    14    15     6    11
        C      12    13     9    10    16    17
        D      24    22    28    18    26    20
        E      25    23    29    19    27    21

     編號是「第幾個被做出來的」，不是「排第幾」：0~17 是最早的十八款，
     18~29 是後來補的 D、E；山岳和極光的 B、C 又對調過，所以那兩行跳號。
     按鈕順序怎麼調都不影響編號。 */
  uField:      { value: 0 },
  uDirection:  { value: 1 },      // 由下往上，見 DIRECTIONS
  uStagger:    { value: STAGGER },
  uArc:        { value: ARC },

  uWaveA: { value: new THREE.Color(COLORS.waveA) },
  uWaveB: { value: new THREE.Color(COLORS.waveB) },
  uWaveC: { value: new THREE.Color(COLORS.waveC) },
  uShapeColA: { value: new THREE.Color(COLORS.shapeA) },
  uShapeColB: { value: new THREE.Color(COLORS.shapeB) },
  uShapeColC: { value: new THREE.Color(COLORS.shapeC) },

  // 漣漪的圓心（世界座標的 x、z）＝ 畫面正中央那一點。見 screenCenterOnPlane()
  uRippleC: { value: new THREE.Vector2(SCREEN_CENTER.x, SCREEN_CENTER.z) },
  // 形狀的旋轉角（弧度）。每幀由 updateRotation() 算好塞進來，見 shader 的說明

     陡面是要付代價的：同樣的振幅和波長，不對稱側影的最大斜率是正弦的 1.5 倍

    return smoothstep(0.0, 1.0 - r, q) * (1.0 - smoothstep(1.0 - r, 1.0, q));

  /* 一道破碎浪。回傳 x = 高度、y = 白沫強度 —— 兩個要一起算，因為「哪一段

     noise 的第二軸餵的是 floor(相位)，也就是「第幾道峰」，所以這份高矮跟著

  vec2 surfLine(vec2 p, vec2 d, float k, float w, float r, float seed, float t) {
    float u = dot(p, d);                        // 沿著行進方向
    float v = dot(p, vec2(-d.y, d.x));          // 沿著峰線方向

    float amp  = 0.42 + 0.92 * sqrt(noise(vec2(v * 5.0 + seed, n * 0.83 + seed)));
    float body = surfFace(q, r);
    float brk  = smoothstep(0.72, 1.15, amp);                     // 這一段崩了多少
    float cap  = 1.0 - brk * 0.45 * smoothstep(0.55, 1.0, body);  // 崩掉的峰頂被削平
    // 白沫只落在峰後的陡面上，尾巴在下一道浪來之前收乾淨
    float foam = brk * smoothstep(0.88 - r, 1.02 - r, q) * (1.0 - smoothstep(0.86, 1.0, q));
    return vec2(body * amp * cap, foam);

  float fieldBreaker(float x, float z, float t) {

    vec2 b = surfLine(p, vec2(0.55, -0.84), 26.0, 1.90, 0.28, 31.7, t);

    float h = a.x * 0.85 + b.x * 0.45;

    h += sin(x * 27.0 + z * 12.0 - t * 2.40) * 0.19;

    // z 是深度方向，同樣的密度在畫面上被壓成六分之一，密一點反而剛好變成亮痕
    h += (a.y * 0.85 + b.y * 0.45) * (sqrt(noise(vec2(x * 10.0 + t * 0.7, z * 20.0))) - 0.5) * 0.18;

  /* ㉕ 波浪 E：群浪。

     A 是幾道各自獨立的浪包、B 是整片都在動的海、C 是原地上下的駐波。E 是
     第四種：浪一組一組地來，組與組之間水面幾乎是平的。

     骨架是把「包絡」和「載波」分開走：

       包絡 cos(u*kg - t*wg)   波長長、走得慢
       載波 sin(u*k  - t*w)    波長短、走得快

     從群的尾巴長出來、穿過整個群、在群頭消失。這是海上「一組浪過去、平靜
     一陣子、下一組再來」的真正成因，也是 E 和 A 的分水嶺 —— A 的浪包是寫死
     在式子裡的固定窗，E 的群是兩個頻率自己疊出來的，會自己走。

     群還會把水面整個抬起來（lift）—— 一組浪就是一座水丘。這一項不能省：光靠
     振幅調變的話，群只是「浪高浪低」，在這個幾乎側視的鏡頭下被深度洗掉；抬
     起來之後群變成畫面尺度的大丘，丘上的細浪是紋理，兩個尺度疊起來才有層次。
     而且低頻的抬升幾乎不花斜率預算，等於白撿。

     包絡取平方是要讓群與群之間更平（0~1 取平方，中段被壓下去）。兩組的方向
     和速度都不一樣，所以不會同時安靜 —— 拍頻最怕的節點時刻全片死掉，實測
     40 幀（也拉長到 180 秒重驗過）0% 死幀。 */
  float setPulse(vec2 p, vec2 d, float k, float kg, float w, float wg,
                 float ph0, float lift, float g, float t) {
    float u = dot(p, d);
    float e = cos(u * kg - t * wg + ph0) * 0.5 + 0.5;
    e = e * e;
    return e * (lift + sin(u * k - t * w) * g);
  }

  float fieldSets(float x, float z, float t) {
    vec2 p = vec2(x, z);
    // 主群：橫過畫面約兩組，每組三四道浪。少於三道就讀不出「一組」，多了會超出斜率預算
    float h  = setPulse(p, vec2(0.86,  0.51), 46.0, 13.0,  2.10,  0.297, 0.0, 0.40, 0.34, t);
    // 副群：從另一個方向來，兩邊的安靜區才不會重疊
    h += setPulse(p, vec2(0.52, -0.85), 33.0,  9.5, -1.60, -0.230, 2.1, 0.22, 0.22, t);
    h += sin(x * 12.0 + z * 30.0 - t * 2.60) * 0.10;   // 底噪：群與群之間不會完全死掉
    return h - 0.12;
  }

  // ① 漣漪：一個緩慢繞圈的圓心往外送同心圓。用世界座標算距離，圓才是正圓
  //
  //    圓心釘在 uRippleC —— 畫面正中央那一點，JS 端用射線和平面求交算出來的。
  //    原本是拿 uOrigin 偏 z −15 當圓心，那是平面的原點不是畫面中央，看起來會偏。
  //
  //    還留一點繞圈的漂移，水面才有生命感（完全釘死會像貼圖）。幅度是照
  //    「在畫面上跑多遠」訂的，不是照世界單位：這片平面幾乎側著看，同樣一單位
  //    往左右移動比往深處移動明顯得多，所以 x 的幅度要比 z 小。兩者都壓在
  //    畫面半徑的 5% 以內，中心感不會跑掉
  float fieldRipple(vec3 pos, float t) {
    vec2 c = uRippleC + vec2(sin(t * 0.11) * 6.0, cos(t * 0.09) * 10.0);
    float r = length(vec2(pos.x - c.x, pos.z - c.y));
    // 衰減要很緩：1/(1+kr) 的 k 稍微大一點，遠處的環就整個消失，
    // 只剩畫面中央一小圈，看起來像個水盆而不是一片漣漪
    float h = sin(r * 0.24 - t * 1.7) / (1.0 + r * 0.016);
    h += sin(r * 0.61 - t * 2.6) * 0.30 / (1.0 + r * 0.030);
    return h * 1.35;
  }

  /* ⑥ 漣漪 2：石頭投進水裡。

     和 ① 漣漪的差別不是參數，是**結構**。① 是穩態的同心正弦 —— 水面永遠
     在響，沒有開始也沒有結束，所以讀起來是「一片有紋路的水」。要讀成
     「有東西掉進去」，關鍵是三件事：

       ① **波前之外必須是靜的。** 這條最重要。有一圈明確的邊界正在往外推、
          邊界外的水還完全沒被驚動，眼睛才會回推出「剛剛有東西砸下來」。
          穩態正弦做不出這個，因為它每個地方都在動。
       ② **落點要換。** 每一滴掉在不同的地方，不然像節拍器不像水。
       ③ **要重疊。** 前一滴的尾波還在，下一滴就落下。只留一滴的話，
          每次重來都會看到整片水面忽然靜止，破綻很大。

     做法：把時間切成一段一段，一段一滴；同時累加最近三滴（前兩滴還在
     衰減），再開兩條週期不同的水滴流，節奏才不會整齊得像機器。 */
  const float DROP_SPEED = 28.0;    // 波前往外推的速度（世界單位／秒）

  float oneDrop(vec2 p, float n, float seed, float age) {
    // 落點由「第幾滴」決定，所以同一滴在它整個生命裡都待在同一個地方。
    // z 的幅度比 x 大：這片平面幾乎側著看，往深處移動在畫面上跑得比較少
    vec2 c = uRippleC + (vec2(hash11(n * 7.3 + seed), hash11(n * 11.9 + seed)) - 0.5)
                        * vec2(36.0, 62.0);
    float r = length(p - c);
    float d = age * DROP_SPEED - r;          // > 0 表示波前已經掃過這裡
    if (d < 0.0) return 0.0;                 // 還沒被驚動的水面：完全平

    /* 波前後面拖著一整串環，離波前越遠越弱；相位再隨時間跑，環會穿過波包往內走。

       這三個數字決定「層次」和「厚度」，一開始都設得太保守：
         0.55 是環的疏密（波長約 11 個世界單位）。原本 0.30 太疏，
              落下一秒後整條半徑上只數得到 2 圈，看起來是一條孤單的弧線。
         0.008 是尾巴的衰減。原本 0.020 讓環只拖 50 單位就沒了。
       改完之後落下一秒就有 5 圈，三秒半有 18 圈。 */
    float ring = sin(d * 0.55 + age * 1.6) * exp(-d * 0.008);
    ring *= exp(-age * 0.45) / (1.0 + r * 0.008);   // 隨時間衰減、離落點越遠越弱
    /* 撞擊當下的凹陷。半秒就沒了，但那半秒是「被砸到」和「在盪漾」的差別。
       它不跟著 ring 的倍率放大 —— 一起放大的話落點會變成一根尖釘，
       粒子擠在那一小塊上，亮度和過曝都不划算 */
    float hit = exp(-r * r * 0.012) * exp(-age * 5.5) * 1.1;
    return ring * 1.8 + hit;
  }

  /* 「靜的水面」和「夠多的層次」是一組要一起調的取捨，兩邊都會翻車。

     太慢衰減：第一版 exp(-age × 0.42) 配三滴，實測 97% 的水面隨時都在
     某個波前之內 —— 到處都在動就退化成「一片有紋路的水」，也就是 ① 漣漪。
     太快衰減：第二版收到 0.70，靜是靜了，但整滴撐不到 60 個世界單位就死光，
     環永遠只出現在畫面正中央一小塊，而且落下一秒只有 2 圈。

     現在這組（0.45 配三滴、波前 28）落下一秒 5 圈、三秒半 18 圈，最外圈
     推得到 140 單位（畫面半寬約 150），而同一個判準下仍有 68% 的水面是靜的。
     衰減放慢就必須從兩滴改回三滴：只留兩滴的話尾波被切掉時還剩 3.6%，
     會看到一階；三滴是 0.7%，看不出來。 */
  float fieldRipple2(vec3 pos, float t) {
    vec2 p = vec2(pos.x, pos.z);
    float h = 0.0;
    for (int s = 0; s < 2; s++) {
      float period = 3.7 + float(s) * 1.0;   // 兩條流的週期錯開，不會同步
      float seed = float(s) * 53.0;
      for (int k = 0; k < 3; k++) {
        float n = floor(t / period) - float(k);
        h += oneDrop(p, n, seed, t - n * period);
      }
    }
    return h;
  }

  /* ⑯ 漣漪 C：干涉。

     A 是一個源穩定地送同心圓、B 是一顆顆石頭落下的暫態。C 是第三種幾何：
     **兩個源，同相位、同頻率**。兩組圓交疊，等相位差的地方連起來是一組
     雙曲線 —— 不是圓。這是干涉條紋的標準形狀（楊氏雙狹縫那個）。

     兩個源必須**完全同相同頻**，條紋才會定住。相位或頻率一有差，條紋就會
     整組漂移，看起來又變回「一片會動的水」，A 已經是那個了。

     源的深度也錯開一點（±7）：兩個源如果在同一條深度線上，條紋會和畫面
     正交，看起來像百葉窗而不是干涉。 */
  float fieldInterfere(vec3 pos, float t) {
    vec2 p = vec2(pos.x, pos.z);
    float r1 = length(p - (uRippleC + vec2(-27.0,  7.0)));
    float r2 = length(p - (uRippleC + vec2( 27.0, -7.0)));
    float h = sin(r1 * 0.30 - t * 2.0) / (1.0 + r1 * 0.014)
            + sin(r2 * 0.30 - t * 2.0) / (1.0 + r2 * 0.014);
    return h * 1.05;
  }

  /* ㉖ 漣漪 D：捲波。

     A / B / C 的波前都垂直於半徑（同心圓、擴散中的圓、兩組圓的交疊）。
     D 換掉的就是這一條：波前和圓周之間有一個固定不為零的夾角，等相位線
     因此不是圓而是阿基米德螺旋 —— 心臟電生理裡那種捲曲波。

       相位 = K·r − 臂數·θ − Ω·t
       相位固定時 r = (臂數·θ + Ω·t) / K，一條螺旋；t 一增整條往外長，
       同時整組以 Ω/臂數 的角速度剛體旋轉。「往外送」和「在轉」是同一件事，
       不是兩個疊上去的動作。

     ── 臂數為什麼要到 8 ──
     波前偏離圓周的角度是 atan(臂數 / (K·r))，會隨半徑衰減。教科書上真正的
     旋波只有 1 條臂，r 超過 1/K 約 4 個世界單位就塌回同心圓了 —— 而畫面看到
     的幾乎整片都在「遠處」，做出來只會是一個會轉的 A。臂數拉到 8 之後
     r = 25 / 60 / 87 的夾角是 53° / 29° / 21°，一路斜到畫面邊緣才讀得出在捲。
     這也是為什麼要押在斜的結構上：沿 x 軸對齊的帶會變成一條條橫紋。

     ── 核心為什麼要空 ──
     切向的相位梯度是 臂數/r，r 趨近 0 會發散，中心那一小塊的臂距會縮得比
     粒子間距還小，變成摩爾紋。乘上 r²/(r²+81) 之後梯度被夾在 臂數/(2×9)
     以內，數學上就不可能超取樣。而旋波本來就有相位奇點、核心是空的，
     所以這一步同時是物理正確和取樣正確。

     ── 意外的好處：對比 ──
     核心洞把峰值推到 r 約 20（中段最亮），第一版沿用 A 的緩衰減 0.016，
     結果 r = 25~87 的振幅一路都在 0.48~0.63 之間 —— 整片太均勻，畫面密度的
     變異係數只有 0.605，低於家族下限。改成 0.030 之後中段亮、外圍暗，
     對比升到 0.699。但不能再快：A 的註解已經寫過「衰減稍微大一點遠處的環
     就整個消失，只剩畫面中央一小圈」。0.030 的外緣振幅還有峰值的 53%
     （A 是 42%），沒有退化成水盆。

     第二層刻意取 3 臂 —— 和 8 互質。兩層的臂數若有公因數，整組會鎖成一個
     規律的風車；互質才會一直錯開，臂看起來會分岔、會纏。它的角速度也比
     主層快（1.15/3 對 1.90/8），兩層互相攪動，畫面才不像機械轉盤。 */
  float fieldSpiral(vec3 pos, float t) {
    // 核心慢慢遊走 —— 真實的旋波核心本來就會遊走。和 A 一樣，x 的幅度
    // 要比 z 小：這片平面幾乎側著看，同樣一單位往左右移動比往深處明顯得多
    vec2  c  = uRippleC + vec2(sin(t * 0.13) * 5.0, cos(t * 0.10) * 9.0);
    vec2  d  = vec2(pos.x, pos.z) - c;
    float r  = length(d);
    float a  = atan(d.y, d.x + 1e-6);       // atan(0,0) 在規格裡未定義，加 1e-6 擋住
    float rr = r * r;
    // 主層：8 臂，徑向波長 26 個世界單位（沿 z 取樣 30 顆／波，很安全）
    float h  = sin(r * 0.24 - 8.0 * a - t * 1.90)
               * (rr / (rr + 81.0)) / (1.0 + r * 0.030);
    // 第二層：3 臂、轉得比較快、走得比較慢，把主層的臂撕開
    h += sin(r * 0.44 - 3.0 * a - t * 1.15)
         * 0.32 * (rr / (rr + 36.0)) / (1.0 + r * 0.055);
    return h * 1.94;
  }

  /* ㉗ 漣漪 E：順流。

     A / B / C 的環都是同心的（或兩組各自同心的疊起來）。E 拿掉「同心」：
     源固定在原地，但水在流，所以每一圈環一邊往外長、一邊被沖走 ——
     環還是正圓，圓心卻一個比一個偏。逆流那側環擠密、順流那側拉疏，
     這就是水面上的都卜勒。

     解是解析的，不必迴圈也不必累加好幾圈：age 秒前送出的那一圈，半徑是
     V·age、圓心已經被沖到 U·age·n，所以某一點的相位年齡滿足

       |d − U·age·n| = V·age
       → age²(V²−U²) + 2·age·U·(d·n) − |d|² = 0        取正根

     相位就是 Ω·(t − age)。只要波速大於流速，判別式恆正，一個 sqrt 解決，
     成本比 A 的兩個 sin 還低。

     ── 流向為什麼一定要押在 x 軸（這是整支的成敗）──
     第一版把流向設在 1.9 弧度，那幾乎指向 z。量出來特徵數只有 2.1，剛好
     卡在家族下限 —— 疏密的差別全落在深度方向，而深度在畫面上被壓扁，
     等於白做。流向轉到 x 軸之後特徵數跳到 3.7。
     附帶一提，x 軸的粒子間距只有 0.26 個世界單位（z 是 0.87），所以押在 x
     上還可以把逆流側壓得更密而不會產生摩爾紋 —— 兩個理由都指向同一軸。

     流速比 U/V = 0.65：逆流側環距 9.3、順流側 43.7，差 4.7 倍。這個比值就是
     「看不看得出在流」的全部；再高會讓逆流側的環距逼近粒子間距。

     衰減吃的是 path = V·age（波實際走過的路程）而不是 r：同樣的距離，
     逆流側的波繞了比較遠才到，本來就該比較弱。這剛好讓「擠密」的那一側
     不會因為粒子堆疊而過曝，物理正確和曝光安全在這裡是同一件事。

     流向以 +x 為中心左右擺 ±34 度，密的那一側因此會在畫面上緩緩掃過去。
     擺幅刻意不大：擺太快的話 age 對時間的偏導會吃掉 Ω，遠處的波會忽快忽慢，
     看起來像卡頓。 */
  float fieldDrift(vec3 pos, float t) {
    float ang  = sin(t * 0.09) * 0.60;                  // 流向：以 +x 為中心左右擺
    vec2  n    = vec2(cos(ang), sin(ang));
    vec2  c    = uRippleC + vec2(sin(t * 0.12) * 4.0, cos(t * 0.07) * 7.0);
    vec2  d    = vec2(pos.x, pos.z) - c;
    float pr   = dot(d, n);
    // V = 8.0（波速）、U = 5.2（流速）；k = V²−U² = 36.96，波速大於流速所以恆正
    float k    = 36.96;
    float age  = (-5.2 * pr + sqrt(27.04 * pr * pr + k * dot(d, d))) / k;
    float path = 8.0 * age;                             // 這道波實際走過的路程
    return sin((t - age) * 1.90) / (1.0 + path * 0.016) * 1.38;
  }

  /* 舊的「沙丘 A」：三層雜訊疊出大尺度的丘陵，再用 pow 把稜線壓成緩坡＋陡背。
     這一支已經沒有按鈕會叫到（② 改成山岳了），留著是備案 —— 把 fieldAt() 裡
     的 ② 換回它就整個回來。沒被呼叫的函式編譯時會被拿掉，不佔成本。 */
  float fieldDune(float x, float z, float t) {
    vec2 q = vec2(x * 3.4 + t * 0.06, z * 3.4);
    float n = noise(q) * 0.62 + noise(q * 2.4 + 7.0) * 0.26 + noise(q * 5.3 + 19.0) * 0.12;
    return pow(clamp(n * 2.6, 0.0, 1.0), 0.75) * 2.0 - 0.75;
  }

  /* 舊的「沙丘 B」：風稜。⑨ 改成山岳 C 峽谷之後就沒有按鈕會叫到了，
     留著是備案（沒被呼叫的函式編譯時會被拿掉，不佔成本）。

     和舊沙丘 A 的差別是兩個運算子，不是參數：

       ① **脊線雜訊**（1 - |2n-1|）。一般雜訊的極大值是圓的，堆出來是
          一顆一顆饅頭；取絕對值之後極大值變成一條**摺線**，堆出來是稜。
       ② **座標扭曲**（domain warp）：先用另一層雜訊把取樣座標本身推歪，
          再去取脊線。稜線因此會彎、會分叉、會互相纏 —— 這是圓丘怎麼疊
          都疊不出來的。

     最後 pow 1.8 把低的地方壓得更低：大部分是平坦的沙盤，只有稜凸出來。
     實測陡度 11.0，② 沙丘是 4.4；起伏面積 46.9% 對 84.1%。 */
  float ridged(vec2 q) { return 1.0 - abs(noise(q) * 2.0 - 1.0); }

  /* ② 山岳 A：山脈全境。

     ── 這一支改了兩次才對，前兩次錯在同一個地方 ──

     前兩版都在優化**側面的天際線**（下緣那條輪廓），但那是「從側面看一座
     山」。要的是**從高角度俯拍整片山脈**，那看的是平面上的地形紋理：
     稜谷網絡鋪滿整片。兩者要調的東西完全不同。

     量測台上這兩件事分得很開（指標見 scratchpad 的 terrain-harness）：

                          特徵數   畫面對比   稜線面積   高地面積
       第 1 版（太懸殊）    1.5     0.680      4.3%      15.9%
       第 2 版             1.7     0.586      3.3%      42.0%
       這一版              6.0     0.852     12.8%      37.7%

     「特徵數」是橫過畫面數得到幾座山。1.7 就是一顆山，不是全境。

     ── 關鍵的一行：先開根號再折 ──

     這裡沒有用內建的 ridged()。原因是 noise() 回傳的是 res 的**平方**，
     所以 ridged() 的折點落在 res 的第 84 百分位 —— 折出來只是「每個丘頂
     外圍繞一圈」，圈跟圈不相連，那不是網絡。

     先 sqrt() 還原成 res 再折，折點就落在中位數，剛好過滲流門檻，稜線才
     會接成長距離、會分岔的樹枝狀網絡。**這一步是「全境」和「一顆山」的
     分水嶺。**

     ── 加權要溫和 ──

     第二、三層乘的是 (0.65 + 0.35 × 上一層)，底留得很高。多重碎形的加權
     太強會把非主稜的地方歸零，就退回「一座孤立大山」—— 第 2 版特徵數只有
     1.7 正是死在這裡。

     ── 值域是構造上鎖死的 ──

     三層權重加起來剛好 1.0，每層又都在 0~1，所以 s 必定落在 0~1，輸出永遠
     在 −0.75 ~ 1.65。不必靠取樣猜值域，跑到 t=60000 也不會漂出去。

     ── 兩層不是三層 ──

     原本三層，最細那層（頻率 4.1 倍）拿掉了。畫面上的特徵密度從 6.0 降到
     4.3、稜線面積從 12.8% 降到 7.2%，山脈的骨架完全不變，只是不再長滿細碎
     的支稜。主頻維持 4.8 —— 減的是**細節**不是**尺度**，山的大小沒有變。

     成本：noise() 只呼叫 2 次（最早的版本是 6 次）。最高空間頻率 10.6 個
     週期，每波長 23 顆粒子，離「變成雜訊」那條線很遠。 */
  float fieldPeaks(float x, float z, float t) {
    // 一個畫面寬約 4.8 個山塊。時間只做很慢的平移 —— 地形是漂移，不是波動
    vec2 q = vec2(x * 4.8 + t * 0.045, z * 4.8);

    float a = 1.0 - abs(sqrt(noise(q)) * 2.0 - 1.0);
    float b = (1.0 - abs(sqrt(noise(q * 2.2 + 17.0)) * 2.0 - 1.0)) * (0.65 + 0.35 * a);

    float s = a * 0.545 + b * 0.455;      // 兩個權重相加剛好 1，s 必定在 0~1
    // 1.16 次方：谷地壓寬、稜線留尖，順便把平均值拉到區間中央。
    // 單調映射不會動到局部極大的位置，所以稜線網絡完全不受影響
    return pow(max(s, 0.0), 1.16) * 2.40 - 0.75;
  }

  float fieldDune2(float x, float z, float t) {
    vec2 q = vec2(x * 3.0 + t * 0.045, z * 3.0);
    vec2 w = vec2(noise(q * 1.7 + 13.0), noise(q * 1.7 + 61.0)) * 2.0 - 1.0;
    vec2 p = q + w * 1.35;                // 推歪的幅度比一個雜訊格還大，稜才會真的彎
    float r = ridged(p) * 0.58 + ridged(p * 2.3 + 5.0) * 0.28 + ridged(p * 4.7 + 17.0) * 0.14;
    return pow(clamp(r, 0.0, 1.0), 1.8) * 2.2 - 0.30;
  }

  /* ⑨ 山岳 C：峽谷。

     結構是「稜」的相反：先鋪一片幾乎平的高台，再用等高線帶從高台上**挖**
     下去。A 是從平地長出山，B 是從高台切出谷 —— 這是兩者最大的差別，
     反映在高地面積上：A 是 37.7%，B 是 68.4%。

     ── 谷網怎麼來的 ──

     三張獨立的低頻噪音各取**一條等高線**（取在分布的尾巴 0.64，所以線很稀，
     谷才會「少而深」），三條取聯集就是主谷網。第四張場再乘上「離主谷多近」
     的權重，只在主谷兩側長出來、越遠越淺 —— 那是樹枝狀支溝的來源。

     ── 減複雜度時，這一支只能從「岩層紋」減，不能動谷網 ──

     踩過一次：減複雜度時把第三張場和支溝都砍了，結果**六成的面積完全沒被
     動到**（A 是 27.6%、C 是 35.1%），畫面上變成一片均勻的紗加兩道溝，
     整支被打回票。

     原因是這支和 A、C 不一樣：**峽谷是負空間**。這片塵靠「粒子被推到哪裡
     堆起來」才長出東西，而谷是在一片本來就平的天花板上挖凹槽 —— 谷一少，
     就什麼都沒有了。A 的稜、C 的峰都是正的，砍細節不會讓畫面變空。

     所以谷網（三張＋支溝）全部是骨架，一根都不能少；要減複雜度只能減
     岩層紋，那才是這一支的細節層（對應 A 拿掉的最細碎形、C 拿掉的山體細紋）。

     為什麼用「多張低頻場」而不是「單張高頻場」來湊谷的條數：**場的頻率一高，
     它自己的梯度就大，等高線帶換算到空間上會縮成細線**。谷壁一細，粒子就擠
     成一條亮線，那正是過曝的來源。三張低頻場的帶寬各自和自己的頻率成正比，
     所以三條谷的谷壁在畫面上一樣寬（約 8 顆粒子）。

     ── smoothstep 一律用遞增的寫法 ──

     這裡的遮罩是「離谷心越近越深」，直覺會寫成 smoothstep(大, 小, x)。
     但 GLSL ES 規格明寫 **edge0 >= edge1 時結果未定義** —— 實務上每家都算得
     出來，那是靠實作不是靠規格。改用 1.0 - smoothstep(小, 大, x)，數學上
     完全等價（逐點驗過差 5.6e-16，純浮點雜訊），而且是有定義的。

     ── 高台不能是死平的 ──

     完全平的面上每一顆粒子都會被判成局部極大。留一層很緩的起伏（振幅只有
     0.22）才是高原，不是桌面。減 0.29 是因為 noise() 有平方，平均落在 0.29
     而不是 0.5。

     ── 岩層細褶皺 ──

     沿深度方向的低振幅波紋（雅丹地貌那種風蝕紋理）。畫面對比幾乎全靠它：
     粒子會在 dh/dz 接近某個臨界斜率時擠成亮帶，而斜率＝振幅×頻率，所以
     「高頻率、低振幅」能買到斜率又不破壞高台的平坦感。相位借用高台那張
     噪音，省一次 noise，順便讓紋理跟著地形一起漂。

     頻率從 4.5 放疏到 3.2 就是這一支的減複雜度。再往下減的話對比會垮：
     紋全拿掉是 0.581、放到 2.4 是 0.738，3.2 還有 0.835。這支能減的空間
     比 A、C 小，因為它的畫面對比是靠細節層撐的，不是靠骨架。

     成本：noise() 呼叫 5 次。 */
  float fieldCanyon(float x, float z, float t) {
    vec2 q = vec2(x * 2.0 + t * 0.045, z * 2.0);

    float pn = noise(q * 2.40 + 3.0);
    float plateau = (pn - 0.29) * 0.22;

    float dA = abs(noise(q * 1.5525 + 11.0) - 0.64);
    float dB = abs(noise(q * 2.1275 + 41.0) - 0.64);
    float dC = abs(noise(q * 2.8175 + 71.0) - 0.64);
    float trunk = max(max(1.0 - smoothstep(0.0183, 0.1146, dA),
                          1.0 - smoothstep(0.0251, 0.1570, dB)),
                          1.0 - smoothstep(0.0333, 0.2080, dC));

    float dD = abs(noise(q * 3.7950 + 97.0) - 0.64);
    float near = max(max(1.0 - smoothstep(0.1146, 0.2979, dA),
                         1.0 - smoothstep(0.1570, 0.4083, dB)),
                         1.0 - smoothstep(0.2080, 0.5407, dC));
    float cut = max(trunk, (1.0 - smoothstep(0.0359, 0.2241, dD)) * near * 0.60);

    float strata = sin((q.y * 3.2 + q.x * 0.6 + pn * 1.2) * 6.2831853);

    return 0.91 + plateau + strata * 0.15 - 1.30 * cut;
  }

  /* ⑭ 山岳 B：群峰（喀斯特，桂林、張家界那種）。

     三款的差別是三種完全不同的地形骨架：

       A 山脈全境  從平地長出連綿的稜谷網絡      高地面積 37.7%
       B 群峰      平地上散布一顆顆獨立的峰      高地面積 28.1%
       C 峽谷      從高台切出樹枝狀的谷          高地面積 68.4%

     ── 骨架是格點，不是碎形 ──

     把平面切成格子（每軸 5.2 格），每格長一座峰，掃 3×3 鄰域取最高的那座。
     峰與峰之間自然留白 —— 這是「離散、可數」的來源，碎形做不出來。

     格數原本是 8.4，減複雜度時降到 5.2、山腳從 0.66 放大到 0.72，並且拿掉
     山體細紋：峰變少變大，畫面上的特徵密度從 6.7 降到 4.6。相鄰粒子的最大
     高度差也從 0.142 降到 0.076，是三款裡最緩的。

     先做一次域扭曲把座標推歪，格子的規則感才不會被眼睛抓到。頻率只有 3.0，
     推的是大範圍，峰的輪廓不會被扯爛。

     ── 峰形：0.62 次方是「有山體」和「插柱子」的分水嶺 ──

     峰形用寬緩的山腳（apron）加窄陡的山體（core）疊出層次，再取 0.62 次方。
     指數小於 1 會把腰身撐開、頂部壓圓。**指數拉到 1.0 以上時高地面積會從
     28% 掉到 17%** —— 那就是被打回票的「平地插柱子」。錐峰把質量全堆在頂端，
     中點以上根本沒有面積。

     峰頂盤面直徑 0.072，但**山腳直徑是 0.157**，最小的一座也有 24 顆粒子寬，
     不是針。相鄰粒子的最大高度差 0.142，和舊沙丘的 0.132 同一個量級。

     ── 平地開根號去偏 ──

     noise() 回傳的是平方，分布擠在低端。平地那層不開根號的話會變成「大半
     貼地、偶爾一個包」，很假；開根號還原成 res 才是真正的滾動地形。

     成本：noise() 只呼叫 2 次（域扭曲、平地各一），迴圈裡完全沒有 noise，
     只有 27 次很便宜的 hash11。 */
  float fieldKarst(float x, float z, float t) {
    float w  = noise(vec2(x * 3.0 + t * 0.045 + 3.0, z * 3.0 + 3.0));
    float wx = x + (w - 0.29) * 0.030;      // 減 0.29 是因為 noise 有平方，平均落在 0.29
    float wz = z + (w - 0.29) * 0.024;      // 兩軸推的量不同，免得整片一起平移

    vec2 p  = vec2(wx * 5.2 + t * 0.045, wz * 5.2);
    vec2 ip = floor(p);
    vec2 fp = p - ip;

    float peak = 0.0;
    for (int i = -1; i <= 1; i++) {
      for (int j = -1; j <= 1; j++) {
        vec2  c  = vec2(float(i), float(j));
        float s  = (ip.x + c.x) * 127.1 + (ip.y + c.y) * 311.7;
        float jx = hash11(s);                       // 峰心在格內的位置
        float jz = hash11(s + 51.7);
        float hg = hash11(s + 113.3);               // 峰高
        float sz = fract(hg * 7.31 + jx * 3.17);    // 峰的大小，從既有亂數再榨一組

        // 峰心留 0.11 的邊界，峰才不會貼在格線上露出馬腳
        vec2  ctr = c + vec2(0.11 + 0.78 * jx, 0.11 + 0.78 * jz);
        float rad = 0.72 * (0.62 + 0.76 * sz);      // 大峰小峰混雜
        float d   = length(fp - ctr) / rad;

        if (d < 1.0) {
          float apron = 1.0 - smoothstep(0.0, 1.0,  d);   // 山腳那一圈緩坡
          float core  = 1.0 - smoothstep(0.0, 0.72, d);   // 山體立起來的部分
          float f = 0.85 * apron + 0.15 * core;
          // max 是保護：d 逼近 1 時底數會到 0，pow(0, y) 在部分驅動會回 NaN
          f = pow(max(f, 1e-5), 0.62);
          peak = max(peak, f * (0.5 + 0.5 * hg));   // 峰高 0.5~1.0，遠近層次才讀得出來
        }
      }
    }

    float plain = sqrt(noise(vec2(x * 8.0 + t * 0.045 + 11.0, z * 8.0 + 11.0))) * 0.13;
    return peak * 1.42 + plain - 0.177;
  }

  /* ㉘ 山岳 D：斷塊。

     骨架是直線的排列，不是雜訊的等值面（A）、不是格點（B）、也不是等高線
     帶挖出來的負空間（C）。兩組交叉的斷層把整片切成一塊塊，每塊高度不同、
     而且整塊向同一側傾斜 —— 塊界是崖。

     ── 這一支花最久的一件事：崖要朝哪邊 ──

     前四版都寫成「塊面緩升、到塊界掉下去」，畫面對比卡在 0.54~0.66 怎麼調都
     上不去。補一層等向的碎形細紋硬把數字推到 0.89 之後，印俯視圖一看 ——
     長得跟 A 一模一樣，等於白做。

     原因在投影式：screenY = 481·z − 74.6·h，所以粒子只在 dh/dz 約 +6.45 的
     地方堆積成亮痕，只有一個正負號。「掉下去」的崖是負的，一顆都不堆。
     所以改成「塊面緩降、崖面朝 +z 陡升」，兩組斷層的法線都取 y 為正。
     實測最陡的 2% 的點 100% 都是正坡，崖的方向確實是對的。

     ── 但對比的主力不是崖，是塊面 ──

     這裡有一個反直覺的量測結果，值得記下來。崖雖然方向對，卻太陡、衝過了
     6.45 那個堆積點：落在堆積窗（6.45 上下兩成）的面積只有 6.9%。
     把整支翻面（讓寬緩的塊面去帶正坡、崖朝反邊）反而是 16.7%，畫面對比從
     0.915 升到 1.174。因為對比來自「落在臨界坡度附近的面積」，而寬緩的面
     面積大得多 —— 崖再亮也只是一條細線。

     那為什麼還是用現在這一版？翻面之後高地面積會從 52% 跳到 64.5%，和 C
     峽谷的 68.3% 撞在一起，五款「高地面積拉開」的設計就毀了。這裡是拿對比
     換辨識度，不是漏看。

     順帶一提，崖寬佔一塊的比例實測 0.12 → 對比 0.647、0.22 → 0.806、
     0.30 → 0.897，所以取 0.30 —— 同一個道理，崖越寬越多面積落在窗內。

     ── 斷層線的角度 ──

     兩族線分別落在 120 度和 56 度，都離 x 軸很遠。沿 x 軸的帶狀結構在這個
     鏡頭下會變成一條條橫紋，這一族的「層巒」就是這樣死的。

     ── pow(ft, 1.3)：塊面微凹 ──

     塊面若是純平面，高地面積落在 40%，和 A 的 40.3% 完全撞在一起。次方拉到
     1.3 讓塊面大半留在高處、只有靠崖那一小段陡降，高地面積推到 52%，
     正好卡在 A（40.3%）和 C（68.3%）中間。這是單調變形，不動局部極大。

     ── 值域是構造上鎖死的 ──

     每一條 faultStep 必定落在 [−drop, base]，兩條相加落在 [−1.0, 0.52]，
     加上細紋的 0~0.20，所以 clamp 前的量必定在 [−1.0, 0.72] —— 那個
     0.5814 就是 1/1.72。輸出恆在 −1.30~1.30，實測 −0.62~1.19。 */

  // 一組斷層：沿 t 方向切成一塊塊。塊面向 −z 緩降 drop，最後 30% 是崖、陡升回來。
  // 塊高 b 也在同一段換到下一塊，所以整條式子處處連續 —— 完全垂直的崖會讓
  // 崖上那一排粒子落在同一條線上，在近乎側視的鏡頭下會裂成浮空碎片。
  float faultStep(float t, float seed, float drop, float base) {
    float it = floor(t);
    float ft = t - it;
    float e  = smoothstep(0.70, 1.0, ft);          // 遞增寫法；反向的 smoothstep 在規格上未定義
    float b0 = hash11(it * 127.1 + seed);          // 乘 127.1 這種大而不整的數，小整數才不會撞
    float b1 = hash11((it + 1.0) * 127.1 + seed);
    // max 是保護：pow(0, y) 在部分驅動會回 NaN
    return mix(b0, b1, e) * base - drop * pow(max(ft, 1e-5), 1.3) + drop * e;
  }

  float fieldFault(float x, float z, float t) {
    // 一個畫面寬約 7 個構造單元。時間只做很慢的平移 —— 地形是漂移，不是波動
    vec2 q = vec2(x * 7.0 + t * 0.045, z * 7.0);

    // 斷層跡不是尺畫出來的：先用一張很低頻的噪音把座標推歪，線才會緩緩彎。
    // 兩軸推的量不同，免得整片只是平移。減 0.29 是因為 noise() 有平方，平均落在 0.29
    float w = noise(q * 0.45 + 5.0) - 0.29;
    vec2  p = q + vec2(w * 0.55, w * 0.40);

    // 兩組共軛斷層。法線的 y 分量都取正 —— 這樣兩族崖面都朝 +z（鏡頭深處）立起來
    float u = p.x *  0.866 + p.y * 0.500;          // 斷層線落在 120 度
    float v = (p.x * -0.829 + p.y * 0.559) * 0.90; // 斷層線落在  56 度，密度刻意錯開

    float blocks = faultStep(u, 11.0, 0.55, 0.28)
                 + faultStep(v, 71.0, 0.45, 0.24);

    // 細節層：塊體本身的岩紋。先 sqrt() 再折，折點才落在中位數（和 A 同一個理由）。
    // 這一層是可以減的複雜度，骨架（塊與崖）不能動
    float grain = 1.0 - abs(sqrt(noise(p * 1.6 + 31.0)) * 2.0 - 1.0);

    return clamp((blocks + grain * 0.20 + 1.0) * 0.5814, 0.0, 1.0) * 2.60 - 1.30;
  }

  /* ㉙ 山岳 E：方山。

     骨架是一張低頻場的水平切面：切面以上留下來的就是桌狀殘丘 —— 頂面同高、
     邊緣是崖；以下被剝蝕成低地，低地上長滿細溝。

     五款的高地面積因此拉得很開：
       E 方山 18.1%　B 群峰 36.8%　A 山脈 40.3%　D 斷塊 52.0%　C 峽谷 68.3%

     ── 桌子的大小就是 1/K，只能靠拉高 K ──

     第一版 K 取 2.6，長出來是兩坨大台地、特徵數 1.9 —— 又是「一顆山」那個坑。
     桌子要多就得拉高 K，代價是場自己的梯度變大、崖在空間上縮窄。所以門檻帶寬
     寫成正比於 K（0.030 × 7.8 = 0.234），崖在畫面上的寬度才不隨 K 改變。

     ── 低地不能是平的 ──

     第二個坑：八成的面積如果沒有起伏，對比封頂在 0.62，怎麼加桌子都沒用
     （平坦的地方粒子均勻攤開，不會堆積）。細溝不是裝飾，它是這一支讀得出來的
     全部理由。但細溝的振幅（0.90）必須小於桌高（1.25），否則高地面積就
     不再等於桌面面積，會從 18% 跳到 40~64%，桌子等於被自己的低地淹掉。

     ── 遮罩的第二個八度決定崖線的總長度 ──

     1.7 倍頻時桌子的外形曲折、崖線長，對比 0.886；換成 2.1 倍外形變圓，
     對比掉到 0.821。試過用 min(兩張場) 取交集，桌子更多更有稜角，但 min 的
     摺線讓相鄰粒子高度差衝到 0.46~0.50，超過現有三款的上限，只好放棄。

     ── 頂面不能是死平的 ──

     完全平的面上每一顆粒子都會被判成局部極大，量測台的特徵數和稜線面積會被
     灌水。所以留一層很緩的起伏（m − 0.5 那一項），而且桌面上仍保留兩成的細溝。 */
  float fieldMesa(float x, float z, float t) {
    // 一個畫面寬約 7.8 個殘丘尺度。時間一樣只做很慢的平移
    vec2 q = vec2(x * 7.8 + t * 0.045, z * 7.8);

    // 殘丘的平面形狀：兩個八度的低頻場。第二個八度只有 1.7 倍 —— 它決定
    // 桌子外形有多曲折，也就是崖線有多長，而崖線就是亮痕的來源
    float m = sqrt(noise(q)) * 0.58 + sqrt(noise(q * 1.7 + 23.0)) * 0.42;

    // 兩階桌面。帶寬 0.234 是「0.030 × K」—— 跟著 K 走，崖在畫面上才一樣寬
    float top1 = smoothstep(0.650, 0.884, m);
    float top2 = smoothstep(0.770, 1.004, m);

    // 惡地的細溝。先 sqrt 再折，折點落在中位數、剛好過滲流門檻，
    // 溝才會接成會分岔的網絡而不是一圈一圈的孤島
    float rill = 1.0 - abs(sqrt(noise(q * 1.5 + 41.0)) * 2.0 - 1.0);

    // 桌面上細溝只留兩成（硬岩帽層擋住了），但不能歸零 —— 死平的頂面
    // 會讓每一格都被判成局部極大。最後那一項是頂面與低地共用的緩起伏
    return top1 * 1.25
         + top2 * 0.32
         + rill * 0.90 * (1.0 - top1 * 0.80)
         + (m - 0.5) * 0.10
         - 0.38;
  }

  /* 舊的「沙丘 C」：階地。⑭ 改成山岳 C 群峰之後就沒有按鈕會叫到了，留著是備案。

     和 A 用的是**同一組雜訊**，只多做一件事：把高度切成六階。圓丘變成一片
     一片的平台，平台之間是垂直的崖。地形上這叫方山、雅丹的另一種樣貌。

     ── 為什麼平均梯度看不出差別 ──

     階梯和斜坡的**總變化量是一樣的**（都從最低走到最高），所以平均梯度也
     一樣，量到底都是 0.018。要看的是梯度的**分布**：

       沙丘A 圓丘   幾乎沒變的地方 41.9%　最陡的 1% 是平均的  4.9 倍
       沙丘B 風稜   幾乎沒變的地方 26.2%　最陡的 1% 是平均的  5.6 倍
       沙丘C 階地   幾乎沒變的地方 88.7%　最陡的 1% 是平均的 20.7 倍

     階梯就是「絕大部分完全平、少數地方暴衝」，這在平均值裡看不見。

     崖不做成完全垂直（smoothstep 給 0.06 的過渡）—— 完全垂直的話崖上那一排
     粒子會落在同一條線上，亮度容易爆。 */
  float fieldTerrace(float x, float z, float t) {
    vec2 q = vec2(x * 3.0 + t * 0.04, z * 3.0);
    float n = clamp((noise(q) * 0.62 + noise(q * 2.3 + 7.0) * 0.26
                   + noise(q * 4.9 + 19.0) * 0.12) * 2.6, 0.0, 1.0);
    float s = n * 6.0;
    return (floor(s) + smoothstep(0.44, 0.56, fract(s))) / 6.0 * 2.3 - 0.90;
  }

  /* ③ 極光：把平面拉成幾道垂直的光幕，光幕本身沿著深度方向扭。
     pow(abs(sin), 高次方) 是把正弦壓成窄峰的標準手法 —— 峰之間幾乎全平，
     只有幾條窄帶被拉起來，那就是「幕」

     光幕一定要往**下**長。原本回傳負值（往上長），起伏高度就整個失效：
     這片平面本來就頂到畫面上緣，往上推等於把光幕推出畫面。實測起伏高度
     從 0.1 拉到 5.0，畫面最低點永遠停在同一條線（49.1%），覆蓋率反而
     從 39.9% 掉到 26.0% —— 越拉越少。往下長就和其他五個一樣越拉越滿。

     幅度乘 0.55 是為了讓 0.1～5.0 整段滑桿都有作用。不乘的話 h=2 就撐到
     畫面底，後面三分之二的行程看不出差別。乘完的下緣曲線和沙丘幾乎重合 */
  float fieldAurora(float x, float z, float t) {
    float sway = sin(z * 6.0 + t * 0.50) * 0.05 + sin(z * 2.4 - t * 0.30) * 0.11;
    float curtain = pow(abs(sin((x + sway) * 22.0)), 7.0);
    return curtain * (1.32 + sin(z * 9.0 - t * 1.1) * 0.33);
  }

  /* ⑩ 極光 C：皺褶的簾幕。

     ③ 極光是 pow(abs(sin(x))) —— 一排等距的直幕，整排一起左右擺。
     問題出在「等距」和「直」：那是柵欄的性質，不是簾幕的。

     ⑩ 把三件事拆開，每一件都是結構上的改動：

       ① **幕的中心線是一條曲線**，不是 x = 定值。曲線沿著深度方向彎回來，
          才會出現「褶」；直線再怎麼擺也只是整片平移。
       ② **每一幕自己一組相位。** 三幕各自漂、各自明滅，偶爾交錯疊在一起。
          等距排列做不到這件事，因為那是同一條式子生出來的。
       ③ **幕上有射線。** 沿著幕的明暗條紋，是真實極光的招牌。

     幕從七道減到三道、每道加一層很寬很暗的餘暉 —— 少而寬，和 ③ 的
     多而窄剛好相反。峰值收到 1.65，和 ③ 完全一樣。 */
  float fieldAurora2(float x, float z, float t) {
    float h = 0.0;
    for (int k = 0; k < 3; k++) {
      float f = float(k), s = f * 37.0;
      float cx = -0.26 + f * 0.26
               + sin(z * 3.1 + t * 0.33 + s) * 0.100      // 大的褶
               + sin(z * 7.4 - t * 0.21 + s * 2.0) * 0.045 // 小的皺
               + sin(t * 0.13 + s) * 0.060;                // 整幕的慢漂
      float d = x - cx;
      float rays = 0.62 + 0.38 * sin(z * 26.0 + t * 1.9 + s * 3.0);
      // 亮核＋餘暉。餘暉的高斯寬了四倍多，是幕腳下那層散開的光
      h += (exp(-d * d * 900.0) * rays + exp(-d * d * 45.0) * 0.30)
           * (0.9 + 0.5 * sin(t * 0.27 + s));
    }
    return h * 0.76;
  }

  /* ⑮ 極光 B：冕。

     A 是七道平行的直幕、C 是三道會皺褶的簾幕 —— 兩者都是**帶狀**，差別只在
     直和彎。B 換一種幾何：射線從一個點放射出去。真實的極光在磁天頂正上方
     就是這樣，叫冕狀極光。

     關鍵是拿**角度**當變數，不是拿 x。pow(abs(sin(角度 × 7)))、角度繞一圈
     就是七道射線；再乘一個隨半徑衰減的罩子，中心亮、外圍散掉。

     深度方向壓 0.55：這片平面是側著看的，不壓的話射線在深處會攤得太扁，
     看起來不像從一點射出來。 */
  float fieldCorona(float x, float z, float t) {
    vec2 c = vec2(sin(t * 0.11) * 0.10, -0.18 + cos(t * 0.08) * 0.10);
    vec2 d = vec2(x - c.x, (z - c.y) * 0.55);
    float r = length(d);
    float ang = atan(d.y, d.x + 1e-6);       // atan(0,0) 在規格裡未定義
    // 射線本身會沿著半徑扭一點，不然是六根筆直的棒子
    float rays = pow(abs(sin(ang * 7.0 + sin(r * 5.0 - t * 0.5) * 0.8 + t * 0.13)), 5.0);
    float envelope = 1.0 - smoothstep(0.05, 0.62, r);
    return rays * envelope * (1.15 + sin(r * 12.0 - t * 1.6) * 0.35) * 1.10;
  }

  /* ⑱ 極光 D：橫弧。

     A 是等距的直幕、C 是會皺褶的彎幕 —— 兩者的帶子都沿著**深度**走，畫面上
     是一條條垂直的；B 是從一點放射。D 把帶子轉九十度：沿著 x 走、在深度
     方向只有一指寬的一條弧，整組往前後漂。真實極光最常見的形態就是這個：
     東西向橫過天空的弧，一次好幾道平行的，一起往南北推。

     ── 為什麼這個投影下讀得出來 ──

     深度 150 個世界單位在畫面上攤開 481px，所以「弧在哪個深度」直接就是
     「弧在畫面的哪個高度」，讀起來一點都不吃虧。而且弧在深度方向很窄
     （0.135），高度落差在很短的距離內走完 —— ∂h/∂z 約 7.6，超過粒子開始
     堆積的 6.45，所以每道弧會壓出一條亮痕。A/B/C 的深度梯度都在 3 以下，
     沒有一個做到這件事。

     ── 三道弧為什麼共用同一組運動 ──

     第一版三道各漂各的，量起來很漂亮，但那只是採樣沒撞上：漂移相位彼此不
     可通約，跑久了一定會有兩道疊在同一個深度，兩個高斯一加就是兩倍亮。改
     成共用一組推移和彎曲之後，兩千五百個時間點掃下來最大值鎖在 1.32（原本
     理論上摸得到 2.0）。共用還有一個好處：三道弧變成一個「系統」，像真的
     多重弧那樣一起呼吸，而不是三條互不相干的線。

     每道弧仍留 0.035 的自走漂移和 0.020 的自走彎曲，不然三道會是一模一樣
     的平移複本。射線的相位也各給各的（s 的 3 倍和 5 倍）。 */
  float fieldArcs(float x, float z, float t) {
    // 整組共用：一起往前後推、一起彎。這既是多重平行弧的樣子，也是防呆
    float march = sin(t * 0.15) * 0.085;
    float wob   = sin(x * 4.3 + t * 0.24) * 0.055
                + sin(x * 9.1 - t * 0.17) * 0.022;
    float h = 0.0;
    for (int k = 0; k < 3; k++) {
      float f = float(k), s = f * 41.0;
      float cz = -0.31 + f * 0.30 + march + wob
               + sin(t * (0.23 + f * 0.07) + s) * 0.035    // 每道自己的微漂
               + sin(x * 6.2 + t * 0.31 + s) * 0.020;      // 每道自己的微彎
      float d = (z - cz) / 0.135;
      /* 弧上的射線。兩個不成比例的頻率疊起來，亮暗才不會是等距的 ——
         等距是 A 的性格，單一頻率會撞在一起。0.50 的底讓射線谷底幾乎全黑，
         弧看起來是一段一段的，那才像真的射線弧 */
      float rays = 0.50 + 0.28 * sin(x * 31.0 + t * 1.1 + s * 3.0)
                        + 0.17 * sin(x * 17.3 - t * 0.7 + s * 5.0);
      h += exp(-d * d) * rays * (1.0 + 0.26 * sin(t * 0.29 + s));
    }
    return h * 1.10;
  }

  /* ⑲ 極光 E：脈斑。

     A/C 是帶、B 是放射 —— 三個都是連通的一整片。E 換成不連通的：幾塊
     互相分開的斑，各自亮、各自暗。這是彌散極光裡的脈動斑塊，和幕狀極光是
     兩種不同的東西。

     ── 斑的形狀來自「過門檻的雜訊」，不是格子 ──

     用格子分斑的話，斑的大小和間距會一模一樣，一眼看得出是格子。拿一張
     雜訊切門檻，大小、形狀、間距全部是隨機的。

     門檻高度是關鍵。過門檻的面積如果超過大約一半，亮區會滲流成一整片
     大陸，就不是斑了。實測門檻 0.44 時亮面積約 23%，同一瞬間畫面上是 3~6
     塊分開的斑；門檻再低就開始連成一片。

     ── 明滅場的頻率要比形狀場高 ──

     第一版明滅場很低頻（一塊斑整塊一起亮），量下來某些瞬間全畫面只剩一塊
     在亮，看起來像壞掉。把明滅場的頻率拉到比形狀場高，同一塊斑會被切成好
     幾個小區各自明滅，任何時刻都有 3~6 塊亮著 —— 真實的脈動極光本來就是
     這樣，斑不會整塊同步。

     ── 明滅不可以寫成 sin(t × 隨位置變的速率) ──

     那是第一版的寫法，會炸。t 一大，t 乘上速率在 x 方向的變化率就跟著變大，
     空間頻率隨時間無限往上爬 —— 跑個幾分鐘整片會碎成細閃。正解是讓明滅
     場自己沿時間軸捲動，這樣空間頻率永遠是固定的那一個。

     明滅留 0.24 的地板、另外墊一層很淡的彌散光。兩者都是為了不要有整片全暗
     的死幀，也避免幾萬顆粒子同時落回同一條線把亮度撐爆。 */
  float fieldMottle(float x, float z, float t) {
    // 斑的形狀。sin(z) 那項把雜訊的格線方向扭掉，不然斑會排得跟棋盤一樣
    vec2 q = vec2(x * 5.2 + t * 0.030 + sin(z * 7.0) * 0.30, z * 4.4 + 3.0);
    // noise 回傳的是 res 的平方（平均 0.29），要對稱的雜訊得先開根號還原。
    // 變數不能叫 patch —— 那是 GLSL 的保留字（細分著色器用的），會編不過
    float spot = smoothstep(0.44, 0.74, sqrt(noise(q)));
    // 明滅場：頻率比形狀場高，而且自己沿時間軸捲動
    float m = sqrt(noise(vec2(x * 6.0 + 17.0, z * 5.0 + 53.0 + t * 0.42)));
