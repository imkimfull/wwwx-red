    float blink = 0.24 + 0.76 * smoothstep(0.30, 0.72, m);
    /* 斑內的條紋。兩個頻率是照畫面上的實際尺寸配的：x 的 36 換算成
       117 像素一個週期、z 的 24 換算成 126 像素一個週期，所以條紋在畫面上
       是大約 45 度的斜紋。z 那一半才是重點 —— 深度方向的梯度（0.38×24≈9）
       超過 6.45，粒子被擠成亮痕，斑才不會是一塊死板的亮面 */
    float rays = 0.62 + 0.38 * sin(x * 36.0 + z * 24.0 + t * 1.5);
    float dif  = 0.16 * sqrt(noise(vec2(x * 2.3 + 41.0 + t * 0.02, z * 2.0 + 7.0)));
    return (spot * blink * rays + dif) * 1.35;
  }

  /* ④ 隨機：每顆粒子跳到自己的亂數高度，再用自己的相位和速度慢慢晃。
     完全沒有圖樣 —— 這正是重點，其他五個都有明確的結構。

     高度用**粒子編號**的雜湊，不是位置的雜湊。位置雜湊會隨著鋪開寬度改變
     取樣點，一拉滑桿整片就重新洗牌；編號雜湊是每顆粒子自己的常數，
     拉任何滑桿它都待在原來那個高度，只有整片一起變高變矮。 */
  float fieldRandom(float i, float t) {
    float a = hash11(i * 1.7 + 5.0);
    float b = hash11(i * 3.9 + 41.0);
    return (a - 0.5) * 2.4 + sin(t * (0.4 + b * 1.3) + a * 62.8) * 0.35;
  }

  /* ⑧ 離散 2：陣風。

     ④ 離散是**每顆粒子隨時都在自己的亂數高度上**，整片一起亂、一直亂。
     ⑧ 保留同一組亂數，但把它**關起來**：平常只是一層薄薄的塵，兩道陣風
     橫掃過去，風掃到哪裡那一段才炸開，風走了就落回去。

     這是漣漪 2 那條原則的另一個用法 —— 少數在動、多數不動，對比才看得出來。

     ── 為什麼是橫向的風，不是別的 ──

     一開始寫的是「把高度量化成五層」。實測翻車：這片平面前後鋪 150 個單位，
     光是**深度**就在畫面上拉開 481px，而整個高度範圍只佔 194px、每層才差
     48px。同一層的粒子被自己的深度攤成一條 481px 寬的帶，層與層完全糊在
     一起 —— 高度上的結構在這個角度下根本讀不出來。

     所以這裡的結構一律押在**橫向**（x 在畫面上幾乎是一比一）和**時間**上。
     其餘五對也都是這樣，只是它們本來就有橫向花紋，不會踩到這個坑。

     風之外不是完全平的（留 ±0.13 的薄塵）—— 完全平會讓幾萬顆粒子擠成一條
     細線，亮度直接爆掉。 */
  float fieldGust(float i, float x, float t) {
    float a = hash11(i * 1.7 + 5.0);
    float b = hash11(i * 3.9 + 41.0);
    float g = 0.0;
    /* 三道風、三個速度。兩道就會出現「三道都不在畫面上」的空檔，實測有時
       整片安靜好幾秒，看起來像壞掉。三道把空檔壓到 5% 以下 */
    for (int k = 0; k < 3; k++) {
      float f = float(k);
      /* 風頭從左掃到右，掃出畫面才折返。折返點壓在 ±0.8（畫面只到 ±0.5）——
         再遠就是浪費：離風頭 0.28 以外強度已經是萬分之一，不會被看到，
         卻要花掉大半個週期在畫面外空跑 */
      float front = fract(t * (0.075 + f * 0.030) + f * 0.37) * 1.6 - 0.8;
      float d = (x - front) / 0.062;
      g = max(g, exp(-d * d));
    }
    float storm = (a - 0.5) * 2.4 + sin(t * (0.4 + b * 1.3) + a * 62.8) * 0.35;
    // 用 mix 不是相加：粒子從薄塵長到亂數高度是連續的，不會有誰忽然跳出來
    return mix((a - 0.5) * 0.42, storm, g);
  }

  /* ⑬ 離散 C：區塊。

     三款換的都是「哪裡在亂」，不是「怎麼亂」—— 亂數本身三款完全一樣：

       A 整片，隨時都在亂          沒有邊界
       B 一道橫向掃過去的窗        一個邊界，會移動
       C 七條固定的直條，各自明滅  七個邊界，不移動

     C 的重點是**格子不動、開關各自跑**。掃過去的風有明確的方向感，
     一格一格點亮則沒有方向，比較像整片在呼吸 —— 那是它和 B 的差別。

     ── 為什麼不做成「每顆粒子自己竄一下」 ──

     原本 C 寫的是星火：每顆粒子自己的時鐘，時間到就竄出去再回來。量下去
     和 A 幾乎分不出來（最亮 20% 列佔總亮度 51.6% 對 47.0%），因為那個結構
     只存在**高度軸**上，而高度軸被前後深度的攤開蓋掉了（深度 481px、
     整個高度範圍才 194px）。這是離散 B 踩過的同一個坑的另一種形式。

     所以 C 也押在橫向：條與條的邊界是垂直的，在畫面上一比一看得見。

     邊界留 10% 做過渡，不是刀切 —— 刀切的直線在一片塵裡看起來像破圖。 */
  /* 週期和相位各用一個**獨立的** hash。原本兩者都從同一個 seed 算，結果是
     第 0、5、10 條的 seed 幾乎一模一樣（0.513 / 0.514 / 0.513），週期和相位
     全撞在一起 —— 那三條等於同一條，一起亮一起暗。加條數也救不了，因為
     加的條也在撞。乘數換成 12.9898 / 78.233 之後，十一條裡只剩一對週期相近。

     實測全部同時暗掉的時間從 1.7% 降到 0.9%，而同時亮著的比例不變（35.6%）。
     這條和揮散粒子那邊的教訓是同一個：**同一個 seed 乘不同的小常數不算獨立**。 */
  float slabGate(float s, float t) {
    float period = 2.6 + hash11(s * 12.9898 + 7.31) * 3.8;
    float ph = fract(t / period + hash11(s * 78.233 + 41.9));
    return smoothstep(0.0, 0.08, ph) * (1.0 - smoothstep(0.30, 0.40, ph));
  }

  float fieldPatch(float i, float x, float t) {
    float u = (x + 0.5) * 11.0;
    float s = floor(u), f = fract(u);
    float g = mix(slabGate(s - 1.0, t), slabGate(s, t), smoothstep(0.0, 0.10, f));
    g = mix(g, slabGate(s + 1.0, t), smoothstep(0.90, 1.0, f));
    float a = hash11(i * 1.7 + 5.0);
    float b = hash11(i * 3.9 + 41.0);
    float storm = (a - 0.5) * 2.4 + sin(t * (0.4 + b * 1.3) + a * 62.8) * 0.35;
    return mix((a - 0.5) * 0.40, storm, g);   // 沒亮的條留一層薄塵，不是全平
  }

  /* ㉒ 離散 D：靜頂。

     A / B / C 換的都是「哪裡在亂」，機制卻是同一種：算出一個 0~1 的閘門，
     再用 mix 把那一段粒子整批從薄塵拉到亂數高度 —— 同一塊區域裡的每顆粒子
     做的事完全一樣。D 換掉的是這個機制本身。

     這裡每顆粒子有自己的浮起門檻 u，畫面上每個位置有一個水位 lvl，
     水位淹過門檻的才浮起來。所以交界不是一條軟邊，是一片顆粒狀的灘：
     同一個位置有的粒子已經在空中、有的還躺著，比例隨水位連續改變。
     A / B / C 變的是「幅度」，這裡變的是「族群」—— 那是完全不同的質感。

     ── 底子就是 A 隨機，只有正上方那一段不一樣 ──

     這一支前三版都想另起爐灶（水位沿 x 掃、掛在深度上的橫帶、鏡像雜訊的
     斑塊），三次都被打回票。這一版換個做法：**A 隨機原樣照抄**，只在
     「正上方區域」動手腳。

     正上方 = 離鏡頭最近的那一段平面。鏡頭在 (0, 0, 100) 往上仰 7.2 度看這片
     懸在頭頂的塵，所以 z 正的那一端（近邊）投影在畫面最上緣、z 負的那一端
     （遠邊）落在畫面中段。正規化的 z = +0.5 就是畫面頂端那條。

     那一段的亂數幅度被慢慢收掉 —— 粒子從亂跳收成一片薄的，上緣因此出現
     一條乾淨的邊。收束帶的下沿和收的深度都隨時間慢慢變，那條邊會時而銳利、
     時而化回雜訊。

     ── 為什麼是漸層不是帶 ──

     第二版的橫帶被打掉，是因為橫貫全寬的**直線邊界**在這個近乎側視的鏡頭下
     就是百葉窗。這一版只有一道從上緣往下淡出的漸層，跨度 0.34（畫面深度的
     三分之一），不是一條線也不會重複，讀起來是「上緣比較乾淨」而不是「條紋」。

     實測上緣三列的厚度比其餘區域薄 47%，左右不對稱 5.9%（純亂數場本身的
     雜訊底線就是 4.4%，因為整條式子不含 x）。 */
  float fieldCrown(float i, float x, float z, float t) {
    float a = hash11(i * 1.7 + 5.0);
    float b = hash11(i * 3.9 + 41.0);
    // A 隨機本體，一個字都沒改
    float storm = (a - 0.5) * 2.4 + sin(t * (0.4 + b * 1.3) + a * 62.8) * 0.35;

    /* 三點鐘和九點鐘之所以稀，是**那裡本來就沒什麼粒子**，不是攤得太開。
       所以只調亂數的幅度沒有用（實測密度只從 0.58 動到 0.60）—— 要補齊
       就一定得把粒子搬過去。

       搬哪些：**靠鏡頭那半的兩側**。它們現在正好就落在十點半和一點半，
       往下搬一段之後會落到三點鐘和九點鐘。一個動作同時做完兩件事。

       為什麼要限定「靠鏡頭那半」：整段兩側都往下壓的話，遠端那些也會被
       拖到現有下緣之外，兩側會長出兩片下垂的翼、中間破一個洞。只搬近端的，
       剪影的下緣不動。

       h 變大就是往畫面下方走（p.y -= h × ...，而 screenY = 481·z − 74.6·h）。
       z 正的那一端離鏡頭近、投影在畫面上緣；z 負的那一端落在畫面中段。
       用 |x| 所以左右嚴格鏡像。 */
    float side = smoothstep(0.14, 0.44, abs(x));
    float up   = smoothstep(0.02, 0.42, z);
    // 搬的量掛在很慢的正弦上，肩線會緩緩起伏，不是釘死的剪影
    float amt  = 1.60 + sin(t * 0.17 + 1.1) * 0.22;
    return storm + side * up * amt;
  }

  /* ㉓ 離散 E：環爆。

     A 整片一直亂、B 一道風等速掃過去、C 十一條固定直條各自明滅 —— 三款的
     「哪裡在亂」都是沿著 x 排的。E 換成從中心往外擴的環：環過境的地方粒子
     被激起，環走了就沉澱回去，一圈接一圈。

     ── 中心釘在 x = 0，所以左右是構造上全等的 ──

     第一版是「某個 x 忽然炸開」，位置每輪重抽 —— 左右不對稱 54.8%。
     改成同心環之後，半徑只吃 |x|，鏡像完全相等（實測 6.0%，雜訊底線 4.4%）。

     ── 環要圓，半徑得先修正長寬比 ──

     x 走一個正規化單位在畫面上是 671 px、z 是 481 px，所以半徑要寫成
     hypot(x, z * 0.717) 環在畫面上才是圓的，不然會變成橫躺的橢圓。

     ── 兩個把死幀壓成零的細節 ──

     ① 行程 0.68 是照畫面最遠的角落（hypot(0.5, 0.55×0.717) = 0.637）訂的。
        第一版設 1.05，有四成的週期環已經整個跑出畫面，三圈同時在畫面外的
        時候整片就靜了 —— 實測區塊反差最低掉到 1.0。收短之後是 33.3。
     ② 三圈的週期取 3.4 / 4.1 / 4.8，彼此不整除，起始相位再各差三分之一圈，
        所以永遠至少有一圈在畫面中段。

     環寬 0.13 是「有結構」和「蓋滿整片」的分界：寬到 0.22 時三圈會連起來
     蓋滿全場，那一刻整片一起亂，等於退化成 A 隨機。 */
  float fieldBurst(float i, float x, float z, float t) {
    // 中心稍微偏向遠端（z + 0.05），環往近處擴的路比較長，看起來才有縱深
    float r = length(vec2(x, (z + 0.05) * 0.717));
    float g = 0.0;
    for (int k = 0; k < 3; k++) {
      float f = float(k);
      float ph = fract(t / (3.4 + f * 0.7) + f * 0.33333);
      // 越擴越淡：環走到邊緣時只剩七成力道，接得上下一圈從中心冒出來
      g = max(g, (1.0 - smoothstep(0.0, 0.13, abs(r - ph * 0.68))) * (1.0 - ph * 0.30));
    }
    float a = hash11(i * 1.7 + 5.0);
    float b = hash11(i * 3.9 + 41.0);
    // 門檻乘 0.70：讓環的內外緣各有一段「有的浮起、有的還躺著」的顆粒狀灘
    float u = hash11(i * 2.7 + 91.0) * 0.70;
    float storm = (a - 0.5) * 2.4 + sin(t * (0.4 + b * 1.3) + a * 62.8) * 0.35;
    return mix((a - 0.5) * 0.40, storm, smoothstep(u, u + 0.14, g));
  }

  /* ⑤ 漩渦：唯一會動到「面內位置」的一個，所以整格線會被扭成螺旋 ——
     那層螺旋紋是它和其他五個最大的差異，只改高度做不出來。

     旋轉前先把座標正規化成正方、轉完再還原。直接在世界座標裡轉的話，
     那片 90×150 的長方形會轉出原本的範圍，佔的位置就跟波浪不一樣了。
     轉角隨半徑指數衰減，所以外緣幾乎不動，只有中心捲起來。 */
  vec3 fieldVortex(vec3 p, float t) {
    float W = uPlaneSize.x * uSpread, D = uPlaneSize.z;
    vec2 d = vec2((p.x - uOrigin.x) / W, (p.z - uOrigin.z) / D);
    float r = length(d);
    float a = (3.2 + sin(t * 0.22) * 2.4 + sin(t * 0.07) * 1.2) * exp(-r * 3.5);
    float cs = cos(a), sn = sin(a);
    p.x = uOrigin.x + (cs * d.x - sn * d.y) * W;
    p.z = uOrigin.z + (sn * d.x + cs * d.y) * D;

    // 光靠面內旋轉是看不出來的 —— 這片平面幾乎是側著看的，左右移動在畫面上
    // 只剩很小的位移。要讓漩渦成立，高度也得跟著捲：兩條螺旋臂＋中央漏斗
    float ang = atan(d.y, d.x);
    float arms = sin(ang * 2.0 + r * 15.0 - t * 0.9) * exp(-r * 1.9) * 1.7;
    p.y -= (arms + 0.45 - 2.2 / (1.0 + r * 10.0)) * uPlaneSize.y * uWaveHeight;
    return p;
  }

  /* ⑪ 漩渦 2：亂流。

     ⑤ 漩渦是**一個**釘在正中央的大渦，整片一起繞。⑪ 換成四個小渦，各自
     偏心、各自漂、轉向一正一反。差別不在大小 —— 是「一個全域的旋轉場」
     變成「幾個各自為政的局部旋轉場」，那才是亂流長的樣子。

     三個做法：

       ① **高斯渦。** 轉角用 exp(-r²) 而不是 exp(-r)，衰減快得多，所以
          每個渦只影響自己附近，渦和渦之間的水面幾乎沒被動到。
       ② **接力轉。** 四個渦依序作用在**已經被前面轉過**的座標上，等於
          讓粒子在渦群裡漂流，紋路會被折來折去 —— 加總四個場做不出這個。
       ③ **凹心鼓邊。** 每個渦用兩個寬窄不同的高斯相減：窄的挖出漏斗、
          寬的托起一圈緩坡，看得出「這裡有個洞」。

     實測起伏面積 10.6%，⑤ 漩渦是 40.8% —— 大片留白正是重點。 */
  vec3 fieldVortex2(vec3 p, float t) {
    float W = uPlaneSize.x * uSpread, D = uPlaneSize.z;
    vec2 d = vec2((p.x - uOrigin.x) / W, (p.z - uOrigin.z) / D);
    float hh = 0.0;
    for (int k = 0; k < 4; k++) {
      float f = float(k), s = f * 29.0;
      // 渦心的軌跡是兩個不同頻率的正弦，不會回到原點 —— 才不像在繞圈子
      vec2 c = vec2(sin(t * (0.17 + f * 0.043) + s) * 0.30,
                    cos(t * (0.13 + f * 0.037) + s * 1.7) * 0.34);
      vec2 e = d - c;
      float r = length(e);
      float dir = mod(f, 2.0) < 0.5 ? 1.0 : -1.0;      // 轉向一正一反
      float a = dir * (2.6 + sin(t * 0.31 + s) * 0.9) * exp(-r * r * 26.0);
      float cs = cos(a), sn = sin(a);
      d = c + vec2(cs * e.x - sn * e.y, sn * e.x + cs * e.y);
      hh += 0.85 * exp(-r * r * 11.0) - 2.0 * exp(-r * r * 38.0);   // 緩坡減漏斗
      // x 加一點點：atan(0, 0) 在 GLSL 規格裡是未定義的，渦心剛好被踩到會出 NaN
      hh += sin(atan(e.y, e.x + 1e-6) * 3.0 + r * 26.0 - t * 1.4 * dir)
            * exp(-r * r * 18.0) * 0.55;
    }
    p.x = uOrigin.x + d.x * W;
    p.z = uOrigin.z + d.y * D;
    p.y -= hh * uPlaneSize.y * uWaveHeight;
    return p;
  }

  /* ⑰ 漩渦 C：渦街。

     A 是一個釘在中央的大渦、B 是四個各自漂的小渦。兩者的共通點是**沒有
     秩序**：一個就一個，四個是散的。C 給它秩序 —— 六個渦排成錯開的兩列，
     轉向左右交替，整列往同一個方向走。

     這是真的流體現象（卡門渦街），圓柱後面的尾流就長這樣。認得出來的關鍵
     是「錯開」：兩列不能對齊，對齊就變成兩排獨立的渦，不是一條街。

     渦心的 x 用 fract 循環，折返點放在 ±1.2 而畫面只到 ±0.5，所以「跳回
     隊伍最前面」那一下發生在看不到的地方。 */
  vec3 fieldStreet(vec3 p, float t) {
    float W = uPlaneSize.x * uSpread, D = uPlaneSize.z;
    vec2 d = vec2((p.x - uOrigin.x) / W, (p.z - uOrigin.z) / D);
    float hh = 0.0;
    for (int k = 0; k < 6; k++) {
      float f = float(k);
      float row = mod(f, 2.0);
      vec2 c = vec2(fract(f / 6.0 + t * 0.055) * 2.4 - 1.2, row < 0.5 ? -0.16 : 0.16);
      vec2 e = d - c;
      float r = length(e);
      float dir = row < 0.5 ? -1.0 : 1.0;
      float a = dir * 2.3 * exp(-r * r * 30.0);
      float cs = cos(a), sn = sin(a);
      d = c + vec2(cs * e.x - sn * e.y, sn * e.x + cs * e.y);
      hh += 0.75 * exp(-r * r * 11.0) - 2.2 * exp(-r * r * 38.0);   // 緩坡減漏斗
      hh += sin(atan(e.y, e.x + 1e-6) * 2.0 + r * 26.0 - t * 1.6 * dir)
            * exp(-r * r * 20.0) * 0.5;
    }
    p.x = uOrigin.x + d.x * W;
    p.z = uOrigin.z + d.y * D;
    p.y -= hh * uPlaneSize.y * uWaveHeight;
    return p;
  }

  /* ⑳ 漩渦 D：吐納。

     A/B/C 有一個共同點，而且是看不見的那種：它們的面內位移全是剛體旋轉，
     行列式恆等於 1。均勻的一片塵被剛體旋轉攪動，畫面上的疏密一點都不會變 ——
     這三款真正看得見的其實是高度那一段（螺旋臂、漏斗），面內旋轉只負責把
     四個角掃空。實測面內密度對比：A 1.01、B 0.51、C 0.65，全部來自邊角，
     內部一格都沒變。

     D 換掉的就是這一條：位移改成某個位勢的梯度（無旋度），粒子是真的被
     吸進去、噴出來，同一塊地方的粒子數會變多變少。這一族第一次有明暗。

     位移寫成 e = e * (1 - q * ee)，ee = exp(-r² / w²)。這正好是位勢
     -q·w²/2·exp(-r²/w²) 的梯度，所以嚴格無旋。好處是壓縮率有封閉解：
     中心的面積壓縮就是 (1-q)²，q 直接就是過曝的旋鈕，不必試。q 訂在 0.14
     → 最亮 1.36 倍、最暗 0.77 倍，量到的過曝 1.48，在 B 亂流的 1.68 底下。

     四個坑站著不動 —— B 是漂的、C 是整列行進的，這是三者最快分辨的地方。
     x 均分（押在橫向才讀得出來），z 用 2.399 弧度一步的無理角錯開；hash11 對
     0~3 這種小整數散不開，實測四個值會有三個擠在一起。

     ── 為什麼週期不是四個亂數 ──

     第一版四個坑各給一個獨立的隨機週期與相位。看起來很安全，實測卻在 t=26.45
     撞到四個坑同時停在轉折點：四個呼吸強度的絕對值加起來只剩 0.381（平均是
     2.55），整片瞬間變成一張平的。獨立亂數只保證「不會全部一樣」，不保證
     「不會同時歸零」—— 這是離散 C 那個 hash 教訓的第二種長相。

     改成兩組、每組兩個坑差 90 度相位：|sin| + |cos| 的下界是 1，兩組就是 2，
     這是數學保證不是抽樣結果（掃 128 秒實測下界 2.042）。兩組的週期取 6.4 和
     8.0 秒，整體要 32 秒才重複，所以也不會變成節拍器。

     純粹的源匯沒有漩渦感，所以吸的時候同時轉，轉角一樣掛在呼吸上，吐的時候
     自然反轉。旋轉本身不花密度預算（行列式 1），可以放心給大。 */
  vec3 fieldBellows(vec3 p, float t) {
    float W = uPlaneSize.x * uSpread, D = uPlaneSize.z;
    vec2 d = vec2((p.x - uOrigin.x) / W, (p.z - uOrigin.z) / D);
    float hh = 0.0;
    for (int k = 0; k < 4; k++) {
      float f = float(k), grp = mod(f, 2.0);
      vec2 c = vec2((f + 0.5) * 0.25 - 0.5, sin(f * 2.399 + 0.7) * 0.19);
      // 同組兩個坑差 90 度（1.5708），兩組再差 0.9 —— 四個永遠不會同時停
      float g = sin(t * 6.283 / mix(6.4, 8.0, grp) + grp * 0.9 + floor(f * 0.5) * 1.5708);
      vec2 e = d - c;
      float rr = dot(e, e);
      float ee = exp(-rr / 0.0729);            // 0.0729 = 0.27 的平方，坑的半徑
      float a = 1.26 * g * ee;                 // 吸的時候順著轉，吐的時候反著轉
      float cs = cos(a), sn = sin(a);
      e *= 1.0 - 0.14 * g * ee;                // 吸的時候小於 1、吐的時候大於 1：這一行就是密度
      d = c + vec2(cs * e.x - sn * e.y, sn * e.x + cs * e.y);
      // 高度跟著吸吐翻面：吸是漏斗（外圈緩坡、中心深坑），吐就整個翻成土丘
      hh += g * 1.25 * (0.55 * ee - 1.7 * exp(-rr / 0.0243));
    }
    p.x = uOrigin.x + d.x * W;
    p.z = uOrigin.z + d.y * D;
    p.y -= hh * uPlaneSize.y * uWaveHeight;
    return p;
  }

  /* ㉑ 漩渦 E：渦格。

     骨架是兩道交叉的正弦剪切，先剪 x 再剪 z：

         x = x + ax(t) * sin(KZ*z + 1.7);
         z = z + az(t) * sin(KX*x + 0.9);      // 吃的是已經剪過的 x

     為什麼一定要寫成這個順序：單軸剪切的行列式恆等於 1（x 的位移只看 z、
     z 的位移只看已經定案的 x），兩道接力還是 1，而且不管振幅拉多大都保證是
     一對一的映射 —— 摺疊在數學上不可能發生。A/B/C 靠剛體旋轉拿到同一個保證，
     這裡換一條路徑拿到，代價是零：量到的過曝 1.15，是全族最低的（A 1.30、
     B 1.68、C 1.13），而位移有 80 px。

     兩個振幅取 (cos, sin) 這組差 90 度的相位之後，每顆粒子在原地繞一個橢圓，
     橢圓的長短軸分別由 sin(KZ*z) 和 sin(KX*x) 決定 —— 於是整片自動分成 5×3 個
     轉向交替的胞，胞的邊界就是那兩條 sin 的零線。這就是駐渦晶格。

     和另外三款的分野在有沒有空隙：A 是一個渦、B 是四個散的、C 是一列走的，
     共通點是渦與渦之間有大片沒被動到的水面（B 的起伏面積只有 10.6%）。渦格
     沒有空隙，整片都是胞，而且位置固定、規則排列。規則排列在這個題目裡是
     優點 —— 網格被扭出來的摩爾紋正是這片塵的招牌。

     高度用 u = (sin×sin) 的平方（胞心是 1、邊界是 0）做出蛋盒：中間一個漏斗、
     外圍一圈抬起的緩坡。2.2u 減 3.8u⁴，四次方那一項只在胞心附近才
     咬得動，所以緩坡寬、坑窄。

     深度沿 x 掛一道慢波，格子不動、只有強弱在跑，所以不會有整片安靜的一刻
     （實測死幀 0%，A 漩渦是 8.3%）。慢波的下限留 0.36 而不是 0 —— 留 0 的話
     同一瞬間會有半片是完全平的。 */
  vec3 fieldEddyGrid(vec3 p, float t) {
    float W = uPlaneSize.x * uSpread, D = uPlaneSize.z;
    float x = (p.x - uOrigin.x) / W;
    float z = (p.z - uOrigin.z) / D;

    float ph = t * 0.30;
    float sz = sin(9.4248 * z + 1.7);          // 9.4248 = 3π，z 向切三個胞
    float nx = x + 0.12 * cos(ph) * sz;
    float sx = sin(15.708 * nx + 0.9);         // 15.708 = 5π，x 向切五個胞
    float nz = z + 0.12 * sin(ph) * sx;

    float u = sx * sz;  u *= u;                // 胞心 1、邊界 0
    float u4 = u * u;   u4 *= u4;              // 四次方：只有胞心附近咬得動
    float wob = 0.68 + 0.32 * sin(t * 0.55 - 6.5974 * x);   // 一道橫掃的強弱波

    p.x = uOrigin.x + nx * W;
    p.z = uOrigin.z + nz * D;
    p.y -= (2.2 * u - 3.8 * u4) * wob * uPlaneSize.y * uWaveHeight;
    return p;
  }

  /* 只有一個 return。分支各自 return 的寫法在 Windows 上會被翻成 HLSL，
     編譯器認不出所有路徑都有賦值，跳 X4000「變數可能未初始化」警告。

     三十個分支全部寫成 if / else if，不用三元運算子串接：uField 是 uniform，
     整批粒子拿到同一個值，所以這是「非發散」的分支 —— GPU 一次只走一條，
     成本和只有一個分支差不多。三十層的三元鏈編譯器不見得認得出這件事。

     五支漩渦走 vec3 那一條（它們要動面內位置），其餘走高度那一條。 */
  vec3 fieldAt(vec3 p, float idx) {
    float t = uTime * uWaveSpeed;
    if (uField == 0) {
      p.y -= waves(p);            // 波浪自己會乘起伏高度
    } else if (uField == 5) {
      p = fieldVortex(p, t);
    } else if (uField == 11) {
      p = fieldVortex2(p, t);
    } else if (uField == 17) {
      p = fieldStreet(p, t);
    } else if (uField == 20) {
      p = fieldBellows(p, t);
    } else if (uField == 21) {
      p = fieldEddyGrid(p, t);
    } else {
      float x = (p.x - uOrigin.x) / (uPlaneSize.x * uSpread);
      float z = (p.z - uOrigin.z) / uPlaneSize.z;
      float h = 0.0;
      // 漣漪：要用 uRippleC 圓心，所以吃的是世界座標
      if      (uField ==  1) h = fieldRipple(p, t);
      else if (uField ==  6) h = fieldRipple2(p, t);
      else if (uField == 16) h = fieldInterfere(p, t);
      else if (uField == 26) h = fieldSpiral(p, t);
      else if (uField == 27) h = fieldDrift(p, t);
      // 山岳
      else if (uField ==  2) h = fieldPeaks(x, z, t);
      else if (uField == 14) h = fieldKarst(x, z, t);
      else if (uField ==  9) h = fieldCanyon(x, z, t);
      else if (uField == 28) h = fieldFault(x, z, t);
      else if (uField == 29) h = fieldMesa(x, z, t);
      // 極光
      else if (uField ==  3) h = fieldAurora(x, z, t);
      else if (uField == 15) h = fieldCorona(x, z, t);
      else if (uField == 10) h = fieldAurora2(x, z, t);
      else if (uField == 18) h = fieldArcs(x, z, t);
      else if (uField == 19) h = fieldMottle(x, z, t);
      // 波浪（A 是 uField == 0，走上面那條）
      else if (uField ==  7) h = fieldSwell(x, z, t);
      else if (uField == 12) h = fieldStanding(x, z, t);
      else if (uField == 24) h = fieldBreaker(x, z, t);
      else if (uField == 25) h = fieldSets(x, z, t);
      // 離散：吃的是粒子編號，不是位置
      else if (uField ==  8) h = fieldGust(idx, x, t);
      else if (uField == 13) h = fieldPatch(idx, x, t);
      else if (uField == 22) h = fieldCrown(idx, x, z, t);
      else if (uField == 23) h = fieldBurst(idx, x, z, t);
      else                   h = fieldRandom(idx, t);
      p.y -= h * uPlaneSize.y * uWaveHeight;
    }
    return p;
  }

  // 滑鼠附近的反光：讓那一段的顏色亮起來，是原站質感的一部分
  vec3 waveReflection(vec3 color, float screenX, vec3 pos) {
    float band = smoothstep(0.3, 0.0, abs(screenX - uMouse.x));
    float n = noise(vec2(pos.x / 10.0 + uTime / 5.0, pos.z / 10.0));
    return color * (1.0 + smoothstep(0.0, 1.0, 0.75 * band) * n * 1.1);
  }

  /* ── 目標形狀 ── */

  /* Fibonacci 球，但可以指定「這一群有幾顆」。

     形狀拆成好幾個部件時（頭皮／眼球／耳朵／脖子各佔一段編號），每一群都要
     自己鋪滿一顆完整的球。用固定的 uCount 算緯度的話，只拿到 87% 編號的頭皮
     就只鋪到南緯 45 度，下巴整個不見。

     也不能把編號乘一個倍數了事 —— GOLDEN * (i * 1.15) 等於換成 2.76 這個
     角度常數，低差異的性質直接消失，點會排成幾條輻射線。要動的是分母。 */
  vec3 sphereN(float i, float n) {
    float y = 1.0 - (i / n) * 2.0;
    float r = sqrt(max(0.0, 1.0 - y * y));
    float t = GOLDEN * i;
    return vec3(cos(t) * r, y, sin(t) * r);
  }
  vec3 shapeSphere(float i) { return sphereN(i, uCount); }

  vec3 rotateY(vec3 p, float a) {
    float c = cos(a), s = sin(a);
    return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
  }
  /* 上下。a 為正是把頂端往鏡頭這邊倒。
     一定要在 rotateY **之後**做，轉軸才會是畫面的水平軸，不是形狀自己的軸 ——
     先做的話形狀左右轉過去之後，上下就變成「繞著它自己的某條斜軸」翻。 */
  vec3 rotateX(vec3 p, float a) {
    float c = cos(a), s = sin(a);
    return vec3(p.x, c * p.y - s * p.z, s * p.y + c * p.z);
  }
  vec3 shapeCube(float i) {
    float perFace = uCount / 6.0;
    float face = floor(i / perFace), k = mod(i, perFace);
    float side = ceil(sqrt(perFace));
    float u = (mod(k, side) / (side - 1.0)) * 2.0 - 1.0;
    float v = (floor(k / side) / (side - 1.0)) * 2.0 - 1.0;
    if (face < 1.0) return vec3(u, v,  1.0);
    if (face < 2.0) return vec3(u, v, -1.0);
    if (face < 3.0) return vec3( 1.0, u, v);
    if (face < 4.0) return vec3(-1.0, u, v);
    if (face < 5.0) return vec3(u,  1.0, v);
    return vec3(u, -1.0, v);
  }
  float polygonRadius(float theta, float sides) {
    float seg = 2.0 * M_PI / sides;
    return cos(seg * 0.5) / cos(mod(theta, seg) - seg * 0.5);
  }
  vec3 shapeCone(float i, float sides) {
    float baseCount = uCount * 0.28;
    float t = GOLDEN * i;
    if (i < baseCount) {
      float r = sqrt(i / baseCount) * polygonRadius(t, sides);
      return vec3(cos(t) * r, -1.0, sin(t) * r);
    }
    float u = (i - baseCount) / (uCount - baseCount);
    float r = sqrt(u), pr = r * polygonRadius(t, sides);
    return vec3(cos(t) * pr, 1.0 - 2.0 * r, sin(t) * pr);
  }
  vec3 shapeTorus(float i) {
    float R = 0.72, tr = 0.28;
    float u = fract(i * R2_A1) * 2.0 * M_PI, v = fract(i * R2_A2) * 2.0 * M_PI;
    float rr = R + tr * cos(v);
    return vec3(cos(u) * rr, tr * sin(v), sin(u) * rr);
  }
  vec3 shapeHelix(float i) {
    float strand = mod(i, 2.0);
    float k = floor(i / 2.0) / (uCount * 0.5);
    float t = k * 3.0 * 2.0 * M_PI + strand * M_PI;
    return vec3(cos(t) * 0.55 + (hash11(i) * 2.0 - 1.0) * 0.07,
                k * 2.0 - 1.0,
                sin(t) * 0.55 + (hash11(i + 77.0) * 2.0 - 1.0) * 0.07);
  }

  // 離散圓：有厚度的球殼。用 Fibonacci 球當骨架再隨機推拉半徑，
  // 這樣既有雲的柔軟感、又不會像實心球那樣中心被 additive 疊成一片死白
  /* 逐顆的亮度補償係數。哪一支形狀函式要壓暗自己的密集處，就在裡面寫它，
     呼叫端每次呼叫前會歸 1（見 fieldAt 下面那段）。
     宣告放在所有 shapeXxx 之前 —— GLSL 沒有前向宣告，用之前一定要先宣告。 */
  float gEggGain;

  vec3 shapeCloud(float i) {
    vec3 dir = shapeSphere(i);
    float r = 0.5 + hash11(i) * 0.5;
    vec3 jitter = vec3(hash11(i + 3.1), hash11(i + 7.7), hash11(i + 11.3)) * 2.0 - 1.0;
    return dir * r + jitter * 0.1;
  }

  /* 正 N 角星（或正 N 邊形）的極座標半徑，外接半徑正規化成 1。

     一段邊是「外角頂點 (1, 0)」到「內角頂點 (inner, φ)」的**直線**，φ = π/N。
     過這兩點的直線寫成極座標就是下面這條式子。用直線是必要的 ——
     拿 1 + a·cos(Nθ) 那種寫法只會得到一朵波浪花，邊不是直的，三角形不像三角形。

     inner 這一個參數同時管兩種形狀：
       inner = cos(π/N)   內角頂點正好落在兩個外角頂點的連線上 → 正 N 邊形
       inner < cos(π/N)   內角凹進去 → N 角星，越小越尖
     所以擲骰的時候只要動這一個數，多邊形和星形是連續的同一族。 */
  float starR(float th, float n, float inner) {
    float seg = 6.2831853 / n;
    float phi = seg * 0.5;
    float a = mod(th, seg);
    a = min(a, seg - a);                       // 折到半段，邊本來就是對稱的
    return inner * sin(phi) / max(sin(a) + inner * sin(phi - a), 1e-4);
  }

  /* ⑰ 隨機離散：橫斷面是正 N 邊形或 N 角星的殼。

     和「離散圓」同一家 —— 都是空心殼（中心留空，additive 疊加才不會糊成
     一塊死白），差別只在橫斷面從圓換成有角的圖形。

     取樣：高度用編號均勻鋪、方位角用黃金角。**方位角不能均勻鋪** ——
     均勻的話粒子會沿著幾條輻射線排隊，角就變成幾根刺。黃金角是低差異序列，
     鋪出來每一層的方位都錯開。

     密度的一個免費好處：頂點附近半徑大、同樣的角度區間攤開的面積也大，
     所以粒子自然就疏；反而是邊的中點最濃。這和「角要亮」的直覺相反，
     但畫面上是對的 —— 角如果比邊還濃，看起來會像沾了四顆亮點的圓。

     ── 高度不能均勻鋪，這是這一支唯一真正的坑 ──

     收束成錐形（uPgTaper > 0）的時候，越靠近頂端周長越小，但「每單位高度
     幾顆粒子」如果是定值，那些粒子就全擠進一個越來越小的圈裡 —— 尖端變成
     一個死白的點。實測過曝衝到 1.27%，驗收標準是 0.02%，差六十倍。

     解法是照周長反解取樣位置。周長正比於 prof = (1−|y|)^p，
     所以累積分布要是 F(a) = 1 − (1−a)^(p+1)，反過來就是

         |y| = 1 − (1 − u)^(1/(p+1))          u 是均勻的 0~1

     這樣每單位**表面積**的粒子數才是定值。p = 0（直柱）時這條式子退化成
     |y| = u，也就是均勻，所以直柱那一支完全不受影響。

     另外再掛一層亮度補償（gEggGain）當保險：半徑小的地方本來就比較濃，
     把它按半徑壓暗。兩層一起，最糟的擲骰從 1.27% 降到 0.0058%。 */
  vec3 shapePoly(float i) {
    float v   = 1.0 - (i / uCount) * 2.0;      // −1~1 均勻
    float sgn = (v < 0.0) ? -1.0 : 1.0;
    // 照周長反解：p 越大越往中段（最寬處）集中，直柱時退化成均勻
    float dep = sgn * (1.0 - pow(max(1.0 - abs(v), 1e-5), 1.0 / (uPgTaper + 1.0)));
    float th  = GOLDEN * i;                    // 方位角走黃金角

    float prof = pow(max(1.0 - abs(dep), 1e-4), uPgTaper);
    float rho  = starR(th, uPgN, uPgInner) * prof * uPgRad;
    // 殼：半徑在 0.55~1.0 之間隨機，中心是空的
    float shell = 0.55 + hash11(i) * 0.45;

    /* 亮度補償。這裡的次方是**平方**，不是一次方 —— 一次方壓不夠。

       方位角是均勻鋪的，但一條直邊上「每單位角度換到多少弧長」正比於
       r² ÷ 邊心距，所以線密度正比於 1/r²。r 最小的地方（每條邊的中點）
       密度是頂點的 (1/邊心距)² 倍 —— 三角形是四倍。按 r 壓只補了一半。

       多邊形還有一個圓球沒有的問題：**平面轉到側面時會投影成一條線**。
       曲面永遠只有一條切線和視線平行，平面則是整片一起。所以抖動也要
       比離散圓大一點（0.075），把那條線撐開成一條帶。 */
    float rn = rho / max(uPgRad, 1e-3);
    gEggGain = clamp(0.15 + 0.80 * rn * rn, 0.12, 0.95);

    /* 多邊形擺在**正面**（xy 平面），厚度往深處長。

       一開始擺在水平面上、往高度方向擠出來 —— 那樣只有從正上方才看得到是幾
       角形，從正面看只是一根柱子。這片作品的鏡頭是固定的正面視角，所以角形
       要面向鏡頭。

       角度加 90 度是讓一個「角」朝正上方。三角形、五角星這種奇數角的圖形，
       角朝上和角朝下是完全不同的兩個東西，朝上才是一般人心裡的那個形狀。 */
    float ang = th + 1.5707963;
    vec3 jitter = vec3(hash11(i + 3.1), hash11(i + 7.7), hash11(i + 11.3)) * 2.0 - 1.0;
    return vec3(cos(ang) * rho * shell, sin(ang) * rho * shell, dep * uPgH) + jitter * 0.075;
  }

  /* 隨機圓：一顆球被拉長、壓扁、偏成蛋形、或捏出腰身。

     **關鍵是旋轉對稱**：水平半徑只由「高度」決定，和方位角完全無關。
     所以不管轉到哪一面，剪影都一模一樣 —— 看起來是一個完整的立體，
     而不是一顆隨機長瘤的球。前一版是「在球面上撒幾個隆起」，那個做法
     每一面長得都不一樣，轉起來像一團有機物，不像一個形狀。

     做法是**旋轉曲面**：把 Fibonacci 球當成「均勻的方位角 ＋ 均勻的緯度」，
     緯度 u 決定這一圈的水平半徑 ρ(u)，方位角只決定繞到哪個位置。

     ρ(u) 由三個獨立的形變相乘，各管一件事：

       ① uEgN    超橢圓次方。2 是正圓；大於 2 往桶狀／膠囊走；小於 2 往紡錘走
       ② uEgSkew 蛋形。把最寬的那一圈往上或往下推，就是雞蛋和倒立雞蛋
       ③ uEgWaist 腰身。負的中間收成葫蘆，正的中間鼓成陀螺

     再乘 uEgH（垂直半徑，做直立／橫躺的橢圓）和 uEgNorm（把剪影面積校正回
     和圓球一樣大 —— 粒子數固定，形狀縮小就等於密度暴增）。 */
  float eggRadius(float u) {
    float s = pow(max(0.0, 1.0 - pow(abs(u), uEgN)), 1.0 / uEgN);
    s *= 1.0 + uEgSkew * u;
    s *= 1.0 + uEgWaist * cos(u * M_PI);
    return max(s, 0.0);
  }

  /* 密度補償係數。shapeEgg 每次被呼叫都會寫這個全域變數，主程式讀走之後
     乘進 vAlpha。用全域變數是因為 shapeAt 的簽名只回傳一個 vec3，
     為了一個係數把整條呼叫鏈都改成 out 參數不划算。

     為什麼需要它：同一條緯度上的粒子數是固定的（均勻的 u 取樣），但那一圈
     的周長是 2πρ。ρ 一小，同樣多的粒子就擠進更短的一圈 —— 側面看就是一條
     又短又濃的橫線，疊起來直接死白。

     實測就是這樣壞的：直立橢圓、紡錘、倒立蛋的過曝像素**全部集中在形狀
     頂端 95% 的位置**（一千五百多個），同一組參數的圓球只有 3 個。頂端正是
     ρ 趨近 0 的地方。

     所以補償係數就是 ρ·H：那一圈的粒子在畫面上攤開的面積正比於
     「寬度 2ρ × 高度 H·du」。正式一點就是投影的 Jacobian
     |∂(X,Y)/∂(u,φ)| = norm²·ρ·H·|sinφ|，其中跟高度有關的部分正是 ρ·H。
     uEgGainNorm 讓平均值維持 1，整體亮度不會被這道補償改掉；
     下限 0.12 是不讓尖端整個消失。

     **被丟掉的 |sinφ| 是故意的。** 那是剪影邊緣的堆疊（殼層和視線相切），
     和形狀參數無關，圓球身上也一樣有，而且 facing 那個 smoothstep 已經在壓它。
     補下去只會把輪廓也壓掉 —— 而輪廓正是點雲用來表達形狀的東西。

     曾經用過 ρ·sqrt(ρ'²+H²)（真正的曲面面積元素），那個是對的**表面**密度，
     但我們要的是**螢幕**密度 —— 兩者差一個 H/sqrt(ρ'²+H²) 的傾角因子，
     約掉之後就是這條簡單的 ρ·H。實測差很多：面積版的直立橢圓還有 0.065%，
     螢幕版降到 0.001%。 */
  vec3 shapeEgg(float i) {
    vec3 dir = shapeSphere(i);
    float u  = clamp(dir.y, -1.0, 1.0);
    // 方位角。極點的 xz 長度是 0，直接除會變 NaN，所以夾一個下限
    vec2 az = dir.xz / max(length(dir.xz), 1e-4);
    float r = eggRadius(u);
    /* 係數是 ρ·H，但 H 是常數、會被 uEgGainNorm 的分母整個約掉，所以只留 ρ。

       尖端再多壓一手（min(1, ρ/0.30)）。ρ 這條式子假設「那一圈的粒子沿著
       周長攤開」，但最後幾圈的周長趨近 0，那些粒子在畫面上是**疊在同一點**，
       不是攤開的一條線 —— 螢幕密度在那裡是 1/ρ² 不是 1/ρ。
       實測：只用 ρ 的話，長寬比 1.96 那一擲頂端還有 0.080% 死白。 */
    float g = r * min(1.0, r * 3.3333);
    gEggGain = clamp(g * uEgGainNorm, 0.04, 3.0);
    return vec3(az.x * r, u * uEgH, az.y * r) * uEgNorm;
  }

  /* 隨機螺旋：**對水平面鏡射對稱**的螺旋。

     ── 為什麼是上下對稱，不是左右對稱 ──────────────────────

     形狀會繞 Y 軸自轉（uSpinAngle），所以能被觀眾持續看到的對稱，必須是
     **和「繞 Y 軸旋轉」可交換**的那一種。左右鏡射（穿過某個垂直面）會跟著
     形狀一起轉走，轉 30 度就不對稱了；上下鏡射（y → −y）和繞 Y 軸旋轉可交換，
     所以**每一個自轉角都成立**。這和隨機圓靠旋轉對稱「轉到哪一面都一樣」
     是同一件事的離散版。

     另外一個候選是「繞 Y 軸轉 180 度不變」（DNA 雙股天生就有）。它在數學上
     也和自轉可交換，但那是**旋轉**不是鏡射：轉 180 度會把 z 也翻面，透視下
     近的那半邊被放大，所以畫面上根本不是左右鏡像。以這裡的尺寸算，最外側
     的一對點左右差到 27%（半徑 11、鏡頭距離 70）—— 那個量級讀不出對稱。
     鏡射沒這個問題：反射面不動 z，而且鏡射面離鏡頭很近（鏡頭 y=0、面在
     y=7.9、距離 70，夾角 6.4 度），3D 的對稱幾乎原封不動變成畫面上的對稱。

     ── 怎麼讓一條螺旋上下對稱 ──────────────────────────────

     一條普通螺旋在 y → −y 之下會變成**反向旋**的螺旋，所以只有兩種活法：

       ① 對旋交織（uHxCross = 1）：右旋和左旋成對出現，整組就閉合了。
          看起來是編織的籃子／雙曲面網。1 對 = 2 條交叉，2 對 = 4 條……
       ② 腰部反向（uHxCross = 0）：一條線在 y=0 把旋向翻過來（吃 |y|），
          自己就是自己的鏡像。1 條就成立 —— 這是**單螺旋**擲得出來的唯一辦法。

     半徑輪廓也必須對 k=0.5 對稱，所以只能用對稱的基底。舊版的「錐度」
     （上寬下窄）是反對稱的，直接拿掉，換成三次諧波 sin(3πk)：

       uHxBulge  一次諧波 sin(πk)   正值紡錘、負值沙漏
       uHxWave   三次諧波 sin(3πk)  正值花生（兩顆鼓、中間束腰）、負值線軸

     ── 密度補償 ────────────────────────────────────────────

     曲線和曲面的算法不一樣。粒子沿高度均勻取樣，所以**畫面上每條線的
     線密度上限就是「每條分到的粒子數 ÷ 垂直投影速度」**，而垂直速度是常數
     （dy/dk = 2）—— 也就是說**上限只跟「分成幾條」有關**，和半徑、圈數無關。
     線數加倍，每條就淡一半。這和隨機圓補 ρ·H 是同一個道理（要補的是螢幕
     密度），只是曲線的分母換成了投影後的**弧長**而不是面積。

     不過**別直接照 1/線數 去補**。實測掃了 63 組參數、補償固定為 1 時的
     最壞過曝：1 條 0.097%、2 條 0.047%、3 條 0.014%、4 條 0.012%、6 條 0.005%
     （標準是 0.02%）。掉得比 1/線數 快得多 —— 因為過曝是個**門檻計數**，
     亮度一降到門檻以下計數就整個歸零，補回去等於把它推回門檻上。
     照實測曲線取 uHxGainNorm = min(1, 0.30 × 線數)，在 rollHelix() 算好。

     再乘一個 min(1, prof)：輪廓束腰的地方所有線會擠向中軸疊在一起，
     那正是隨機圓在兩極踩過的坑。整條算完才 clamp 一次，不讓兩個小於 1 的
     係數各自夾了再相乘（那會把粒子推到 fragment 的 discard 門檻以下）。 */
  vec3 shapeHelixR(float i) {
    float L    = uHxLanes;
    float lane = mod(i, L);
    float per  = max(2.0, floor(uCount / L));        // 每條線分到幾顆
    float m    = min(floor(i / L), per - 1.0);       // 這顆是那條線上的第幾顆
    float k    = m / (per - 1.0);                    // 0～1，沿著高度爬
    float y    = k * 2.0 - 1.0;

    // 半徑輪廓：只用「對 k=0.5 對稱」的基底，這是上下對稱的前提
    float prof = 1.0 + uHxBulge * sin(k * M_PI) + uHxWave * sin(k * 3.0 * M_PI);
    float r    = uHxRad * max(prof, 0.10);

    float grp, sgn, nGrp;
    if (uHxCross > 0.5) {
      nGrp = L * 0.5;                                // 相位群數 = 線數的一半
      grp  = floor(lane * 0.5);
      sgn  = (mod(lane, 2.0) < 0.5) ? 1.0 : -1.0;    // 同一群裡右旋、左旋各一條
    } else {
      nGrp = L;
      grp  = lane;
      sgn  = (y < 0.0) ? -1.0 : 1.0;                 // 過腰翻旋向，等於吃 |y|
    }
    float t = grp * 2.0 * M_PI / nGrp + sgn * uHxTurns * M_PI * y;

    gEggGain = clamp(uHxGainNorm * min(1.0, prof), 0.20, 1.05);

    /* 抖動沿用原螺旋（完全落在數學曲線上的點會排成一條死線，太銳利），
       但**種子必須是鏡射不變的**：一對鏡射粒子的步數是 m 和 per−1−m，
       取 min 就得到同一個種子，兩顆才會被推去同一個方向。用 hash11(i) 的話
       抖動自己就不對稱了。抖動只加在 x、z —— y 一動對稱就破了。 */
    float seed = grp * 8191.0 + min(m, per - 1.0 - m);
    vec2  j = vec2(hash11(seed), hash11(seed + 77.0)) * 2.0 - 1.0;
    return vec3(cos(t) * r + j.x * 0.05, y, sin(t) * r + j.y * 0.05);
  }

  /* 隨機離散：離散圓的擲骰版本。

     ── 為什麼是繞垂直軸的旋轉對稱 ──

     和隨機圓同一條教訓：**要對稱，半徑就不能吃方位角**。前一版是在球面上
     撒幾個方向性的低頻鼓包，每一面長得都不一樣，轉起來像一團會蠕動的
     有機物，不像一個形狀。

     現在改成**旋轉體**：一條輪廓線繞垂直軸掃出外殼，所以繞 Y 軸轉到哪一格
     剪影都一樣。挑這個對稱而不是上下／左右鏡射，是因為這支動畫只繞 Y 軸
     轉（uSpinAngle，見主函式），**對稱軸正好對上唯一會動的那個自由度** ——
     鏡射對稱擋不住「轉 90 度變另一個東西」，旋轉對稱擋得住。
     代價是放棄上下不對稱的自由度嗎？沒有：蛋形和腰身都還在，上下本來就
     可以長得不一樣，只是不管從哪個方位看都是同一個上下不一樣。

     ── 為什麼它不是第二個隨機圓 ──

     差別在半徑的第二個來源：

       隨機圓   粒子貼在曲面上                    → 一層薄殼，讀的是輪廓
       隨機離散 粒子再乘一個 [uClIn, 1] 的縮放，   → 一團有厚度的霧，讀的是濃淡
                而縮放量**只由粒子編號決定**

     「半徑是編號的函式、不是方向的函式」正是離散圓那一家的定義，這一行不能動。
     連帶的那條線也不能碰：**不能直接在球體積裡隨機灑**，加色疊加下視線會穿過
     整個體積，中心疊成一片死白。解法是留一個空心的核，光才有地方漏掉 ——
     隨機的是核有多大，不是有沒有核。

     ── 擲哪六個 ──

     一團霧沒有表面明暗可讀，它成不成立只看**剪影**和**密度分布**，所以六個
     變數剛好各管一半：

       剪影（旋轉輪廓，和隨機圓同一條公式，但參數獨立 —— 兩個形狀互切時
             畫面上會同時存在，共用 uniform 會讓過場算錯）
         uClN     超橢圓次方：2 正圓、大於 2 往桶狀、小於 2 往紡錘
         uClH     垂直半徑：大於 1 直立、小於 1 壓扁成碟
         uClSkew  蛋形：把最寬的一圈往上或往下推
         uClWaist 腰身：負的中間收成葫蘆、正的中間鼓成陀螺
       密度分布（霧自己的）
         uClIn    空心核半徑：0.75 是一層薄殼（泡泡，正中間看得穿）
                              0.15 是一團厚實的霧
         uClBias  徑向偏壓：<1 往外緣擠（外圈鑲亮邊、內部空掉）
                            >1 往核心縮（亮核外面散一層暈）

     uClNorm 是尺寸校正。這裡的道理比隨機圓還直接：所有粒子都投影在剪影
     裡面，平均螢幕密度就是「粒子數 ÷ 剪影面積」。粒子數固定，所以把剪影
     面積校正回圓球的 π，過曝才不會隨著擲到什麼形狀上下亂跳。

     **沒有逐顆的密度補償係數（gEggGain），是刻意的。** 那是給薄殼用的 ——
     殼上每一圈的粒子數固定、圈長卻是 2πρ，ρ 一小就擠成一條死白。霧不一樣：
     同一條緯度的粒子被 [uClIn, 1] 攤在一整段徑向上，本來就散得開；而且
     離散圓的螢幕密度天生就是中間濃、邊緣淡（1/r² 的體密度沿視線積分），
     硬補一個係數會把這個看家本領抹平。密度改由 rollCloud() 的峰值判準管，
     那是直接量投影後的結果，比任何解析式都貼近觀眾看到的東西。 */
  float cloudRadius(float u) {
    float s = pow(max(0.0, 1.0 - pow(abs(u), uClN)), 1.0 / uClN);
    s *= 1.0 + uClSkew * u;
    s *= 1.0 + uClWaist * cos(u * M_PI);
    return max(s, 0.0);
  }

  vec3 shapeCloudR(float i) {
    vec3 dir = shapeSphere(i);
    float u  = clamp(dir.y, -1.0, 1.0);
    // 方位角。極點的 xz 長度是 0，直接除會變 NaN，所以夾一個下限
    vec2 az  = dir.xz / max(length(dir.xz), 1e-4);
    float rho = cloudRadius(u);
    vec3 shell = vec3(az.x * rho, u * uClH, az.y * rho);

    /* 徑向縮放：**只吃粒子編號**，和方向無關 —— 這一行就是「離散」。
       離散圓是 mix(0.5, 1.0, hash)，也就是偏壓固定 1 的特例。
       pow 把均勻的 hash 推向兩端，決定「亮在外圈還是亮在核心」。
       內殼是外殼等比縮小的複本，所以殼厚在每個方向都成比例，
       扁形不會變成「橫著薄、豎著厚」。 */
    float r = mix(uClIn, 1.0, pow(hash11(i), uClBias));

    // 抖動擺在校正外面，視覺上的顆粒感才不會跟著形狀大小縮放
    vec3 jitter = vec3(hash11(i + 3.1), hash11(i + 7.7), hash11(i + 11.3)) * 2.0 - 1.0;
    return shell * r * uClNorm + jitter * 0.1;
  }

  /* 打散：把點從規則格線上推開。
     Fibonacci 球是零隨機的完美點陣，點會落在菱形格線上；密度一高，
     相鄰兩點的間隙小到眼睛會自動把整排連成線，看起來就不是圓點而是短斜條。

     推的方向要**垂直於半徑**：帶半徑分量的話球殼會變厚、輪廓跟著糊掉，
     而輪廓的銳利正是這顆球好看的原因。 */
  /* gate 是「這個形狀吃不吃打散」：文字傳 0。

     文字不吃打散，和它不吃景深是同一個理由 —— 字是拿來讀的，把筆畫推歪
     就失去意義。面板上那根滑桿本來就對文字隱藏，但**藏起來不等於關掉**：
     在圓球上調高再捲到文字，值還在，字照樣被推糊（實測滑桿 0 → 3，
     文字的邊緣銳利度掉 9%）。所以要在這裡真的乘掉。 */
  vec3 scatter(vec3 p, float i, float gate) {
    float amt = uScatter * gate;
    if (amt <= 0.0) return p;
    vec3 j = vec3(hash11(i * 1.7), hash11(i * 3.1 + 11.0), hash11(i * 5.3 + 23.0)) * 2.0 - 1.0;
    vec3 n = normalize(p);
    j -= n * dot(j, n);
    return p + j * amt;
  }

  /* ── 揮散：一小撮粒子從字身上飄出去、淡掉、再回到字上重來 ──────────

     為的是讓文字不只是「被畫出來」，而是還在散發東西 —— 字身是實的，
     邊緣有幾十顆塵埃正在離開它。

     三個條件缺一不可，每一個都對應一種會被看穿的破綻：

     ① **誰是揮散粒子只看編號，不看時間。** 同一顆永遠是同一個角色。
        若改成「每格重抽」，就會看到粒子在字上和半空之間閃現。
     ② **淡出要淡到 0，而且連續。** fragment 有 discard 門檻（0.004），
        沒淡到 0 的話粒子會在半空中忽然不見，像被剪掉一格。
     ③ **迴圈的接縫要藏在字身上。** 相位繞回 0 的瞬間，粒子正好貼著筆畫、
        亮度也正好從 0 開始爬。那裡本來就擠滿粒子，接縫看不出來；
        如果讓它在遠處重生，就會看到「憑空冒出來」。

     每顆的週期和方向都由自己的編號決定，所以整片不會一起呼吸。 */
  /* 「少而遠」不是「多而近」。第一版挑了 12% 的粒子、只飄出字高的一半，
     結果整個字被一層均勻的霧包住 —— 那看起來是「模糊」不是「有東西在飄」。
     眼睛要能認出一顆一顆的塵埃，就得讓它們**稀疏**而且**走得夠遠**。
     滑桿開到 0~100%：拉到底就是整個字都在飄，筆畫只剩下相位剛繞回 0 的
     那一撮，是「字正在散掉」；預設 50%。 */
  float gWaftLife;                // 這一顆的亮度係數，非揮散粒子固定 1

  /* pick 是「揮散粒子」的門檻，從外面傳進來而不是直接讀 uWaftPick ——
     隨機離散吃的是放大過的值，見呼叫端的 waftPick。 */
  vec3 waftOffset(float i, float dist, float gate, float pick) {
    gWaftLife = 1.0;
    if (gate <= 0.001) return vec3(0.0);

    /* 挑中與否要有一段**軟邊**，不能用硬門檻。
       拉「揮散粒子」滑桿等於在移動這條界線，硬門檻會讓剛跨過去的粒子從
       筆畫上瞬移到它當下相位該在的半空中 —— 拉滑桿時整片會啪啪跳。
       軟邊讓界線附近的粒子只飄一點點，跟著滑桿慢慢被推出去。 */
    float sel = 1.0 - smoothstep(pick - 0.025, pick, hash11(i * 0.317 + 5.0));
    if (sel <= 0.0) return vec3(0.0);
    gate *= sel;
    dist *= sel;

    float seed = hash11(i * 1.93 + 11.0);
    float ph = fract(uTime * (0.055 + seed * 0.075) + seed);

    /* 方向：均勻散佈在整個球面上 —— 從筆畫**四面八方**離開，不是集體往上飄。

       取樣要對 cos(緯度) 均勻，不能對緯度角均勻。後者會在南北極擠成一團
       （每一圈緯線的周長不一樣長，角度均勻等於給短的那幾圈同樣多的粒子），
       畫面上就會看到上下兩束、腰間反而稀 —— 那不是四面八方。 */
    float lat = hash11(i * 2.7 + 3.0) * 2.0 - 1.0;      // 這一顆的 cos(緯度)
    float az  = hash11(i * 3.3 + 7.0) * 6.2832;         // 方位角
    float ring = sqrt(max(0.0, 1.0 - lat * lat));       // 該緯度那一圈的半徑
    vec3 dir = vec3(ring * cos(az), lat, ring * sin(az));
    /* 次方大於 1 = 起步慢、越飄越開。這同時決定了**沿路的疏密**：
       位移對相位的變化率在起點附近最小，所以粒子擠在筆畫邊上、越遠越稀，
       正好是煙塵該有的樣子。1.8 是看起來最像「從字上被帶起來」的值。 */
    float travel = pow(ph, 1.8);
    /* 三軸各自蜿蜒，路徑才是飄的不是直線射出去。

       三個相位要用**各自獨立的 hash**，不能拿同一個 seed 乘不同係數。
       乘出來的相位只涵蓋一兩圈，同一瞬間整群粒子的偏移就不會互相抵銷 ——
       整片會一起往同一邊晃。實測那會讓上下的分佈在 50% 附近來回擺盪。 */
    vec3 wob = vec3(sin(uTime * 0.90 + hash11(i * 5.1 + 21.0) * 6.2832),
                    sin(uTime * 0.75 + hash11(i * 6.7 + 31.0) * 6.2832),
                    sin(uTime * 0.85 + hash11(i * 8.3 + 41.0) * 6.2832)) * 0.09 * ph;

    // gate 是轉場用的，離開文字時淡回 1，不然切走的瞬間亮度會跳
    float life = smoothstep(0.0, 0.04, ph) * (1.0 - smoothstep(0.45, 1.0, ph));
    gWaftLife = mix(1.0, life, gate);
    return (dir * travel + wob) * dist;
  }

  /* 超級形狀（Gielis 超級公式）：一條公式、三個參數，長出星形、海星、
     貝殼、多面體、花瓣。參數連續可動，所以形狀之間本來就會自然變形。

     m = 0 時退化成正圓，所以它和圓球之間可以無縫過渡。 */
  float superR(float ang, float m, float n1, float n2) {
    float t = m * ang * 0.25;
    float s = pow(abs(cos(t)), n2) + pow(abs(sin(t)), n2);
    // n1 小的時候 pow(s, -1/n1) 會爆到天上去，粒子直接飛出畫面，一定要夾
    return clamp(pow(max(s, 1e-4), -1.0 / n1), 0.0, 2.5);
  }
  vec3 shapeSuper(float i) {
    // 用 R2 低差異序列取經緯度，比規則網格均勻（規則網格會在極區擠成一團）
    float lat = asin(clamp(fract(i * R2_A1) * 2.0 - 1.0, -1.0, 1.0));
    float lon = fract(i * R2_A2) * 2.0 * M_PI - M_PI;
    float r1 = superR(lon, uSuperM, uSuperN1, uSuperN2);
    float r2 = superR(lat, uSuperM, uSuperN1, uSuperN2);
    // uSuperNorm 由 JS 端實測這組參數的最大半徑後倒數傳進來（見 applySuper）。
    // 不正規化的話，「圓潤度」拉到底半徑會變成圓球的 6 倍，形狀直接撐出畫面、
    // 甚至跑到鏡頭後面被裁掉。正規化之後「形狀大小」對每個參數組合都是同一個意思
    return vec3(r1 * cos(lon) * r2 * cos(lat),
                r2 * sin(lat),
                r1 * sin(lon) * r2 * cos(lat)) * uSuperNorm;
  }

  /* ── 人頭 ────────────────────────────────────────────────
     五顆頭跑同一條式子，差別只在一組臉型參數。刻意不做頭髮 ——
     一加頭髮就變成靠髮型分辨，輪廓本身的差異反而看不出來。

     **粒子分成四個部件**，各佔一段編號。這是 3D 建模的做法：眼球、耳朵、
     脖子和頭皮不是同一張連續曲面，硬用「把球面推出去」做，推出來的一定是
     黏在頭上的一塊瘤。

       0 ~ 87%    頭骨與臉（球面形變）
       87 ~ 94%   脖子（獨立柱體）
       94 ~ 98%   耳朵（左右各一片有捲邊的橢圓）
       98 ~ 100%  眼球（左右各一個半球，比眼窩略凸）

     **特徵只留會出現在剪影上的。** 粒子夠粗，鼻孔、唇珠、人中這種等級的
     細節根本畫不出來，加了只是把附近的點推歪。寧可少幾樣、每樣做足。

     高度座標 h（球面緯度）：
       +1.00 頭頂 ／ +0.09 眉 ／ -0.02 眼 ／ -0.44 鼻尖 ／
       -0.60 上唇 ／ -0.67 下唇 ／ -0.89 下巴 ／ -1.00 下顎底
     取自畫像的「三庭」：髮際到眉、眉到鼻底、鼻底到下巴各佔三分之一。 */
  struct Face {
    float headW;        // 頭寬
    float craniumH;     // 顱高（幼童大顱）
    float faceLen;      // 臉長（顴骨以下）
    float jawW;         // 下顎寬
    float gonion;       // 下顎角／咬肌
    float chinW;        // 下巴寬
    float chinOut;      // 下巴前突（小＝後縮）
    float brow;         // 眉骨
    float foreSlope;    // 額頭後倒
    float cheekBone;    // 顴骨
    float cheekHollow;  // 頰凹（負值＝嬰兒肥）
    float noseY;        // 鼻尖高度
    float noseOut;      // 鼻突
    float noseHook;     // 鷹勾
    float noseW;        // 鼻翼寬
    float lip;          // 唇厚
    float eyeDeep;      // 眼窩深
  };

  Face faceOf(int id) {
    //          headW crH   faceL jawW  gon   chinW chinO  brow   foreS  chkB   chkH    noseY  nOut   nHook  nW     lip    eyeD
    Face F = Face(0.70, 1.00, 1.00, 0.84, 1.00, 0.31, 0.085, 0.115, 0.085, 0.035, 0.020, -0.44, 0.215, 0.020, 0.145, 0.052, 0.060);  // 11 方臉
    if (id == 12) F = Face(0.61, 1.00, 1.12, 0.58, 0.50, 0.19, 0.080, 0.080, 0.060, 0.085, 0.055, -0.48, 0.245, 0.060, 0.115, 0.042, 0.065);  // 長臉
    if (id == 13) F = Face(0.74, 0.97, 0.90, 0.76, 0.35, 0.30, 0.040, 0.030, 0.030, 0.015, -0.035, -0.40, 0.170, 0.000, 0.152, 0.070, 0.032);  // 圓臉
    if (id == 14) F = Face(0.65, 1.00, 1.06, 0.62, 0.55, 0.25, 0.005, 0.125, 0.100, 0.070, 0.100, -0.47, 0.260, 0.055, 0.158, 0.026, 0.085);  // 老者
    if (id == 15) F = Face(0.71, 1.13, 0.74, 0.61, 0.20, 0.23, 0.030, 0.010, 0.010, 0.008, -0.060, -0.33, 0.140, 0.000, 0.125, 0.062, 0.024);  // 少年
    return F;
  }

  /* 四個部件算完都走這裡：臉長／顱高的比例調整、幫脖子讓出空間，
     最後轉成「臉朝畫面左前方 45°」。集中在一個函式，四個部件才不會
     各轉各的而對不起來。

     自轉速度不是 0 的話，這個 45° 是**起算角度**，之後會一路轉開。 */
  vec3 headFinish(vec3 p, Face F) {
    float y0 = p.y;
    p.y *= mix(1.0, F.faceLen,  smoothstep(0.15, -0.35, y0));
    p.y *= mix(1.0, F.craniumH, smoothstep(-0.10, 0.50, y0));
    // 只平移不縮放。之前為了塞脖子把整顆頭乘 0.8，頭寬高比就從 0.70 掉到
    // 0.875 —— 正面看變成一顆圓球。脖子該往下長，不是把頭壓扁
    p.y += 0.26;
    return rotateY(p, -0.7853981634);         // -45°
  }

  vec3 shapeHead(float i, int id) {
    Face F = faceOf(id);
    float n = uCount;
    vec3 p;

    if (i > n * 0.98) {
      // ── 眼球。半球就好，後半埋在眼窩裡看不到。
      //    點雲裡沒有陰影，眼睛要靠「一小團高密度」才讀得出來
      float side = mod(i, 2.0) * 2.0 - 1.0;
      vec3 s = sphereN(floor((i - n * 0.98) * 0.5), n * 0.01);
      s.z = abs(s.z);
      p = vec3(side * F.headW * 0.40, -0.015, 0.435) + s * 0.088;

    } else if (i > n * 0.94) {
      // ── 耳朵。外緣（耳輪）外翻、中央（耳甲）凹陷、下方是耳垂
      float side = mod(i, 2.0) * 2.0 - 1.0;
      float j = (i - n * 0.94) * 0.5;
      float a = GOLDEN * j;
      float rad = sqrt(fract(j * R2_A1));     // sqrt 才會均勻鋪滿整片，不會擠在中心
      float ey = cos(a) * rad, ez = sin(a) * rad;
      float rim = smoothstep(0.55, 1.0, rad);
      p.y = -0.175 + ey * 0.155;
      p.z = -0.215 + ez * 0.085 * (1.0 + 0.4 * smoothstep(-1.0, 0.5, ey))
                   + smoothstep(-0.35, -1.0, ey) * 0.025;
      p.x = side * (F.headW * 0.96 + rim * 0.05 - (1.0 - rim) * 0.035);

    } else if (i > n * 0.87) {
      // ── 脖子。上密下疏（k 開 0.75 次方），底部自然變稀而不是像被切斷
      float u = pow((i - n * 0.87) / (n * 0.07), 0.75);
      float a = GOLDEN * i;
      float rr = 0.74 + 0.26 * hash11(i);     // 截面有厚度，不是一根空心管
      p = vec3(cos(a) * mix(0.27, 0.46, u * u) * rr,
               -0.56 - u * 0.62,
               sin(a) * mix(0.24, 0.36, u * u) * rr - 0.20);

    } else {
      // ── 頭骨與臉
      vec3 d = sphereN(i, n * 0.87);
      float h = d.y;
      p = d;

      // ① 比例。真人頭 高:寬:深 ≈ 23:15:19
      p.x *= F.headW;
      p.z *= 0.78;
      p.z -= 0.10;               // 重心移到耳朵那條線上，擺盪才像轉頭而不是繞圈

      float front = smoothstep(0.02, 0.50, d.z);
      // back 的過渡刻意拉得很長。下顎底那一刀是靠它加權的，過渡短的話
      // 曲面會在同一圈上急轉，點擠成一條亮線（看起來像垂下來的絲帶）
      float back = smoothstep(-0.15, 0.95, -d.z);

      // ② 下顎與咬肌
      p.x *= mix(1.0, F.jawW, smoothstep(0.26, 1.02, clamp(-h, 0.0, 1.0)));
      p.x += sign(p.x) * F.gonion * 0.05 * gauss(h, -0.50, 0.15) * (1.0 - front);

      // ③ 後腦鼓出；下顎以下的背面往上斜切（那裡是下顎底面，不是頭）。
      //    斜切的權重用「這顆點在前後方向的位置」，不用「它有多朝後」——
      //    後者在耳朵正下方只剩一半力道，那一塊就掛著一團像雙下巴
      p.z -= back * 0.13 * smoothstep(-0.40, 0.30, h);
      p.z += back * 0.12 * smoothstep(0.30, 1.00, h);   // 不然顱骨像顆氣球
      float behind = smoothstep(0.35, -0.55, p.z);
      float low = smoothstep(0.00, -0.85, h);
      p.y += behind * 0.52 * low;
      p.z += behind * 0.16 * low;
      p.y *= 1.0 - 0.07 * smoothstep(0.25, 1.0, h);     // 顱頂是圓弧不是尖穹頂

      // ④ 顳窩：耳朵上方的側面是平的，不是圓的
      float ax = abs(p.x);
      p.x -= sign(p.x) * 0.032 * gauss(ax, F.headW * 0.92, 0.16) * gauss(h, 0.22, 0.26);

      // ⑤ 額頭後倒
      p.z -= front * smoothstep(0.12, 0.85, h) * F.foreSlope;

      /* ⑥ 五官。每一項都是「位置 × 範圍 × 幅度」的高斯，疊在臉的正面。
         解剖細節不用另外建模，就是一串高斯 —— 這是這套做法的核心。 */
      float prof = 0.0;
      prof -= gauss(ax, 0.42, 0.22) * 0.080;                                   // 臉是平的不是半球
      float browY = 0.09 + 0.035 * smoothstep(0.10, 0.34, ax);                 // 眉弓外側略高
      prof += gauss(ax, 0.20, 0.26) * gauss(h, browY, 0.085) * F.brow;         // 眉骨
      prof -= gauss(ax, 0.28, 0.120) * gauss(h, -0.02, 0.090) * F.eyeDeep;     // 眼窩
      prof -= gauss(p.x, 0.0, 0.075) * gauss(h, 0.015, 0.055) * 0.060;         // 鼻根
      // 鼻樑用兩段 smoothstep 疊出不對稱的坡：從眉間緩升、過了鼻尖陡降。
      // 用高斯的話上下對稱，鼻樑會一路鼓到額頭去
      float dorsum = smoothstep(0.03, F.noseY, h)
                   * smoothstep(F.noseY - 0.11, F.noseY - 0.03, h);
      prof += gauss(p.x, 0.0, 0.080) * dorsum * F.noseOut;                     // 鼻樑＋鼻尖
      prof += gauss(p.x, 0.0, 0.065) * gauss(h, (0.03 + F.noseY) * 0.5, 0.10) * F.noseHook;
      prof += gauss(ax, F.noseW, 0.050) * gauss(h, F.noseY + 0.045, 0.050) * F.noseOut * 0.6;  // 鼻翼
      prof += gauss(p.x, 0.0, 0.140) * gauss(h, -0.600, 0.042) * F.lip * 0.95; // 上唇
      prof += gauss(p.x, 0.0, 0.120) * gauss(h, -0.672, 0.044) * F.lip * 1.20; // 下唇
      prof -= gauss(p.x, 0.0, 0.115) * gauss(h, -0.775, 0.048) * 0.042;        // 頦唇溝
      prof += gauss(p.x, 0.0, F.chinW) * gauss(h, -0.885, 0.095) * F.chinOut;  // 下巴
      prof += gauss(ax, 0.44, 0.150) * gauss(h, -0.030, 0.150) * F.cheekBone;  // 顴骨弓
      prof -= gauss(ax, 0.40, 0.140) * gauss(h, -0.330, 0.140) * F.cheekHollow;// 頰凹
      p.z += front * prof;
    }

    return headFinish(p, F);
  }

  /* ── 大腦 ────────────────────────────────────────────────
     三件事撐起辨識度：前窄後寬的卵形、正中線那道分開左右腦的深溝、
     表面蜿蜒的腦回。少了正中線的溝，看起來只是一顆有皺紋的球。

     溝**不能用「把點往下壓」來做** —— 點雲裡點被壓下去只是換個位置，
     照樣發亮。要看得出溝就得讓那一條沒有點：把左右腦各往外推開。 */
  vec3 shapeBrain(float i) {
    // 腦幹：最後 5% 的粒子拉成一小根往下後方的柱子。
    // 沒有它，剪影只是個橢圓；有了它一眼就認得出是腦
    float stemN = uCount * 0.05;
    if (i > uCount - stemN) {
      float k = (i - (uCount - stemN)) / stemN;         // 0 接著腦、1 最下端
      float a = GOLDEN * i;
      float rr = mix(0.20, 0.11, k) * (0.55 + 0.45 * hash11(i));
      return vec3(cos(a) * rr, -0.30 - k * 0.44, sin(a) * rr - 0.12 - k * 0.12);
    }

    vec3 d = shapeSphere(i);
    vec3 p = d;

    // ① 卵形：前後長、左右窄、上下扁，而且前額葉比枕葉細
    p *= vec3(0.72, 0.66, 0.98);
    float fwd = smoothstep(-0.10, 0.90, d.z);
    p.x *= mix(1.0, 0.70, fwd);
    p.y *= mix(1.0, 0.82, fwd);

    // ② 底面壓平：大腦底部貼著顱底。用壓縮不用夾住，夾住會把點堆成一片實心平板
    if (p.y < -0.26) p.y = -0.26 + (p.y + 0.26) * 0.45;

    // ③ 腦回。用「被彎過的正弦」而不是雜訊 —— 腦回是有走向的長條溝，
    //    雜訊只會做出隨機顆粒，看起來像雜訊不像腦
    //    三層疊起來、每一層的相位都被上一層扭過（domain warping），
    //    溝才會蜿蜒而不是整齊的同心波紋
    vec3 n = normalize(d);
    float g  = sin(p.z * 13.0 + sin(p.y *  8.0) * 2.6 + sin(p.x * 6.0) * 2.0);
    float g2 = sin(p.x * 17.0 + sin(p.z *  9.0) * 2.4 + p.y * 3.0);
    float g3 = sin(p.y * 21.0 + sin(p.x * 11.0) * 1.8);
    p += n * (g * 0.038 + g2 * 0.020 + g3 * 0.010);

    // ④ 正中縱裂。只切上半 —— 下面是胼胝體，左右腦在那裡本來就連著
    float top = smoothstep(-0.05, 0.40, d.y);
    p.y -= gauss(p.x, 0.0, 0.15) * top * 0.11;   // 溝口往下凹
    p.x += sign(p.x) * 0.050 * top;              // 左右推開，中間留出真的空隙

    // ⑤ 小腦：後下方鼓一塊，表面是細密橫紋，和大腦的粗腦回一眼就分得出來
    float cb = smoothstep(0.10, 0.75, -d.z) * smoothstep(-0.15, 0.60, -d.y);
    p += n * cb * (0.15 + sin(p.y * 55.0) * 0.014);
    p.y -= cb * 0.05;
    // 大腦和小腦之間的橫裂。沒有這條縫，小腦只是後腦鼓了一塊
    p.y -= gauss(d.y, -0.12, 0.09) * smoothstep(0.1, 0.7, -d.z) * 0.07;

    return p;
  }

  /* 烘焙形狀：CPU 端算好的目標座標存在一張貼圖裡，這裡依粒子編號查表。
     3D 模型、文字這些寫不成函式的東西都走這條路 —— 查完出來的東西和
     shapeAt() 完全同型（吃編號、吐單位空間裡的一點），所以下游的配對、
     打散、擺盪、跨形狀混色全都不用改，兩類形狀之間照樣能平滑互變。 */
  vec3 bakedAt(sampler2D tex, float i) {
    float x = mod(i, uTexSize.x);
    float y = floor(i / uTexSize.x);
    return texture2D(tex, (vec2(x, y) + 0.5) / uTexSize).xyz;
  }

  vec3 shapeAt(int id, float i) {
    if (id == 0) return shapeSphere(i);
    if (id == 1) return shapeCube(i);
    if (id == 2) return shapeCone(i, 3.0);
    if (id == 3) return shapeCone(i, 64.0);
    if (id == 4) return shapeTorus(i);
    if (id == 5) return shapeHelix(i);
    if (id == 6) return shapeCloud(i);
    if (id == 7) return shapeSuper(i);
    if (id == 8) return shapeEgg(i);
    if (id == 9) return shapeHelixR(i);
    if (id == 17) return shapePoly(i);
    if (id == 10) return shapeBrain(i);
    if (id == 16) return shapeCloudR(i);
    return shapeHead(i, id);       // 11~15 五種臉型
  }

  /* src = 粒子在平面上的**原始**位置（fieldAt 之前），不是 main() 裡那個 origin。
     兩者在 25 款背景形態下相同，漩渦那五款會把 x、z 攪動，差別就在那裡。 */
  float convergeDelay(vec3 target, vec3 src, float i) {
    if (uDirection == 1) return target.y * 0.5 + 0.5;
    if (uDirection == 2) return 1.0 - (target.y * 0.5 + 0.5);
    /* 水平方向依粒子的原始位置。要除以「已鋪開的寬度」，否則鋪開寬度一調大，
       延遲就會超出 0～1 而讓兩端的粒子擠在同一時間出發。
       吃 src（fieldAt 之前）而不是吃套用後的位置：漩渦那五款會把 x 整片攪動，
       吃套用後的話 xn 每一格都在變、還會跑出 0~1 之外。 */
    float xn = (src.x - uOrigin.x) / (uPlaneSize.x * uSpread) + 0.5;
    if (uDirection == 3) return xn;              // 由左至右
    if (uDirection == 4) return 1.0 - xn;        // 由右至左
    if (uDirection == 5) return hash11(i);       // 隨機（保留但面板未開放，要用把它加回 DIRECTIONS）
    return 0.0;
  }
  // 把全域進度換算成這顆粒子的個別進度。
  // 分母 (1 - uStagger) 是「每顆粒子的飛行佔總時長的比例」—— 最晚出發的粒子
  // 在 uStagger 出發、剛好在 1.0 抵達。
  // 但「同時」模式下所有 delay 都是 0，再除以那個分母的話整批會在 0.45 就到齊，
  // 後面 55% 的捲動完全空轉。所以那個模式不壓縮時間軸。
  float staggered(float p, float delay) {
    float st = (uDirection == 0) ? 0.0 : uStagger;
    return clamp((p - delay * st) / max(0.001, 1.0 - st), 0.0, 1.0);
  }

  void main() {
    vAlpha = aAlpha * uWaveAlpha;

    // ① 背景形態（波浪是其中之一）。注意是「減」波高 ——
    //    配合往上仰的鏡頭，波峰才會朝向觀眾
    /* flatPos = 還沒被背景形態推過的位置。收斂延遲（convergeDelay）吃的是它，
       不是吃 origin —— 漩渦那幾款會把粒子在 x、z 上整片攪動，吃 origin 的話
       「這顆離形狀多遠」每一格都在變，收斂的前緣會跟著轉。
       名字不能叫 flat：那是 GLSL 的保留字（內插修飾詞），會直接編不過。 */
    vec3 flatPos = vec3(uOrigin.x + (position.x - uOrigin.x) * uSpread, position.y, position.z);
    vec3 origin = fieldAt(flatPos, aIndex);

    // ② 波浪配色：依螢幕水平位置分左中右三色，再疊滑鼠反光
    vec4 proj = projectionMatrix * modelViewMatrix * vec4(origin, 1.0);
    float sx = clamp(proj.x / proj.w, -1.0, 1.0);
    vColor = (sx < 0.0) ? mix(uWaveA, uWaveB, sx + 1.0) : mix(uWaveB, uWaveC, sx);
    vColor = waveReflection(vColor, sx, origin);

    vec3 pos = origin;
    float amount = 0.0;

    /* 目前的形狀有幾成屬於「形狀文字」這一類（轉場中是中間值）。
       這一類目前有兩個：文字（200）和隨機離散（17）。三個地方要用：
       吃揮散、不吃打散、關景深。在 if 外面算，因為景深是在收斂那一段**之後**才算的。

       兩者為什麼同一類：都是擺在畫面平面上的東西 —— 字轉一下就讀不出來、
       角形轉到側面只剩一條厚度。所以都定在正面、都會被打散推歪、
       都有一部分落在合焦範圍外。 */
    float pinFrom = (uShapeFrom == 200 || uShapeFrom == 17) ? 1.0 : 0.0;
    float pinTo   = (uShapeTo   == 200 || uShapeTo   == 17) ? 1.0 : 0.0;
    float pinMix  = mix(pinFrom, pinTo, uShapeMix);
    /* 隨機離散的揮散要比文字重 —— **滑桿的值不動**，在這裡放大。
       同一支滑桿在兩個形狀上看起來差很多：文字本身只有 73px 高，飄出去的
       粒子落在一片空白裡，一眼就看得到；隨機離散本身已經 407×450 而且是密的，
       同樣那批粒子攤在更大的範圍裡就只剩一層薄霧。放大是把「看起來的量」
       拉齊，而不是改滑桿 —— 滑桿是使用者的意圖，兩個形狀共用同一個值。
       兩個都用 uShapeMix 補間（和 pinMix 一樣），轉場中不會跳。

       **兩個參數要用不同的放大方式，因為一個沒有上限、一個有。**

       揮散範圍是位移，愛多遠就多遠，直接乘 2。 */
    float waftGain = mix(uShapeFrom == 17 ? 2.0 : 1.0,
                         uShapeTo   == 17 ? 2.0 : 1.0, uShapeMix);
    /* 揮散粒子是 0~1 的門檻（見 waftOffset 的 sel），上限是「全部粒子」。
       直接乘 3 的話滑桿到 33% 就已經滿了，上面三分之二拉了完全沒反應 ——
       等於拿量程換強度。改用「給每顆三次機會」：沒被選中要三次都沒中，
       所以入選率是 1 − (1−p)³。
         p 很小時 ≈ 3p（滑桿低段就是實打實的三倍）
         p = 1 時剛好 = 1（滑桿頂端不再被硬夾住）
       要講準一點：量程沒有死掉，但解析度集中在下半段 —— 滑桿 50% 門檻已經
       0.875，剩下的半條只把它推到 1.0（實測覆蓋率 17.37% → 17.99%）。
       比乘 3 直接夾（33% 以上全平）好很多，但不是「上下半段一樣好用」。
       max() 是因為 tick() 給了 uWaftPick 一個最多 1.2 倍的呼吸調變，
       1−p 會變負的，而 GLSL 的 pow 對負底數是未定義行為。 */
    float pick3    = 1.0 - pow(max(1.0 - uWaftPick, 0.0), 3.0);
    float waftPick = mix(uShapeFrom == 17 ? pick3 : uWaftPick,
                         uShapeTo   == 17 ? pick3 : uWaftPick, uShapeMix);

    // ③ 收斂到目標形狀
    if (uProgress > 0.0) {
      /* 形狀相關的一律用 aShapeIndex（配對過的編號），不是 aIndex。
         gEggGain 每次呼叫前都要歸 1 —— 只有 shapeEgg 和 shapeHelixR 會寫它，
         不歸 1 的話切到別的形狀還會沿用上一個形狀留下的係數。 */
      gEggGain = 1.0;
      vec3 unitRaw = (uToBaked == 1) ? bakedAt(uTexTo, aShapeIndex)
                                     : shapeAt(uShapeTo, aShapeIndex);
      float eggGain = gEggGain;
      if (uShapeMix < 1.0) {
        gEggGain = 1.0;
        vec3 uFrom = (uFromBaked == 1) ? bakedAt(uTexFrom, aShapeIndex)
                                       : shapeAt(uShapeFrom, aShapeIndex);
        eggGain = mix(gEggGain, eggGain, uShapeMix);
        unitRaw = mix(uFrom, unitRaw, uShapeMix);
      }
      // 混色完再打散，兩個形狀才會用同一組偏移。形狀文字那一類不吃打散
      unitRaw = scatter(unitRaw, aShapeIndex, 1.0 - pinMix);
      /* 旋轉。角度在 JS 端算好（updateRotation），這裡只負責轉：
           一般形狀 → 自轉 ＋ 滑鼠左右一整圈
           文字     → 定在正面 ＋ 滑鼠撥動，夾在左右各 15 度

         **只轉 Y 軸**（左右）。上下曾經加過（滑鼠推出抬頭低頭），試過之後
         拿掉了 —— 形狀被上下轉的時候剪影會變扁，粒子雲沒有明暗只有輪廓，
         扁掉就等於資訊變少。要接回來的話是加一個 rotateX，而且要在
         rotateY **之後**做，轉軸才會是畫面的水平軸而不是形狀自己的軸。

         全轉曾經改過「左右擺盪」又改回來：擺盪的好處是背面永遠轉不到前面，
         烘焙時可以把看不到的那一塊砍掉；改回全轉是為了支援使用者自己貼的
         任意模型（哪一面是正面不再由我們決定）。現在只有文字破例。 */
      vec3 unit = rotateX(rotateY(unitRaw, uSpinAngle), uPitchAngle);

      /* 揮散。放在**旋轉之後**，兩個理由：
           ① 飄的方向要是畫面的上下左右（世界座標），不是字自己的軸。
           ② 收斂延遲吃的是 unitRaw，不能被這個時變的位移汙染 ——
              汙染了的話捲動收斂時整片的出發時序會跟著抖。
         只有文字有；轉場中用 uShapeMix 補間，切進切出都不會跳。 */
      float waftGate = pinMix * min(1.0, uWaft / 0.12);
      /* 配色要用**還在字上**的位置，不是飄走之後的位置。
         配色是拿 unit.y 從下到上在兩個顏色之間插值的，而下面是淺灰（亮度 155）、
         上面是深藍（亮度 84），差快兩倍。一般形狀的 unit.y 就是 ±1，這個漸層是
         刻意的；但文字本身只佔 ±0.15，揮散卻會把粒子帶到 ±0.7 —— 於是往上飄的
         明顯比往下飄的暗，實測同一個亮度門檻下只數得到 26% 在上面，看起來就
         不是「四面八方」。改用出發位置之後，每一顆的顏色都跟它離開的那一筆一樣。 */
      vec3 unitCol = unit;
      unit += waftOffset(aShapeIndex, uWaft * waftGain * 1.6 * waftGate, waftGate, waftPick);

      /* 文字形狀的尺寸上限。兩題分開算再用 uShapeMix 補間 —— 和 pinMix、
         waftGain 同一個套路；直接在 CPU 端改 uScale 的話，切進切出文字那一瞬間
         整個形狀會跳一下（uScale 是全場共用的，沒有一定要跟著轉場走）。 */
      float fitFrom = (uShapeFrom == 200) ? uTextFit
                    : ((uShapeFrom == 6) ? uSphereFit : 1.0);
      float fitTo   = (uShapeTo   == 200) ? uTextFit
                    : ((uShapeTo   == 6) ? uSphereFit : 1.0);
      /* 文字形狀往上抬到畫面中線之上。和尺寸上限同一個套路：兩端分開算、
         用 uShapeMix 補間，所以切進切出文字都是平滑的，不會跳一下。
         **只有文字抬**，球和背景維持原位。 */
      float liftFrom = (uShapeFrom == 200) ? uTextLift : 0.0;
      float liftTo   = (uShapeTo   == 200) ? uTextLift : 0.0;
      vec3 target = uCenter + vec3(0.0, mix(liftFrom, liftTo, uShapeMix), 0.0)
                  + unit * uScale * mix(fitFrom, fitTo, uShapeMix);

      /* 文字形狀的密度折扣。粒子數是全場共用的，改不動（改了要重建網格和
         配對，畫面會掉一格），所以改成讓固定一批粒子在飛向文字的路上淡掉 ——
         總數沒變，看得見的密度變了。

         **用 aShapeIndex 不是 aIndex**：要均勻的是文字上的分布，不是波浪上的。
         門檻 uTextKeep 由 CPU 端算（見 textKeep），1.0 就是完全不折。
         兩端分開算再用 uShapeMix 補間，和上面的尺寸上限同一個套路。 */
      float keepFrom = (uShapeFrom == 200) ? step(hash11(aShapeIndex * 1.7 + 91.3), uTextKeep) : 1.0;
      float keepTo   = (uShapeTo   == 200) ? step(hash11(aShapeIndex * 1.7 + 91.3), uTextKeep) : 1.0;
      float gTextKeep = mix(keepFrom, keepTo, uShapeMix);

      // 延遲用「未旋轉」的座標算，否則擺盪時擴散的中心會跟著飄
      float t = staggered(uProgress, convergeDelay(unitRaw, flatPos, aIndex));
      amount = t * t * (3.0 - 2.0 * t);

      pos = mix(origin, target, amount);
      pos.y += sin(amount * M_PI) * uArc;

      // unitCol：沒有揮散時就等於 unit，所以其他形狀的配色一點都沒變
      vec3 sc = mix(uShapeColA, uShapeColB, unitCol.y * 0.5 + 0.5);
      sc = mix(sc, uShapeColC, smoothstep(0.0, 1.0, unitCol.z));
      vColor = mix(vColor, sc, amount);

      /* 背面淡化。兩件事和以前不一樣：

         1. **不再乘 aAlpha。** aAlpha 是波浪的「遠端淡出」，對一顆球毫無意義，
            以前卻一路乘進形狀裡。它和背面的折扣相乘之後會掉到 fragment 的
            discard 門檻以下，整條粒子憑空消失 —— 球背面那個洞就是這樣來的。
         2. **下限收到 0，不留 0.08。** 0.08 離門檻只有 11 倍，任何折扣都會穿過去；
            歸零反而安全，因為它是連續趨近 0，沒有「忽然不見」的懸崖。
            原型站也是這樣做的（兩個 smoothstep 相乘，背面真的是 0）。 */
      /* 背面留 8%，不要歸零。

         歸零對圓球沒差（背面本來就被前面擋住），但對**鏤空的形狀是毀滅性的**：
         螺旋是一條細帶繞著中軸，觀眾同時看得到前半圈和後半圈，背面一滅
         就只剩半條，整個結構讀不出來。曲線和下限都用回最初的版本。

         那 0.08 曾經是球背面破洞的元凶之一 —— 但元凶是「三個折扣相乘」，
         不是 0.08 本身。現在不再乘 aAlpha（波浪的遠端淡出），最低就是
         0.08 × uShapeAlpha ≈ 0.039，離 fragment 的 discard 門檻 0.004
         還有十倍，穿不過去。 */
      /* 密度補償要放在 mix 的**正面那一端**，不能整條乘出去。

         乘出去的話背面折扣（0.08）和補償下限（0.12）會相乘：
         六萬顆時 uShapeAlpha 是 0.36，最低 alpha 掉到 0.36×0.08×0.12 = 0.0035，
         直接穿過 fragment 的 discard 門檻 0.004 —— 那些粒子會憑空消失。
         十五萬顆更慘，只剩 0.0022。這就是當初圓球背面破洞的同一種死法：
         **三個小於 1 的係數相乘**。

         寫成 mix(0.08, eggGain, facing) 之後兩者不再相乘：背面就是 0.08、
         正面就是補償值，最低是兩者取小 = 0.08，離門檻永遠有距離。
         而且該補償的地方一點也沒少 —— 會疊成死白的本來就是正面。 */
      /* 吃的是**飄走之後**的 unit.z，不是上面配色用的 unitCol.z —— 這是刻意留的。
         照理說這道折扣講的是「形狀的背面要淡」，對象是形狀不是空中的塵埃，
         改吃 unitCol.z 語意才對。實際 A／B 過（揮散拉滿、隨機離散）：
         暈的光量差 0.04%、總光量差 0.07%，肉眼等於零。
         留原樣是因為「語意比較對」換不到任何看得見的東西，卻要動到文字的路徑。
         哪天揮散範圍再放大、或形狀的 z 厚度變大，這裡要重新量一次。 */
      float facing = smoothstep(-1.0, 0.7, unit.z);
      /* gWaftLife 只有揮散粒子不是 1，而且它**本來就該淡到 0**（飄遠了就消失），
         所以這裡乘出去不會踩到「多個小於 1 的係數相乘害粒子憑空消失」那個坑 ——
         那個坑的前提是「不該消失的粒子被弄消失」，這裡消失才是目的。 */
      /* gTextKeep 和 gWaftLife 一樣，是「本來就該消失」的那類係數 ——
         所以乘出去不會踩到上面那個「多個小於 1 的係數相乘害粒子憑空消失」的坑。
         它只有 0 和 1（轉場中才有中間值），乘在這裡等於整顆淡出。 */
      vAlpha = mix(vAlpha, uShapeAlpha * mix(0.08, eggGain, facing) * gWaftLife * gTextKeep, amount);
    }

    /* ④ 開場：**原地淡入**。

       底稿是「整片從下方浮起再淡入」，位移那一行是
         float d = 1.0 - uReveal;
         pos.y -= d * d * uPlaneSize.y * 3.0;   // 30 個世界單位
       這一頁不要那個上升 —— 第一段要的是波浪一開始就在它該在的位置，
       只有亮度從 0 長出來。位移拿掉之後 d 就沒人用了，一起拿掉。

       淡入的長度不變（uReveal 每格 +0.006×60，約 2.8 秒），
       和標題那三秒差不多，兩者一起浮出來。 */
    if (uReveal < 1.0) {
      vAlpha *= uReveal;
    }

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;

    /* ⑤ 假景深：合焦範圍內完全清晰，超過才漸漸糊成光斑。

       **形狀文字那一類一律不吃景深。** 字是拿來讀的，糊掉就失去意義，
       而字身有厚度（正面加側邊），一定會有一部分落在合焦範圍外。角形也一樣：
       它是面向鏡頭的薄片，厚度那一軸整個橫跨合焦範圍。所以這一類的粒子
       直接把模糊歸零 —— 但**不動面板上的景深滑桿**：那個值原封不動留著，
       切回其他形狀立刻恢復。

       乘 amount 而不是只看 pinMix：還沒收斂進去的粒子仍在波浪帶裡，
       那些該有的景深要留著，不然轉場中整片會忽然變銳利。 */
    float viewDist = max(-mv.z, 0.1);
    vBlur = clamp(smoothstep(uFocusRange, uFocusRange + 90.0, abs(viewDist - uFocus))
                  * uBlur * (1.0 - pinMix * amount), 0.0, 1.0);

    // ⑥ 近大遠小。uPerspective=1 就是標準透視，壓低則前景不會爆大
    float dot = mix(uDotWave, uDotShape, amount);
    float persp = pow(REF_DIST / viewDist, uPerspective) * (300.0 / REF_DIST);
    gl_PointSize = dot * persp * (1.0 + vBlur * 1.5);
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;
  uniform float uEmissive;
  varying vec3  vColor;
  varying float vAlpha;
  varying float vBlur;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    float edge = mix(0.12, 0.5, vBlur);
    float a = smoothstep(0.5, 0.5 - edge, d) * vAlpha;
    a *= mix(1.0, 0.16, vBlur);      // 失焦的點面積變大，亮度要按比例降
    if (a < 0.004) discard;

    /* Premultiplied alpha：顏色先乘上覆蓋率，alpha 欄位改放「要遮住背後多少」。
       配合 One / OneMinusSrcAlpha 的混合，一條式子涵蓋加色到正常混合的整段光譜：
         uEmissive = 1 → alpha 寫 0 → 背後完全不被遮 → 就是純加色（和原本相同）
         uEmissive = 0 → alpha 寫 a → 背後被遮掉 a  → 就是一般的透明混合
       中間值讓密集區「自己遮住自己」而不是無限往上加，過曝就有了上限。 */
    gl_FragColor = vec4(vColor * a, a * (1.0 - uEmissive));
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms, vertexShader, fragmentShader,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.CustomBlending,
  blendSrc: THREE.OneFactor,                 // 顏色已經乘過 alpha 了，不能再乘一次
  blendDst: THREE.OneMinusSrcAlphaFactor,
  blendEquation: THREE.AddEquation,
});
scene.add(new THREE.Points(geometry, material));

/* ══════════════════════════════════════════════════════════
   控制面板
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════
   烘焙形狀：3D 模型與文字 → 目標座標貼圖
   ══════════════════════════════════════════════════════════ */
const bakeMsg   = document.getElementById('bakeMsg');
const textInput = document.getElementById('sText');
const bakeCache = new Map();      // id → Float32Array(MAX_COUNT * 3)，只算一次
const bakeBusy  = new Map();      // id → Promise，避免同一個檔重複下載

/* 轉到單位空間：先轉向，再置中，再等比縮到最長邊剛好是 2。
   和函式型形狀同一個約定（大致落在 -1~1），所以「形狀大小」滑桿
   對兩類形狀的意義一致。 */
function normalise(a, n, src) {
  const yaw = (src.yaw || 0) * Math.PI / 180;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  let mnx = 1e9, mny = 1e9, mnz = 1e9, mxx = -1e9, mxy = -1e9, mxz = -1e9;
  for (let i = 0; i < n; i++) {
    const x = a[i * 3], y = a[i * 3 + 1], z = a[i * 3 + 2];
    const rx = cy * x + sy * z, rz = -sy * x + cy * z;
    a[i * 3] = rx; a[i * 3 + 2] = rz;
    if (rx < mnx) mnx = rx; if (rx > mxx) mxx = rx;
    if (y  < mny) mny = y;  if (y  > mxy) mxy = y;
    if (rz < mnz) mnz = rz; if (rz > mxz) mxz = rz;
  }
  const cx = (mnx + mxx) / 2, cyy = (mny + mxy) / 2, cz = (mnz + mxz) / 2;
  const k = 2 / Math.max(mxx - mnx, mxy - mny, mxz - mnz, 1e-6);
  for (let i = 0; i < n; i++) {
    a[i * 3] = (a[i * 3] - cx) * k;
    a[i * 3 + 1] = (a[i * 3 + 1] - cyy) * k;
    a[i * 3 + 2] = (a[i * 3 + 2] - cz) * k;
  }
}

/* 文字：canvas 畫字 → 掃出不透明的像素 → 抽樣成粒子座標。

   字形和字重由面板的兩個下拉決定，所以這裡是**函式不是常數** —— 換字型
   等於整個點雲要重算，不能在別處先把字串存起來用。

   字重選單 600 / 700 / 800，預設 700。兩頭都會讓字讀不出來，只是死法不同：
   太細撐不起筆畫，太粗會把字腔（O、e、g 中間那個洞）填掉。
   選單收到 600~800 之後，最緊的一格是 Sofia 超窄的 800（13.9%），
   還有餘裕 —— 以前開到 900 時 Montserrat 和 Sofia 都只剩 9.0%。

   **700 是眼睛決定的**，實測表沒有訂門檻，只說明了往哪個方向調。
   完整的表在 references/modeling.md，那裡也記了「這張表管不到預設字型」：
   黑體在 900 還有 16.1%，比窄體在 700 還寬。

   400 曾經留在選項裡（想說「那是風格不是壞掉」），後來拿掉了 —— 但要知道
   那次的實測有瑕疵：四款拉丁字型根本沒有 400 這一級，量到的是 500 的字面。
   500 起跳是保守的下限，不是「400 一定斷」的證明。 */
const fontSel = document.getElementById('sFont');
const weightSel = document.getElementById('sWeight');

/* 曾經有一套「單一字重字型」的處理（option 標 data-fixed、把字重釘住、
   下拉停用、打中文時放開）—— 那是 Bebas Neue 只有 400 才需要的。
   換成 Sofia 超窄（有完整 500~900）之後沒有字型用得到，整組移除了。
   做法和三個坑（假粗體、font-stack 共用字重會連中文後備一起釘、
   HAS_CJK 一定要含韓文）完整留在 references/insights.md。 */
const TEXT_PX = 220;                                        // 畫字用的字級
const textFont = () => textWeight() + ' ' + TEXT_PX + 'px ' + fontSel.value;
const textWeight = () => +weightSel.value;

/* 字距跟著字重走：每重一級加 0.02em。

   為什麼要跟著加：字重越粗，筆畫越往字腔和字間吃。點雲只保得住輪廓，
   字一擠在一起，相鄰兩個字母的粒子就連成一片，讀不出字母的邊界在哪。
   加字距是把那個邊界還回來。

   **基準是絕對的 500，不跟著選單走。** 現在選單是 600/700/800，
   對應 0.02 / 0.04 / 0.06em。曾經選單最低是 500（對應 0），改範圍時
   基準沒有跟著抬到 600 —— 不然同一個字重在不同版本會有不同的字距，
   「700 長什麼樣」會隨著選單的增減而變。**字距是字重的函式，不是選單的函式。**
   夾在 0：負字距會讓字母互相疊上去，比擠在一起更糟。選單最低 600，目前踩不到。
   **它擋不住 NaN。** 如果 weightSel.value 變成空字串（例如選項被改成不存在的值），
   textWeight() 得到 NaN、track 是 NaN、fillText 的 x 是 NaN → 整張畫布空白 →
   粒子全塌在原點，而且一聲不響。目前沒有路徑會走到，但別把這個 max 當成防護。 */
const LETTER_STEP = 0.02;                      // em / 每一級字重
const textTracking = () =>
  Math.max(0, (textWeight() - 500) / 100) * LETTER_STEP * TEXT_PX;   // 回傳 px
/* 厚度：**正面一張 + 側邊一圈，中間和背面都是空的。**

   均勻填滿整個厚度是把預算丟進看不見的地方。點雲讀得到的只有輪廓和密度，
   埋在裡面的點對兩者都沒有貢獻，只會產生霧、還要吃掉曝光預算 ——
   這就是 3d-object-proj/modeling.md 的鐵律二。

   背面也不放：文字只在正負 15 度之間晃（見 updateRotation），背面永遠被
   正面擋著。這裡沒有深度遮蔽，所以背面那一張不但看不出來，還會和正面
   幾乎重疊、疊出一層鬼影把字洗糊 —— 而文字形狀的全部價值就是讀得出來。
   （鐵律三：視角鎖住，才有資格回收預算。）

   單位和 x、y 同一套（都除以半個字高），所以寫的是「佔字高的幾成」而不是
   絕對值 —— 換長字串時 normalise() 把整個形狀等比縮小，厚度和字高的
   比例不會跑掉。實測「厚度／字高」：TEAMMAX 0.52、AI 0.52、
   HELLO WORLD 12 是 0.50 —— 字串長短不影響。 */
const TEXT_DEPTH = 0.50;     // 厚度 ≈ 字高的一半
/* 側邊分到的粒子比例。

   **厚度比這個比例重要得多。** 實測 0.30 / 0.40 / 0.50 / 0.65 / 0.80 五檔：
   0.30 的側邊只是一圈糊邊，看起來像失焦而不是像厚度；0.50 才第一次看得出
   「字有側面」；0.65 以上正面開始破洞（同樣的粒子攤在更深的側牆上就變稀）。
   原因是側邊只在晃動時才露出來，露出的寬度 = 厚度 × sin(角度)，而角度最多
   15 度 —— 厚度不夠的話，那條帶子比粒子本身還細，根本讀不到。

   側邊的比例反而不能照面積算。以 TEAMMAX 為例（正面 97180 像素、輪廓 5794
   像素），晃到 15 度時側邊那條帶子有 22 像素寬、面積 127000，照面積分側邊
   要拿五成七。實際拉到 0.38 正面就開始出現雜斑、0.46 明顯變稀 ——
   字讀不清楚的話厚度做得再好也沒意義。0.30 是四檔比下來正面還乾淨、
   側邊又看得出來的那一檔。 */
const TEXT_WALL = 0.30;

async function sampleText(text) {
  const font = textFont();
  /* 沒等字型載完就量寬度、畫字，量到的會是備援字型 —— 中文尤其明顯。

     `document.fonts.load` 找不到任何符合的 face 時是 **resolve 不是 reject**，
     所以這裡沒進 catch 不代表字型拿到了。Google Fonts 連不上（離線、防火牆）
     的時候四個拉丁體會一起掉到系統字型、長得一模一樣 —— 補一次 check()，
     至少在 console 講一聲，不然只會覺得「這個選單壞了」。 */
  try { await document.fonts.load(font, text); } catch (e) {}
  if (!document.fonts.check(font, text)) console.warn('[hero-dust] 字型沒載到，改用系統字型：' + font);
  const cv = document.createElement('canvas');
  const c = cv.getContext('2d', { willReadFrequently: true });
  const track = textTracking();
  /* 順序固定成「先 font 再 letterSpacing」。舊版瀏覽器有 font 會洗掉
     letterSpacing 的說法，Chrome 151 實測不會 —— 但反過來寫沒有任何好處。
     measureText 有把 letterSpacing 算進去（連最後一格也算），所以下面量出來的
     寬度是對的，20 個字滿版配 900 也不會被切（實測左右各還有 41px）。 */
  c.font = font; c.letterSpacing = track + 'px';
  const w = Math.max(64, Math.ceil(c.measureText(text || ' ').width) + 60);
  cv.width = w; cv.height = 340;
  /* 改 canvas 尺寸會**重設整個繪圖狀態** —— font 和 letterSpacing 都要重設一次。
     （同一個 canvas 的 getContext 永遠回同一個物件，c2 和 c 是同一個。） */
  const c2 = cv.getContext('2d', { willReadFrequently: true });
  c2.fillStyle = '#000'; c2.fillRect(0, 0, cv.width, cv.height);
  c2.font = font; c2.letterSpacing = track + 'px'; c2.fillStyle = '#fff';
  c2.textAlign = 'center'; c2.textBaseline = 'middle';
  /* 往右補半格字距。Chrome 的 letterSpacing 是「每個字元後面都加」，
     連最後一個也加，所以置中會整串往左偏半格。 */
  c2.fillText(text, cv.width / 2 + track / 2, cv.height / 2);

  const d = c2.getImageData(0, 0, cv.width, cv.height).data;
  const solid = (x, y) => d[(y * cv.width + x) * 4] > 120;
  // px = 整個字身（正面用），rim = 只有輪廓那一圈（側邊用）
  const px = [], rim = [];
  for (let y = 0; y < cv.height; y++)
    for (let x = 0; x < cv.width; x++)
      if (solid(x, y)) {
        px.push(x, y);
        // 上下左右任一格是空的就算輪廓。畫布邊緣一律當空的（字不會碰到邊）
        if (x === 0 || y === 0 || x === cv.width - 1 || y === cv.height - 1 ||
            !solid(x - 1, y) || !solid(x + 1, y) || !solid(x, y - 1) || !solid(x, y + 1))
          rim.push(x, y);
      }

  const out = new Float32Array(MAX_COUNT * 3);
  const m = px.length / 2, mr = rim.length / 2;
  if (!m) return out;
  let s = 987654321;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const half = cv.width / 2, halfH = cv.height / 2;
  const front = TEXT_DEPTH / 2;
  for (let i = 0; i < MAX_COUNT; i++) {
    /* 正面和側邊要**隨機交錯**，不能前面一段全是側邊：bakeInto() 是取前 n 顆
       當低密度時的子集，所以任何前綴都必須是整個形狀的均勻樣本。 */
    const wall = mr > 0 && rnd() < TEXT_WALL;
    const src = wall ? rim : px;
    const j = Math.floor(rnd() * (wall ? mr : m)) * 2;
    // 加半格抖動，不然筆畫上會看得出 canvas 的像素格
    out[i * 3]     = (src[j] + rnd() - half) / halfH;
    out[i * 3 + 1] = (halfH - src[j + 1] - rnd()) / halfH;
    // 側邊沿著厚度攤開，正面就貼在最前面那一層
    out[i * 3 + 2] = wall ? (rnd() - 0.5) * TEXT_DEPTH : front;
  }
  normalise(out, MAX_COUNT, { yaw: 0 });
  return out;
}

/* 目前只有文字這一種烘焙來源。保留這層分派是故意的 —— 3D 模型移走之後，
   要接回來只需在這裡多一個分支，其餘（快取、去重、貼圖寫入）都不用動。 */
/* 換字型／字重／文字時 +1。烘焙是非同步的，舊的那一份晚一步回來時，
   `bakeCache.delete()` 早就跑完了 —— 它會把自己寫回快取，把新的蓋掉。
   畫面當下不一定看得出來（setShape 等的是新的那支），但快取已經髒了：
   之後拖「粒子密度」滑桿會直接讀快取重排，整片字就變回舊字型。
   字型從兩個變六個之後，「一個個點過去比較」就是預期用法，很容易撞到。 */
let bakeGen = 0;

function loadBake(def) {
  if (bakeCache.has(def.id)) return Promise.resolve(bakeCache.get(def.id));
  if (bakeBusy.has(def.id)) return bakeBusy.get(def.id);
  const gen = bakeGen;
  // 只清掉自己那一筆：舊的那支回來時，busy 裡放的可能已經是新的了
  const p = sampleText(textInput.value || 'TEAMMAX')
    .then((arr) => {
      if (gen === bakeGen) bakeCache.set(def.id, arr);
      // 字變了，最後一段內文要重新對齊文字形狀的可見下緣
      if (gen === bakeGen && def.id === 200) { textLowY = null; placeBrandCopy(); }
      if (bakeBusy.get(def.id) === p) bakeBusy.delete(def.id);
      return arr;
    })
    .catch((e) => { if (bakeBusy.get(def.id) === p) bakeBusy.delete(def.id); throw e; });
  bakeBusy.set(def.id, p);
  return p;
}

/* 寫進貼圖。這裡做兩件事，順序不能顛倒：

   ① **只取前 n 個**（n = 目前的粒子數）。烘焙時點是亂序產生的，所以任何
      前綴都是整個形狀的均勻子集 —— 密度調低不會變成只剩半隻狗。

   ② **把這 n 個點按配對鍵排序**（先左右、再上下），再依序寫進 0~n-1 號槽。
      這樣「第 k 號槽」在每個形狀裡都代表同一個空間排名，波浪、圓球、模型
      三者的編號就對應得上，轉場才是「整片被拉過去」而不是「散開再聚攏」。

   排序一定要在取前 n 個之後做。先排再取的話，前綴會變成整個形狀最左邊
   那一條，密度一低就只剩一片側影。 */
function bakeInto(slot, arr) {
  const n = Math.min(MAX_COUNT, Math.round(uniforms.uCount.value));
  const order = new Uint32Array(n);
  for (let i = 0; i < n; i++) order[i] = i;
  order.sort((a, b) => arr[a * 3] - arr[b * 3]);

  const cols = Math.max(1, Math.floor(Math.sqrt((PLANE.x / PLANE.z) * n)));
  const rows = Math.ceil(n / cols);
  for (let c = 0; c < cols; c++) {
    const lo = c * rows, hi = Math.min(n, lo + rows);
    if (hi - lo > 1) order.subarray(lo, hi).sort((a, b) => arr[a * 3 + 1] - arr[b * 3 + 1]);
  }

  const d = targetTex[slot].image.data;
  for (let k = 0; k < n; k++) {
    const j = order[k];
    d[k * 4] = arr[j * 3]; d[k * 4 + 1] = arr[j * 3 + 1];
    d[k * 4 + 2] = arr[j * 3 + 2]; d[k * 4 + 3] = 1;
  }
  targetTex[slot].needsUpdate = true;
}

function buildButtons(containerId, items, initial, onPick) {
  const box = document.getElementById(containerId);
  items.forEach((it) => {
    const b = document.createElement('button');
    b.textContent = it.name;
    b.dataset.id = it.id;
    if (it.cell) b.style.gridArea = it.cell[0] + ' / ' + it.cell[1];   // 九宮格定位
    if (it.id === initial) b.classList.add('on');
    b.onclick = () => {
      [...box.children].forEach((c) => c.classList.remove('on'));
      b.classList.add('on');
      onPick(it);
    };
    box.appendChild(b);
  });
}

/* 背景形態的按鈕和另外兩組不一樣：一顆管五種結構。

     沒選中    名字＋A       離散A     ← 字母是「點下去會拿到哪一種」的預告
     選下去    名字＋A       離散A
     再點      換成 B        離散B
     再點      往下換        離散C → 離散D → 離散E      再點回 A

   跳去別顆再回來一律從 A 開始，不記上次停在哪 —— 「第一次點就是 A」是
   可以預期的；記住的話同一顆按鈕點下去會有五種結果，使用者得先猜它現在
   記得什麼。

   標籤的字母是從 VARIANT_TAG 取的，不是寫死的 —— 每族要再加第六款時，
   只要 FIELDS 的 ids 多一個、這個字串多一個字母就好。 */
const VARIANT_TAG = 'ABCDE';
function buildFieldButtons() {
  const box = document.getElementById('fieldBtns');
  const tagged = (it, v) => it.name + '<i>' + VARIANT_TAG.charAt(v) + '</i>';
  /* 沒選中的六顆也要標 A。那個字母是**「點下去會拿到哪一種」的預告**，
     不是「現在是哪一種」—— 沒選中的點下去一律從 A 開始（見 onclick 的 v），
     所以就顯示 A。之前沒選中的一個字母都不標，六顆看起來像沒有變體，
     要點下去才知道有；而且點第一下拿到 A、字母才冒出來，會被讀成「點一下就跳 A」。 */
  const plain = (it) => tagged(it, 0);
  FIELDS.forEach((it) => {
    const b = document.createElement('button');
    b.innerHTML = plain(it);
    b.title = it.name + '：再點一次換下一種結構（A → B → C → D → E）';
    b.onclick = () => {
      // 已經選著就翻到下一版，沒選中就從 A 開始
      const v = b.classList.contains('on') ? (+b.dataset.v + 1) % it.ids.length : 0;
      /* 連 dataset.v 一起清。onclick 只在按鈕還選著的時候才讀它，所以留著髒值
         今天不會出事 —— 但那是「靠讀取條件擋住髒資料」，不是資料本身乾淨。
         哪天有人改成直接看 dataset.v 就會拿到上一輪的殘留值。 */
      [...box.children].forEach((c, i) => {
        c.classList.remove('on'); delete c.dataset.v; c.innerHTML = plain(FIELDS[i]);
      });
      b.classList.add('on');
      b.dataset.v = v;
      b.innerHTML = tagged(it, v);
      uniforms.uField.value = it.ids[v];
    };
    box.appendChild(b);
  });
  /* 開頁選中的是 uField 預設值那一顆的 A，不是第一顆 —— 按鈕順序調來調去的
     時候，預設的背景不該跟著換 */
  const start = FIELDS.findIndex((it) => it.ids[0] === uniforms.uField.value);
  box.children[start < 0 ? 0 : start].click();
}

/* 形狀切換的單一入口。面板按鈕和 section 的 data-shape 都走這裡，
   兩邊才不會各自改各自的而打架。

   烘焙型的形狀第一次選到要下載模型，所以這個函式是非同步的。
   在等的時候畫面維持舊形狀不動，載好才切 —— 中途硬切會閃一下空畫面。 */
let currentShape = 0, shapeMixAnim = null;
let currentSlot = 1;      // uTexTo 目前用哪一張；換形狀時翻面，才不會蓋掉來源
let wantShape = 0;        // 使用者要的形狀（可能還在載）

/* GLSL 那支 hash11 的 JS 版。**改 shader 的話這裡要一起改** ——
   用 fract 而不是 % 1：兩者對負數的結果不同（fract(-0.3)=0.7、-0.3%1=-0.3）。 */
const fract = (x) => x - Math.floor(x);
const hash11js = (p) => { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); };

/* ── 隨機圓的擲骰 ────────────────────────────────────────────

   「隨機圓」這個名字本身就是動作 —— 選它就等於擲骰子，所以不留參數滑桿。
   使用者要的是「再給我一顆」，不是「讓我調出一顆」。

   四個變數全部只動剪影，因為粒子雲沒有明暗、讀的就是輪廓：
     n      超橢圓次方 1.35～3.2   紡錘 ←→ 正圓 ←→ 桶狀
     h      垂直半徑   0.55～1.45  橫躺橢圓 ←→ 正圓 ←→ 直立橢圓
     skew   蛋形偏心   ±0.45       正立雞蛋 ←→ 倒立雞蛋
     waist  腰身      -0.35～0.30  葫蘆 ←→ 中段鼓起

   h 的範圍對 1 不對稱（往下能到 0.55、往上只到 1.45），這是實測逼出來的：
   體積守恆之後，拉長就一定會變窄，視線穿過去疊到的粒子變多，肩膀那一帶
   （高度 85% 上下）會死白。h ≥ 1.48 就開始出現，1.8 是 0.023%。
   壓扁沒有這個問題 —— 壓扁是往外攤開，反而更稀，所以下限可以放得更遠。

   純亂數會擲出三種廢牌，所以要**擲到合格為止**：
     1. 四個參數剛好都接近中間值 → 就是一顆圓球，等於白擲
     2. 腰收太深 → 中間快被掐斷，看起來像兩坨疊在一起，不是一個形狀
     3. 校正之後長得太出格 → 細長的紡錘會被放大到頂出畫面

   ── 尺寸校正校正的是「體積」，不是剪影面積 ──────────────

   每一擲都要重算 uEgNorm。**校正目標是體積**：同一塊黏土捏成不同形狀，
   份量不變 —— 這才是「同一顆球的變形」該有的樣子。壓扁就攤得比較寬、
   拉長就縮得比較細，兩者的份量一樣。

   曾經改成校正剪影面積，理由是「面積一樣、螢幕密度就一樣、過曝才穩」。
   數字上確實比較好管，但看起來不對：等面積的扁球和長球擺在一起，
   扁的那顆明顯比較「薄」，不像同一顆球捏出來的。

   換成體積之後密度就不再自動守恆了（等體積的話，球是剪影面積最小的那個，
   任何變形都會攤得更開、變得更稀），所以**亮度要補回來**：
   uEgGainNorm 的目標從「平均 1」改成「平均 = 剪影面積 ÷ π」。
   這樣單位螢幕面積送出的光量還是和圓球一樣，過曝不會因為擲到扁的就跳掉。
   這條和 insights.md 那句「總進光量的三個參數，任何一個改了亮度都要重調」
   是同一件事，只是這次改的是「形狀大小」。 */

// 掃 241 個高度，量出這條輪廓的特徵。要和 shader 的 eggRadius 同一條公式
function eggProfile(n, h, skew, waist) {
  const N = 241, mid = (N - 1) / 2;
  const rho = (u) => {
    let s = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(u), n)), 1 / n);
    s *= 1 + skew * u;
    s *= 1 + waist * Math.cos(u * Math.PI);
    return Math.max(s, 0);
  };
  let maxRho = 0, sumRho = 0, sumRho2 = 0, sumGain = 0, rho0 = 0;
  for (let k = 0; k < N; k++) {
    const u = -1 + (2 * k) / (N - 1);
    const s = rho(u);
    sumRho  += s;
    sumRho2 += s * s;
    sumGain += s * Math.min(1, s * 3.3333);     // 要和 shader 的 gEggGain 同一條式子
    if (k === mid) rho0 = s;
    if (s > maxRho) maxRho = s;
  }
  /* 兩個積分，梯形和的間距都是 2/(N-1)：
       體積     V = πH ∫ρ² du   → 圓球是 4π/3
       剪影面積 A = 2H ∫ρ  du   → 圓球是 π
     兩端的 ρ 恆為 0，所以普通求和剛好等於梯形法，不必另外扣端點。 */
  const vol  = (sumRho2 * 2) / (N - 1) * Math.PI * h;
  const area = (sumRho  * 4) / (N - 1) * h;
  const norm = Math.cbrt((4 * Math.PI / 3) / Math.max(vol, 1e-9));   // 體積回到圓球
  const areaN = area * norm * norm;              // 校正後的剪影面積，圓球是 π
  /* 密度補償的平均值要等於「剪影面積 ÷ π」，不是 1。
     推導：螢幕密度 = 粒子數 × 平均補償 ÷ 剪影面積，要它等於圓球的 N/π。
     「平均 1」是校正剪影面積那個時代的寫法，改成校正體積之後會偏暗。 */
  const meanGain = sumGain / N;
  return {
    norm,
    gainNorm: (areaN / Math.PI) / Math.max(meanGain, 1e-6),
    maxRho,                                     // 最寬那一圈的半徑，和 h 無關
    體積: vol * norm * norm * norm,              // 驗算用，應該恆等於 4π/3
    剪影面積: areaN,                              // 圓球是 π，變形之後只會更大
    長寬比: h / maxRho,                          // 1 = 正圓，大於 1 直立（norm 會約掉）
    中段比: rho0 / maxRho,                       // 1 = 沒腰身，越小腰越細
    外接: Math.max(h, maxRho) * norm,            // 校正後的最大半徑，圓球是 1
  };
}

/* ── 形狀在 unit 空間佔多大 ──────────────────────────────────
   給滑鼠的碰撞判定用（見 overShape）：滑鼠要碰到形狀才轉得動它，
   所以得知道形狀在畫面上佔哪一塊。

   量的是**旋轉半徑**，不是當下的剪影。形狀一直在自轉，用剪影的話判定區
   會跟著轉忽大忽小，同一個位置一下抓得到一下抓不到 —— 那比判定區大一點
   還難用。三個隨機形狀的尺寸每擲都不一樣，所以擲完順手記下來。 */
const FIXED_HIT = {
  0: [1.00, 1.00],    // 圓球
  5: [0.62, 1.00],    // 螺旋：半徑 0.55 ＋ 抖動 0.07
  6: [1.10, 1.10],    // 離散圓：球殼 1 ＋ 抖動 0.1
};
let rollHit = null;   // { id, x, y } —— 三個隨機形狀擲完填這裡

function shapeHit(id) {
  if (rollHit && rollHit.id === id) return { x: rollHit.x, y: rollHit.y };
  const f = FIXED_HIT[id];
  return f ? { x: f[0], y: f[1] } : { x: 1, y: 1 };
}

function rollEgg() {
  let last = null;
  for (let t = 0; t < 60; t++) {
    const n     = 1.35 + Math.random() * 1.85;
    const skew  = (Math.random() * 2 - 1) * 0.45;
    const waist = -0.35 + Math.random() * 0.65;

    /* 高度不是直接抽的，是**先抽長寬比再換算**。

       直接抽 h 的話直立和橫躺會嚴重不對稱：眼睛看的是長寬比（h ÷ 最寬半徑），
       而最寬半徑會被 skew 和 waist 推到 0.87～1.35 之間，把長寬比整個往下拖。
       實測直接抽 h 的結果是直立橢圓 79 次、橫躺橢圓 232 次，差三倍。
       改成先抽長寬比、再乘回最寬半徑，兩邊就對稱了。

       長寬比用對數抽，0.7 和 1/0.7 一樣容易出現 —— 線性抽的話「比 1 小」
       佔掉一半的數線但視覺上只是輕微壓扁。 */
    /* 高度上限用**夾的**不是用退回重擲的。退回的話最寬半徑大的那些形狀
       （有腰身、有偏心的）永遠擲不到高的一端，直立橢圓會被系統性地砍掉。
       夾住則是「頂到天花板就停在天花板」，該高的還是高。 */
    const maxRho = eggProfile(n, 1, skew, waist).maxRho;
    const h = Math.min(Math.exp((Math.random() * 2 - 1) * 0.42) * maxRho, 1.45);

    const p = eggProfile(n, h, skew, waist);
    last = { n, h, skew, waist, norm: p.norm, gainNorm: p.gainNorm, maxRho: p.maxRho };
    /* 「不是圓球」的判準直接看參數，不看幾何量 —— 幾何量互相汙染：
       有腰身的時候最寬的一圈本來就會離開赤道，量起來會誤判成蛋形。 */
    const 有個性 = Math.abs(Math.log(p.長寬比)) >= 0.22   // 橢圓
                || Math.abs(skew)  >= 0.20                // 蛋形
                || Math.abs(waist) >= 0.14                // 葫蘆／中段鼓起
                || Math.abs(n - 2) >= 0.55;               // 桶狀／紡錘
    if (有個性 && p.中段比 >= 0.58 && p.外接 <= 1.55) break;
  }
  uniforms.uEgN.value     = last.n;
  uniforms.uEgH.value     = last.h;
  uniforms.uEgSkew.value  = last.skew;
  uniforms.uEgWaist.value = last.waist;
  uniforms.uEgNorm.value     = last.norm;
  uniforms.uEgGainNorm.value = last.gainNorm;
  // 旋轉曲面：橫向就是最寬的那一圈，縱向就是高度，兩者都要乘正規化係數
  rollHit = { id: 8, x: last.maxRho * last.norm, y: last.h * last.norm };
}

/* ── 隨機螺旋的擲骰 ──────────────────────────────────────────

   和隨機圓同一套規矩：只隨機會改變剪影的東西、每一擲重算密度補償、
   擲到合格為止。但**上下對稱的限制先把可選的東西砍掉一半** ——
   半徑輪廓只能用對 k=0.5 對稱的基底（理由見 shader 的 shapeHelixR），
   所以舊版的「錐度」（上寬下窄）整個拿掉，換成三次諧波。

   隨機六個：
     交織方式  對旋（右旋＋左旋成對）／腰部反向（一條線在腰上翻旋向）
     線數      1～6。腰部反向才擲得出奇數，單螺旋只有那條路
     圈數      1.6～5.4，決定疏密與節奏
     半徑      0.32～0.70
     一次諧波  ±0.55 紡錘／沙漏   ← 改剪影最兇的
     三次諧波  ±0.34 花生／線軸

   四條判準，各擋掉一種廢牌：

     太細  輪廓束腰到接近 0，那一段所有線擠成一條，additive 疊起來死白
     出格  最寬處超過圓球的半徑，會頂出畫面
     太密  線數 × 圈數太多，纏成一顆實心毛球，讀不出結構；太少則接近直筒
     太像彈簧  兩個諧波都接近 0，擲十次都是同一條等徑螺旋（那就是固定螺旋）

   隨機圓有一道「剪影面積校正」，這裡沒有，因為曲線的密度不是那樣算的：
   面的密度是「粒子數 ÷ 剪影面積」，形狀一縮就暴增；線的密度是「每條的
   粒子數 ÷ 投影弧長」，而弧長被垂直方向撐住（每一格高度都要走完），
   半徑縮小並不會讓它變濃。所以尺寸只要「不出格」就好，不必校正。

   實測 400 擲的分布：1 條 13.5%、2 條 40%、3 條 20.8%、4 條 22.5%、6 條 3.3%；
   對旋 37%、腰部反向 63%。平均試 2.14 次過關。 */
function helixProfile(bulge, wave) {
  let lo = 9, hi = -9;
  for (let k = 0; k <= 1.0001; k += 0.02) {
    const p = 1 + bulge * Math.sin(k * Math.PI) + wave * Math.sin(k * 3 * Math.PI);
    lo = Math.min(lo, p); hi = Math.max(hi, p);
  }
  return { lo, hi };
}

/* ── 隨機離散的擲骰 ────────────────────────────────────────

   要擲出來的是「一眼看得出是幾角形」的東西：三角形、五角形、六角星……
   所以判準全部繞著「角要數得出來」轉，這和另外三個隨機形狀不一樣
   （那三個怕的是太圓、太細、太濃）。

   ── 多邊形和星形是同一族，只差一個數 ──

   inner 是內角頂點的半徑。等於 cos(π/N) 的時候，內角頂點正好落在兩個外角
   頂點的連線上 —— 那就是正 N 邊形；比它小就凹進去變成星。所以只要擲
   「要不要凹」和「凹多少」，兩種形狀就都出來了。

   ── 三條判準 ──

   ① 邊數多又不凹 = 圓。七、八邊形不加凹口的話，畫面上和離散圓分不出來，
      所以不凹的時候把邊數壓在六以內。
   ② 凹太深 = 一把針。inner 掉到 0.24 以下，角就細到只剩幾顆粒子寬，
      在點雲裡看起來是雜訊不是形狀。
   ③ 邊數少又收成雙錐 = 一顆菱形，角看不出來。三、四角的時候不收束。 */
function rollPoly() {
  let last = null;
  for (let t = 0; t < 60; t++) {
    const n     = 3 + Math.floor(Math.random() * 6);       // 3~8 個角
    const isStar = Math.random() < 0.55;
    const apo   = Math.cos(Math.PI / n);                   // 正多邊形的內半徑
    const inner = isStar ? apo * (0.34 + Math.random() * 0.42) : apo;
    const taper = Math.random() < 0.35 ? 0 : 0.25 + Math.random() * 1.00;
    // h 是**往深處的半厚度**，不是高度 —— 角形面向鏡頭，厚度是看不見的那一軸。
    // 給得比半徑小很多：太厚就變成一根對著觀眾的柱子，角形反而看不出來
    const h     = 0.16 + Math.random() * 0.29;
    const rad   = 0.82 + Math.random() * 0.18;
    last = { n, inner, taper, h, rad };

    const 角數得出來 = isStar || n <= 6;
    const 不是針     = !isStar || inner >= 0.24;
    const 不是菱形   = n >= 5 || taper <= 0.35;
    if (角數得出來 && 不是針 && 不是菱形) break;
  }
  uniforms.uPgN.value     = last.n;
  uniforms.uPgInner.value = last.inner;
  uniforms.uPgTaper.value = last.taper;
  uniforms.uPgH.value     = last.h;
  uniforms.uPgRad.value   = last.rad;
  // 角形在畫面平面上，所以橫向和縱向的最遠都是外接半徑＋抖動
  rollHit = { id: 17, x: last.rad + 0.08, y: last.rad + 0.08 };
}

function rollHelix() {
  let last = null;
  for (let t = 0; t < 60; t++) {
    const cross  = Math.random() < 0.5 ? 1 : 0;
    // 對旋是成對的，所以線數一定是偶數；腰部反向 1～4 條都行
    const lanes  = cross ? 2 * (1 + Math.floor(Math.random() * 3))
                         : 1 + Math.floor(Math.random() * 4);
    const turns  = 1.6 + Math.random() * 3.8;
    const rad    = 0.32 + Math.random() * 0.38;
    const bulge  = (Math.random() * 2 - 1) * 0.55;
    const wave   = (Math.random() * 2 - 1) * 0.34;
    const p = helixProfile(bulge, wave);
    /* 密度補償的正規化：線數少 = 每條分到的粒子多 = 那條線更濃，要更暗。
       0.30 這個斜率和 1.0 這個上限都是實測掃出來的，理由見 shader 的說明。 */
    last = { cross, lanes, turns, rad, bulge, wave, hi: p.hi,
             gainNorm: Math.min(1, 0.30 * lanes) };

    const 夠粗 = rad * p.lo >= 0.13;
    const 不出格 = rad * p.hi <= 0.86;
    const 密度剛好 = lanes * turns >= 3.2 && lanes * turns <= 14;
    const 輪廓夠有個性 = Math.abs(bulge) >= 0.18 || Math.abs(wave) >= 0.15;
    if (夠粗 && 不出格 && 密度剛好 && 輪廓夠有個性) break;
  }
  uniforms.uHxLanes.value    = last.lanes;
  uniforms.uHxCross.value    = last.cross;
  uniforms.uHxTurns.value    = last.turns;
  uniforms.uHxRad.value      = last.rad;
  uniforms.uHxBulge.value    = last.bulge;
  uniforms.uHxWave.value     = last.wave;
  uniforms.uHxGainNorm.value = last.gainNorm;
  // 橫向是最鼓的那一圈（半徑 × 輪廓上限）＋ 抖動；縱向固定是 ±1
  rollHit = { id: 9, x: last.rad * last.hi + 0.05, y: 1.05 };
}

/* ── 隨機離散的擲骰 ──────────────────────────────────────────

   判準和前兩個都不一樣。圓怕「不夠歪」、螺旋怕「太細太密」，一團霧怕的是：

     太濃  加色疊加下視線穿過整團，中心疊成一塊死白。這正是離散圓一開始
           就在防的東西（留空心核），隨機化絕對不能把它放回來
     太扁  輪廓壓過頭，縮成一條亮線，不再是一團
     太像  剪影還是一顆圓球，白擲一次

   「太像」看參數就知道，另外兩個沒有絕對標準可查 —— 多濃算濃，要看粒子數、
   點大小、尺度。所以**拿離散圓自己當基準尺**：同一支公式採樣、投影到螢幕、
   分格數點，再要求擲出來的這團落在基準的倍數區間內。門檻寫成比例而不是
   絕對值，粒子數滑桿一動也不用重調。

   要量兩種密度，缺一個就會漏掉一整類：

     整片的 24×24 格峰值   管「整團太濃」。格子夠大，統計穩
     **極區中軸**的峰值    管「尖端結了一顆亮點」。這是旋轉體特有的病 ——
                          同一條緯度上所有方位角的粒子都塌到中軸附近，
                          輪廓越尖塌得越狠

   第二項是這次重做時追出來的，過程值得留：

   1. 只有格子峰值時，「高瘦紡錘＋薄殼」（h≈1.5、n≈1.3、內半徑 0.67～0.8）
      在格子上只有 1.4～2.1 倍、完全合格，畫面上卻在**形狀頂端的中軸**燒出
      一小團死白（40×33 像素，過曝 0.036%～0.096%，標準是 0.02%）。
   2. **細化格子救不了。** 格子加到 44×44、採樣加到四倍，那一擲量到 1.58 倍，
      比一堆過曝 0% 的擲數還低 —— 病灶比格子小，數格子看不見它。
   3. 改量「整條中軸的峰值」抓得到病灶，但會**誤殺厚霧**：內半徑 0.10 的厚霧
      中軸 2.88 倍、配上亮核甚至 5.44 倍，實測都是 0% 過曝。那是霧的看家本領
      （中間濃、邊緣淡），不能當成病。
   4. 正解是**只看極區**（離中軸、且高度落在形狀上下 40% 的那一段）。厚霧的
      濃度在正中間，極區反而只有 0.67 / 0.37 倍；會燒的那兩擲是 3.11 / 3.67。
      實測八種代表性參數，0% 過曝的極區比全都 ≤ 1.00，會過曝的都 ≥ 3.11 ——
      門檻放 1.60 兩邊都還有一倍餘裕。

   形狀改成旋轉體之後，投影不必再掃好幾個自轉角（轉到哪一格都一樣），省下來
   的預算全拿去加採樣數 —— 中軸那一柱只收得到全部粒子的百分之幾，採樣太少
   會抖。 */

const CLOUD_SAMPLES = 12000;  // 估算採樣顆數：整組判準跑完約 2 毫秒，切形狀時感覺不到
const CLOUD_GRID = 24;        // 投影分格數，24×24 蓋住 ±1.2 的範圍
const CLOUD_AXIS_BINS = 64;   // 中軸柱的高度分段，蓋住 ±1.3
const CLOUD_AXIS_HALF = 0.05; // 中軸柱的半寬（形狀單位）。抖動是 ±0.1，比它還寬，
                              // 所以量到的就是渲染時真正疊在中軸上的那些
const CLOUD_POLAR = 0.60;     // 極區的界線：高度超過「自身最高點」這個比例才算
// 基準 = 離散圓本人（內半徑 0.5、均勻分布、正圓輪廓）
const CLOUD_BASE = { rin: 0.5, bias: 1, n: 2, h: 1, skew: 0, waist: 0, norm: 1 };

// 旋轉輪廓的水平半徑。要和 shader 的 cloudRadius 同一條公式
function cloudRho(p, u) {
  let s = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(u), p.n)), 1 / p.n);
  s *= 1 + p.skew * u;
  s *= 1 + p.waist * Math.cos(u * Math.PI);
  return Math.max(s, 0);
}

/* 掃 241 個高度量這條輪廓：剪影面積要拿來校正，長寬比和中段比要當判準，
   外接尺寸要拿來防裁切。

   校正的目標是**剪影面積**（不是外接半徑）：所有粒子都投影在剪影裡面，
   平均螢幕密度就是粒子數 ÷ 剪影面積。面積和圓球一樣，密度就一樣。

   防裁切的 fit 有閉式解，不必再抽樣去量：徑向縮放最大是 1、|u| 最大是 1，
   所以最高就是 h·norm、最寬就是 maxRho·norm，各再加一份抖動 0.1。
   畫面是橫的：實測把單位形狀的六個端點投影到 NDC，垂直方向 1.0 個單位就吃掉
   0.66（往下更兇），水平只吃 0.38 —— 所以上下的額度給 1.10（離散圓自己就是
   1.1）、左右給 1.90。只在超出時縮小、絕不放大，離散圓那個基準不受影響。 */
function cloudProfile(p) {
  const N = 241, mid = (N - 1) / 2;
  let maxRho = 0, area = 0, rho0 = 0;
  for (let k = 0; k < N; k++) {
    const u = -1 + (2 * k) / (N - 1);
    const s = cloudRho(p, u);
    area += s;
    if (k === mid) rho0 = s;
    if (s > maxRho) maxRho = s;
  }
  /* 剪影面積 = 2H ∫ρ du。梯形和的間距是 2/(N-1)，所以是 sum × 2/(N-1) × 2h。
     少乘那個 2 的話 norm 會整個大 √2 倍，每一顆都被放大四成 —— 隨機圓踩過一次 */
  area = (area * 4) / (N - 1) * p.h;            // 圓球剛好是 π
  const norm = Math.sqrt(Math.PI / Math.max(area, 1e-6));
  return {
    norm, maxRho,
    長寬比: p.h / Math.max(maxRho, 1e-6),        // 1 = 正圓，大於 1 直立（norm 會約掉）
    中段比: rho0 / Math.max(maxRho, 1e-6),       // 1 = 沒腰身，越小腰越細
    fit: Math.max(1, (p.h * norm + 0.1) / 1.10, (maxRho * norm + 0.1) / 1.90),
  };
}

/* shapeCloudR 的 JS 版。**改 shader 的話這裡要一起改。**
   hash 精度不完全相同（GLSL 是 float32），但這裡要的是統計上的密度，不是逐顆對齊。 */
function cloudPoint(p, i, count) {
