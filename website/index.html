  const y = 1 - (i / count) * 2, rr = Math.sqrt(Math.max(0, 1 - y * y)), t = GOLDEN_JS * i;
  // 方位角：把 xz 正規化。極點的 rr 是 0，夾一個下限（同 shader）
  const inv = 1 / Math.max(rr, 1e-4);
  const ax = Math.cos(t) * rr * inv, az = Math.sin(t) * rr * inv;

  const rho = cloudRho(p, y);
  const r = (p.rin + (1 - p.rin) * Math.pow(hash11js(i), p.bias)) * p.norm;
  return [ax * rho * r + (hash11js(i + 3.1) * 2 - 1) * 0.1,
          y * p.h  * r + (hash11js(i + 7.7) * 2 - 1) * 0.1,
          az * rho * r + (hash11js(i + 11.3) * 2 - 1) * 0.1];
}

const cloudGrid = new Int32Array(CLOUD_GRID * CLOUD_GRID);
const cloudCol  = new Int32Array(CLOUD_AXIS_BINS);

/* 一趟採樣同時量三件事（形狀是旋轉體，只要投影一個角度就夠）：

     peak  整片的格子峰值。取「有粒子的格子」的 98 百分位，不取最大值 ——
           單一格的雜訊不該左右判斷
     area  有粒子的格數，防「縮成一條亮線」
     polar 極區中軸的峰值。極區界線用**形狀自己的最高點**去算，不用固定值：
           扁的和長的都要各自量自己的尖端，用絕對高度的話扁形整個沒有極區 */
function cloudMetrics(p, count) {
  const step = Math.max(1, Math.floor(count / CLOUD_SAMPLES));
  cloudGrid.fill(0);
  cloudCol.fill(0);
  let top = 0;
  for (let i = 0; i < count; i += step) {
    const q = cloudPoint(p, i, count);
    if (Math.abs(q[1]) > top) top = Math.abs(q[1]);
    const gx = Math.floor((q[0] + 1.2) / 2.4 * CLOUD_GRID);
    const gy = Math.floor((q[1] + 1.2) / 2.4 * CLOUD_GRID);
    if (gx >= 0 && gy >= 0 && gx < CLOUD_GRID && gy < CLOUD_GRID) cloudGrid[gy * CLOUD_GRID + gx]++;
    if (Math.abs(q[0]) <= CLOUD_AXIS_HALF) {
      const b = Math.floor((q[1] + 1.3) / 2.6 * CLOUD_AXIS_BINS);
      if (b >= 0 && b < CLOUD_AXIS_BINS) cloudCol[b]++;
    }
  }
  const occ = [];
  for (let k = 0; k < cloudGrid.length; k++) if (cloudGrid[k] > 0) occ.push(cloudGrid[k]);
  if (!occ.length) return { peak: Infinity, area: 0, polar: Infinity };
  occ.sort((a, b) => a - b);
  let polar = 0;
  for (let b = 0; b < CLOUD_AXIS_BINS; b++) {
    const y = -1.3 + ((b + 0.5) / CLOUD_AXIS_BINS) * 2.6;
    if (Math.abs(y) > CLOUD_POLAR * top && cloudCol[b] > polar) polar = cloudCol[b];
  }
  return { peak: occ[Math.floor((occ.length - 1) * 0.98)], area: occ.length, polar };
}

// 基準值算一次就記著；粒子數滑桿動了才重算
let cloudBase = null;
function cloudBaseline(count) {
  if (!cloudBase || cloudBase.count !== count) {
    cloudBase = Object.assign({ count }, cloudMetrics(CLOUD_BASE, count));
  }
  return cloudBase;
}

function rollCloud() {
  const count = Math.max(1, Math.round(uniforms.uCount.value));
  const base = cloudBaseline(count);
  let last = null, safest = null, tries = 0;
  for (let t = 0; t < 40; t++) {
    tries = t + 1;
    /* 剪影四個（旋轉輪廓）。範圍比隨機圓收一點：霧沒有銳利的邊，輪廓推到
       極端也看不出差別，只會害防裁切的 fit 一直把整團縮小。

       次方要在**對數空間**取。判準是 |n-2| >= 0.55，均勻取 1.40～3.15 的話，
       紡錘那側只剩 [1.40, 1.45] 一條縫、桶狀那側卻有 [2.55, 3.15] ——
       實測三百擲裡紡錘只佔 2.8%，等於這種情境擲不太出來。
       改成對數之後量到紡錘 19.4%、桶狀 26.4%。 */
    const n     = Math.exp(Math.log(2) + (Math.random() * 2 - 1) * 0.48);   // 1.24～3.23
    const h     = 0.60 + Math.random() * 1.00;             // 0.60～1.60 扁←→長
    const skew  = (Math.random() * 2 - 1) * 0.40;          // ±0.40 蛋形
    const waist = -0.32 + Math.random() * 0.60;            // -0.32～0.28 葫蘆←→中段鼓
    // 密度分布兩個（霧自己的）
    const rin   = 0.10 + Math.random() * 0.70;             // 空心核 0.10～0.80
    const bias  = Math.exp(-1.05 + Math.random() * 2.01);  // 0.35～2.6，取對數均勻才對稱

    const p = { rin, bias, n, h, skew, waist, norm: 1 };
    const prof = cloudProfile(p);
    // 超出畫面就整團等比縮回來（只縮不放）。**先縮再量密度**，量到的才是真的
    p.norm = prof.norm / prof.fit;
    p.maxRho = prof.maxRho;       // 留給滑鼠碰撞判定，見 shapeHit
    last = p;

    /* 個性判準分兩組。判準看參數不看幾何量 —— 有腰身的時候最寬的一圈本來就會
       離開赤道，用幾何量會誤判成蛋形。長寬比例外，它就是參數的直接組合。 */
    const 剪影 = [
      Math.abs(Math.log(prof.長寬比)) >= 0.22,   // 直立／橫躺
      Math.abs(n - 2) >= 0.55,                   // 桶狀／紡錘
      Math.abs(skew)  >= 0.20,                   // 蛋形
      Math.abs(waist) >= 0.14,                   // 葫蘆／中段鼓起
    ].filter(Boolean).length;
    const 霧感 = [
      rin >= 0.62 || rin <= 0.22,                // 薄殼／厚霧
      bias <= 0.60 || bias >= 1.90,              // 亮外圈／亮核心
    ].filter(Boolean).length;
    /* 剪影至少一項、總共至少兩項。要求剪影一定要有，是因為霧感那兩項只改
       濃淡不改外形 —— 光靠它們擲十次，剪影十次都是同一顆球。 */
    if (剪影 < 1 || 剪影 + 霧感 < 2) continue;
    // 腰收太深會被看成兩坨疊在一起，不是一個形狀
    if (prof.中段比 < 0.58) continue;

    /* 兩道密度門檻，都是拿離散圓當 1.0：

       整片 2.5 倍。這個數字是把估算的峰值和**真實過曝**對照著量出來的
       （1280×800、dpr 2、60000 顆、預設點大小與亮度）：

         峰值 / 基準   最亮像素   過曝比例
             1.0         163        0%      ← 離散圓本人
             2.5         222        0%      ← 門檻設在這，還有 1.5 倍餘裕
             3.7         255      0.004%    ← 開始死白
             5.0         255      0.075%    ← 內半徑 0.1 配偏壓 2.6，
                                              正是「直接在球體積裡灑」那個坑
       設 1.5 倍太保守（最亮只到 190，白白放棄一半的變化）；3 倍以上踩進死白區。

       極區 1.60 倍。這道是旋轉體才需要的，門檻同樣對照實測過曝挑
       （1280×720、dpr 1，比上面那組嚴苛，像素少一半以上）：

         極區 / 基準   過曝比例   那是什麼
             0.37        0%       厚霧配亮核
             0.67        0%       內半徑 0.10 的厚霧
             0.70～0.85  0%       扁桶薄殼、一般擲出來的兩擲
             1.00        0%       離散圓本人
                                  ← 門檻 1.60 卡在中間，兩邊各留一倍餘裕
             3.11      0.096%     高瘦紡錘配內半徑 0.80
             3.67      0.039%     高瘦紡錘配亮核、又有腰身

       面積門檻是備援。剪影面積已經被 norm 校正回 π，正常不會觸發 ——
       留著是防組合出「縮成一條亮線」的極端解。 */
    const q = cloudMetrics(p, count);
    if (q.peak <= base.peak * 2.5 && q.polar <= base.polar * 1.60 && q.area >= base.area * 0.55) {
      safest = p; break;
    }
    /* 沒過就記著目前「最不濃」的那個，四十次全軍覆沒時至少不會端出一團死白。
       兩種濃度取相對基準之後的較大者，才不會被單一項騙過去。 */
    const 濃度 = Math.max(q.peak / base.peak, q.polar / base.polar);
    if (!safest || 濃度 < safest.濃度) { p.濃度 = 濃度; safest = p; }
  }
  const pick = safest || last;
  uniforms.uClN.value     = pick.n;
  uniforms.uClH.value     = pick.h;
  uniforms.uClSkew.value  = pick.skew;
  uniforms.uClWaist.value = pick.waist;
  uniforms.uClIn.value    = pick.rin;
  uniforms.uClBias.value  = pick.bias;
  uniforms.uClNorm.value  = pick.norm;
  // 旋轉曲面 ＋ 0.1 的抖動。半徑那一項用最外圈（粒子的 r 最大就是 1）
  rollHit = { id: 16, x: pick.maxRho * pick.norm + 0.1, y: pick.h * pick.norm + 0.1 };
  return tries;
}

function markShapeUI(id, loading) {
  const item = SHAPES.find((s) => s.id === id);
  if (item && !loading) {
    // 形狀名稱可能出現在多個 section 的標題裡，全部一起更新
    document.querySelectorAll('.shape-name').forEach((e) => { e.textContent = item.name; });
  }
  document.body.classList.toggle('shape7', id === 7);          // 超級形狀的參數
  document.body.classList.toggle('shapeText', id === 200);     // 文字輸入框、字形
  document.body.classList.toggle('shapePinned', isPinned(id)); // 揮散那兩根、藏掉打散和自轉
  [...document.getElementById('shapeBtns').children].forEach((b) => {
    b.classList.toggle('on', +b.dataset.id === id);
  });
  bakeMsg.textContent = loading ? '載入模型中…' : '';
}

async function setShape(id, force) {
  if (!force && (id === wantShape)) return;
  wantShape = id;
  const def = SHAPES.find((s) => s.id === id);
  const baked = !!(def && def.src);
  markShapeUI(id, baked && !bakeCache.has(id));

  let arr = null;
  if (baked) {
    try { arr = await loadBake(def); }
    catch (e) { bakeMsg.textContent = '模型載入失敗'; console.error(e); return; }
    if (wantShape !== id) return;       // 還在載的時候使用者又換走了
  }
  if (id === currentShape && !force) { markShapeUI(id, false); return; }

  /* 每次「進入」隨機形狀都重擲。放在守衛之後，所以捲動時每格重讀
     data-shape 不會一直重擲 —— 只有真正切換（或按鈕強制）才會。 */
  if (id === 8) rollEgg();
  if (id === 9) rollHelix();
  if (id === 16) rollCloud();
  if (id === 17) rollPoly();

  uniforms.uShapeFrom.value = currentShape;
  uniforms.uFromBaked.value = uniforms.uToBaked.value;
  uniforms.uTexFrom.value = uniforms.uTexTo.value;

  if (baked) {
    currentSlot = 1 - currentSlot;
    bakeInto(currentSlot, arr);
    uniforms.uTexTo.value = targetTex[currentSlot];
  }
  uniforms.uToBaked.value = baked ? 1 : 0;
  uniforms.uShapeTo.value = id;
  uniforms.uShapeMix.value = 0;
  currentShape = id;
  // 滑鼠碰撞判定要知道這個形狀有多大。烘焙的直接量點雲，程序的查 shapeHit
  hitR = arr ? measureHit(arr) : shapeHit(id);
  shapeMixAnim = performance.now();
  markShapeUI(id, false);
}

buildButtons('shapeBtns', SHAPES, 0, (it) => {
  /* 隨機形狀要 force：setShape 有「已經是這個形狀就不做事」的守衛，
     不強制的話重複點它不會有反應 —— 但重複點正是「再擲一個」的操作。 */
  setShape(it.id, it.id === 8 || it.id === 9 || it.id === 16 || it.id === 17);
  // 把選擇寫回目前這個 section，否則下一次捲動會依 data-shape 把它改回去
  if (activeSection) activeSection.dataset.shape = it.id;
});
/* ── 長度上限：算「格」不算「字」 ────────────────────────────
   全形一個字兩格、半形一格，總共 20 格 —— 英文 20 個字母、中文 10 個字。

   用字元數當上限對不齊，因為一個字佔的寬度差很多（220px 的字體實測）：
     中文任何字 220px、英文大寫平均 149px、W 206px、小寫 i 只有 71px
   同樣打 16 個字，中文排出來 3520px、英文才 2400px。而限制的目的是
   「排出來不要細到讀不出來」—— 粒子雲的寬度永遠正規化成一樣，字越長
   只會越扁：TEAMMAX 是 6.6:1，16 個大寫字母就變成 14:1、高度砍半。
   所以該用寬度算，不是字數。

   HTML 的 maxlength 只會數字元，表達不了這條規則，所以留 20 當硬上限
   （全部半形時剛好等值），真正的規則在下面這段。 */
const TEXT_CELLS = 20;
// 東亞的全形區段（中日韓、假名、諺文、全形標點）
const WIDE_RANGE = /[ᄀ-ᅟ⺀-꓏ꥠ-꥿가-힣豈-﫿︐-︙︰-﹯＀-｠￠-￦]/;
const cellsOf = (ch) => {
  const cp = ch.codePointAt(0);
  if (cp >= 0x1F000) return 2;          // 表情符號、擴充區漢字，都是全形
  return WIDE_RANGE.test(ch) ? 2 : 1;
};
// 用展開運算子逐「字碼」跑，不是逐 UTF-16 單位 —— 否則表情符號會被切成兩半
const textCells = (s) => [...s].reduce((n, ch) => n + cellsOf(ch), 0);
const fitCells = (s) => {
  let n = 0, out = '';
  for (const ch of s) {
    const w = cellsOf(ch);
    if (n + w > TEXT_CELLS) break;
    n += w; out += ch;
  }
  return out;
};
const textLeft = document.getElementById('vTextLeft');
const showLeft = () => {
  textLeft.textContent = '剩 ' + (TEXT_CELLS - textCells(textInput.value)) + ' 格';
};

// 內容、字形、字重任一個變了都要整個重烘 —— 點雲是從畫好的字掃出來的
const rebakeText = () => {
  bakeGen++;                       // 還在跑的那一份作廢，不准寫回快取
  bakeCache.delete(200); bakeBusy.delete(200);
  if (currentShape === 200) setShape(200, true);
};
// 下拉是一次選定，不像打字會連發，所以不用延遲
fontSel.addEventListener('change', rebakeText);
weightSel.addEventListener('change', rebakeText);

// 文字改了就重烘。延遲 300 毫秒，不然每敲一個鍵就重算九萬個點
let textTimer = null;
textInput.addEventListener('input', () => {
  const cut = fitCells(textInput.value);
  if (cut !== textInput.value) {
    /* 截掉的是尾巴，游標不能跟著跳到最後 —— 在中間插字插到滿的時候，
       游標要留在剛打的那個字後面，不然接著打會全部跑到句尾 */
    const at = textInput.selectionStart;
    textInput.value = cut;
    const p = Math.min(at, cut.length);
    textInput.setSelectionRange(p, p);
  }
  showLeft();
  clearTimeout(textTimer);
  textTimer = setTimeout(rebakeText, 300);
});

showLeft();   // 開頁先顯示一次剩幾格

buildButtons('dirBtns', DIRECTIONS, 1, (it) => { uniforms.uDirection.value = it.id; });
buildFieldButtons();

function bindSlider(id, valId, uniformName, decimals = 2, onChange) {
  const s = document.getElementById(id), v = document.getElementById(valId);
  const sync = () => {
    const n = parseFloat(s.value);
    if (uniformName) uniforms[uniformName].value = n;
    v.textContent = decimals === 0 ? n : n.toFixed(decimals);
    if (onChange) onChange(n);
  };
  s.addEventListener('input', sync);
  sync();
}

// 點大小基準跟著視窗高度走（原站做法：視窗高 / 1200 × 4），
// 這樣不同螢幕上粒子的視覺粗細才一致
const dotBase = () => window.innerHeight / 1200 * 4;

/* 窄畫面再把點縮一級。粒子數已經跟著形狀面積降了（見 countFit），但**點的大小
   完全沒跟著走** —— gl_PointSize 只看視窗高度，所以形狀縮小之後每顆點佔形狀的
   比例反而變大，球看起來就比桌機厚實。實測 400×900 的球心亮度比桌機高 17%。

   起點取 720：那是版面本來就有的斷點（導覽列收起、面板變抽屜的同一條線），
   不另外發明一個數字。終點取 400，是「太密」最明顯的那個寬度。

   **用寬度不用高度。** 高度在手機上會被軟鍵盤和網址列改（見 viewFit 那段的
   同一個教訓）；寬度只有真的轉向才會變。

   兩支「粒子大小」滑桿共用這個係數 —— 波浪和形狀是同一批粒子，只有大小基準
   不同，縮放的理由對兩者都成立。滑桿顯示的還是使用者設定的值，係數只在幕後乘。

   地板不能再低。實測 0.6 時 400×900 算出來是 1.08 裝置像素，球心填滿率崩到 26.9%
   —— 點面積只剩 0.36 倍該落在 35%，少的那一截是 1 像素以下的點直接消失。
   0.7 算出來是 1.26 像素，還在點畫得出來的範圍內。 */
const DOT_FIT_FROM = 720, DOT_FIT_TO = 400, DOT_FIT_MIN = 0.7;
const dotFit = () => {
  const w = window.innerWidth;
  if (w >= DOT_FIT_FROM) return 1;
  if (w <= DOT_FIT_TO) return DOT_FIT_MIN;
  const t = (w - DOT_FIT_TO) / (DOT_FIT_FROM - DOT_FIT_TO);
  return DOT_FIT_MIN + (1 - DOT_FIT_MIN) * t;
};

const applyDotSizes = () => {
  const k = dotBase() * dotFit() * 2;
  uniforms.uDotWave.value  = k * parseFloat(document.getElementById('sDotWave').value);
  uniforms.uDotShape.value = k * parseFloat(document.getElementById('sDotShape').value);
};

bindSlider('sDotWave', 'vDotWave', null, 2, applyDotSizes);
/* 曝光補償：additive 疊加下，粒子每多一顆就多送一份光進來。
   不補償的話「調密度」的手感會變成「調亮度」—— 拉高密度只會整片洗白，
   看不到原本想要的「網格變細」。

   波浪亮度不做成滑桿，而是固定基準值再乘上密度補償，所以拉密度時
   整體明暗維持一致，變的只有網格粗細。要整體調亮調暗就改 WAVE_ALPHA。

   用平方根而非線性：粒子稀疏時彼此不重疊，不需要按比例補足那麼多。 */
const WAVE_ALPHA = 1.0;
/* 形狀態相對波浪態的亮度比例。收攏成形狀後密度暴增，一定要壓低才不會糊成白團。
   綁成比例而不是獨立數值，密度補償才會一起套用到形狀上。

   0.55 → 0.49：形狀態不再乘 aAlpha（那是波浪的遠端淡出，會把粒子壓進 discard
   門檻，見 shader 的 facing 那段）。少了那層平均 0.66 的折扣，整體會亮四成，
   五官會被過曝洗平，所以係數要按比例補回來。

   0.49 → 0.36：背面淡化的曲線改回最初版本（下限 0.08、範圍 −1～0.7），
   平均亮度從 0.45 升到 0.609，所以係數要按同一個比例往下壓，
   總增益才維持不變 —— 這次改的是「背面看不看得見」，不是要把整體調亮。 */
const SHAPE_ALPHA_RATIO = 0.36;
/* 亮度補償要**分成兩份**，因為 RWD 縮小之後波浪和形狀的遭遇完全不同：

     波浪：視窗變窄時粒子數照 viewFit² 降，但畫面上看得到的那一片**真的變稀疏**了
           （實測視窗 1000→400，亮點覆蓋率 49.4% → 36.9%）。要補。
     形狀：形狀自己也跟著縮，所以**每單位面積的顆數是固定的**
           （實測每千像素 228.7 / 233.3 / 238.3 顆，全程幾乎沒動）。不該補。

   一起補的後果實測過：視窗 1000→400 時球心平均亮度 26.7 → 33.1 → 49.6，
   填滿率 97.5% → 100%，整顆球糊成一塊 —— 顆數沒變多，是每顆被調亮了 1.83 倍
   （densityComp = √(60000/17989) = 1.826，和亮度比 49.6/26.7 = 1.86 對得上）。

   所以形狀那一份只吃**滑桿**造成的變化：使用者把密度拉低，球本來就該補亮；
   螢幕變窄不算，那不是使用者的意圖，而且球的密度根本沒變。 */
let densityComp = 1;   // 波浪用：吃實際粒子數
let shapeComp   = 1;   // 形狀用：只吃滑桿值
// 內文進場時整個粒子系統退到背景，讓文字站到前面。
// 這是「亮度」這條鏈上的第三個乘數，一樣走 applyWaveAlpha 統一套用
let contentDim = 1;
const applyWaveAlpha = () => {
  const base = WAVE_ALPHA * contentDim;
  uniforms.uWaveAlpha.value  = base * densityComp;
  uniforms.uShapeAlpha.value = base * shapeComp * SHAPE_ALPHA_RATIO;
};

/* 打散幅度要跟「點與點的距離」成比例，而點距 ∝ 1/√粒子數。
   寫死一個值的話，密度低時完全打不散、密度高時又會散成一團霧 ——
   和曝光補償同一個道理：跟著密度走的東西就要跟著密度算。
   係數 2.5 讓滑桿 1.0 大約等於「推開半個點距」。 */
const applyScatter = () => {
  const k = parseFloat(document.getElementById('sScatter').value);
  uniforms.uScatter.value = k * 2.5 / Math.sqrt(effCount());
};

/* viewFit 的宣告要在這裡，不能跟著「形狀大小」那一段放在下面 ——
   粒子密度的 bindSlider 在這一行之後馬上就會跡一次，而它要用 viewFit。
   const 有暫時死區，放在下面會在開頁的第一行就丟 ReferenceError。
   完整的理由和「高度基準要凍結」寫在 applyScaleFit 那邊。 */
/* 增益 1.232 = 「直向時形狀要佔畫面寬度的幾成」÷「桌機上它佔畫面高度的幾成」。

   純粹的 min(1, 寬/高) 會把桌機的比例一比一搬到另一根軸上 —— 桌機的球佔
   畫面**高度** 60.9%，直向手機就變成佔**寬度** 60.9%，兩邊看起來一樣大，
   但直向畫面左右各空一大截。0.75 / 0.609 = 1.232 把它拉到佔寬度 75%。

   這個增益**不隨螢幕變**，所以每一款直向手機都剛好是 75%，不會像次方曲線
   那樣在不同長寬比之間漂（實測 0.73 次方在 71%~79% 之間跑）。
   min(1, ...) 的封頂在長寬比 0.812：再寬就會比桌機還大，那沒有道理。

   60.9% 不是憑感覺，是量出來的：形狀大小 20 × 每世界單位 12.848 px × 2
   ÷ 視窗高。它只跟 fov、SHAPE_OFFSET.z 和滑桿預設值有關，改那三個要重量。 */
const PORTRAIT_GAIN = 1.232;
let fitW = window.innerWidth, fitH = window.innerHeight;
const viewFit = () => Math.min(1, PORTRAIT_GAIN * fitW / fitH);
const remeasureFit = () => {
  if (matchMedia('(pointer: coarse)').matches && window.innerWidth === fitW) return;
  fitW = window.innerWidth; fitH = window.innerHeight;
};

/* 直向螢幕把形狀縮小之後（見 viewFit），粒子數要跟著降，否則同樣多的粒子
   擠在更小的面積上 —— 實測 390×844 的球整顆糊成一塊實心，顆粒感全沒了。

   **要乘平方，不是乘 viewFit 本身。** 密度是「幾顆 ÷ 面積」，而面積和線性
   尺度是平方關係：球縮到 0.462 倍，投影面積只剩 0.213 倍。只乘 0.462 的話
   密度還是變成 2.2 倍。

   下限 2000 是防極端視窗（例如 300×2000 會算出很小的值，只剩幾百顆）。

   **次方就是 2，不要自作聰明調。** 試過 1.7 和 1.8（想把手機上的密度拉回來一點），
   最後回到 2 —— 2 是唯一有物理意義的值（密度不隨螢幕變），其他都是手調的偏差。
   覺得手機上偏稀或偏密，先看 `dotFit()` 和亮度補償那兩邊，那裡的數字才有實量依據。 */
const COUNT_FIT_POW = 2;
const countFit = () => Math.pow(viewFit(), COUNT_FIT_POW);
const effCount = () =>
  Math.max(2000, Math.round(parseFloat(document.getElementById('sCount').value) * countFit()));

/* 滑桿存的是使用者的意圖（顯示 60000），實際畫幾顆才吃螢幕比例 ——
   和形狀大小、點大小同一個規矩。但**頁面上那兩個數字要顯示實際值**：
   它們和「draw call 1」「fps」擺在一起，那一排是量出來的事實不是設定值。 */
let lastEff = -1;
/* 文字形狀的密度折扣：超過 TEXT_FULL 的部分只算一半。
     60,000 → 60,000（不折）
     90,000 → 75,000（實際亮著的）
    150,000 → 105,000
   回傳的是「留下幾成」，shader 拿它當門檻（見 gTextKeep）。

   為什麼要折：字是靠輪廓讀的，粒子一多就互相疊住，筆畫糊成一片色塊 ——
   密度對背景形態是質感、對文字是雜訊。門檻訂在六萬是因為那是原站的
   基準值（START_COUNT），文字在那個密度下還讀得清楚。

   **背景形態完全不受影響**，它吃的是完整的 n。 */
const TEXT_FULL = 60000;
const TEXT_EXCESS_KEEP = 0.5;
const textKeep = (n) =>
  n <= TEXT_FULL ? 1 : (TEXT_FULL + (n - TEXT_FULL) * TEXT_EXCESS_KEEP) / n;

const applyCount = () => {
  const n = effCount();
  // resize 會連發，值沒變就不要重建網格和配對
  if (n === lastEff) return;
  lastEff = n;
  uniforms.uCount.value = n;
  buildGrid(n);   // 網格結構會變，必須重建（6 萬點只要幾毫秒）
  // 配對只認「波浪要收斂成的那個形狀」= 第一個形狀 section 宣告的那個
  buildPairing(n, +(document.querySelector('[data-shape]')?.dataset.shape ?? 0));
  uniforms.uTextKeep.value = textKeep(n);
  const comp = (k) => Math.min(2, Math.max(0.6, Math.sqrt(START_COUNT / k)));
  densityComp = comp(n);                                            // 波浪：實際畫幾顆
  shapeComp   = comp(parseFloat(document.getElementById('sCount').value));   // 形狀：滑桿值
  applyWaveAlpha();
  applyScatter();   // 點距變了，打散幅度要跟著換算
  // 烘焙形狀的槽位排序是按「目前粒子數」算的，密度變了就要重排一次
  if (uniforms.uToBaked.value && bakeCache.has(currentShape)) {
    bakeInto(currentSlot, bakeCache.get(currentShape));
  }
  const txt = n.toLocaleString('en-US');
  const statCount = document.getElementById('statCount');
  if (statCount) statCount.textContent = txt;
  document.querySelectorAll('.count-name').forEach((e) => { e.textContent = txt; });
};
bindSlider('sCount', 'vCount', null, 0, applyCount);

/* 兩根「粒子密度」是同一個值的兩個入口（背景形態一根、收斂形狀一根）——
   全場只有一組粒子，波浪和形狀共用，本來就不可能是兩個獨立的數。

   同步的方式是**把值推給原本那根、再發一次 input 事件**，不是各自做一遍。
   重建網格、重算配對、密度補償、烘焙重排那一整串只有一份實作，不會有
   兩套邏輯日後慢慢走鐘。推回來的方向只更新顯示，不再發事件，所以不會繞圈。 */
const countMain = document.getElementById('sCount');
const countAlt  = document.getElementById('sCountShape');
const countAltLabel = document.getElementById('vCountShape');

countAlt.addEventListener('input', () => {
  countMain.value = countAlt.value;
  countMain.dispatchEvent(new Event('input', { bubbles: true }));
});
countMain.addEventListener('input', () => {
  countAlt.value = countMain.value;
  countAltLabel.textContent = countMain.value;
});
countAltLabel.textContent = countMain.value;   // 開頁先對齊一次
countAlt.value = countMain.value;
bindSlider('sWaveH', 'vWaveH', 'uWaveHeight', 1);
bindSlider('sWaveS', 'vWaveS', 'uWaveSpeed', 1);
bindSlider('sSpread', 'vSpread', 'uSpread', 2);

// 對焦距離：滑桿是 0～100 的百分比，0 = 波浪帶最近端、100 = 最遠端
bindSlider('sFocus', 'vFocus', null, 0, (pct) => {
  uniforms.uFocus.value = DEPTH.near + (pct / 100) * (DEPTH.far - DEPTH.near);
  const name = pct < 15 ? '最近端' : pct < 40 ? '前段' : pct < 62 ? '中段'
             : pct < 86 ? '後段' : '最遠端';
  document.getElementById('vFocus').textContent = pct + ' · ' + name;
});

// 景深 0～100：一根拉桿同時驅動模糊強度與合焦範圍 ——
// 這兩個分開拉幾乎調不出好看的組合，綁在一起才好用。
const RANGE_MIN = 4;   // 最淺的合焦範圍：只剩一薄片清楚
bindSlider('sDof', 'vDof', null, 0, (pct) => {
  const t = pct / 100;
  const span = DEPTH.far - DEPTH.near;   // 合焦範圍的上限＝涵蓋整個波浪帶

  // 範圍走幾何級數而非線性遞減。線性的話前半段全都還涵蓋整個場景，
  // 拉起來會覺得「前 50 格沒感覺」
  uniforms.uFocusRange.value = span * Math.pow(RANGE_MIN / span, t);
  uniforms.uBlur.value = Math.pow(t, 0.6);   // 開頭升得快，尾端趨緩

  const name = pct === 0 ? '清晰' : pct <= 20 ? '微景深' : pct <= 45 ? '淺景深'
             : pct <= 70 ? '中景深' : pct <= 90 ? '深景深' : '夢幻';
  document.getElementById('vDof').textContent = pct + ' · ' + name;
});

bindSlider('sEmissive', 'vEmissive', 'uEmissive', 2);
/* 超級形狀的正規化：抽樣量出這組參數實際的最大半徑，把倒數送進 shader。

   為什麼需要：超級公式的半徑是 pow(cosⁿ + sinⁿ, -1/n1)，圓潤度拉高時
   括號內會逼近 0，整個值就爆上去 —— 實測極端組合是圓球的 6.2 倍，
   形狀會撐出畫面、甚至跑到鏡頭後面被裁掉。

   在 shader 裡夾住不行（會把尖角削平），限制滑桿範圍也不行（罪魁是圓潤度
   不是尖銳度）。正確做法是量出來再整體縮回去，形狀的比例完全保留。 */
const superR = (ang, m, n1, n2) => {
  const t = m * ang * 0.25;
  const s = Math.pow(Math.abs(Math.cos(t)), n2) + Math.pow(Math.abs(Math.sin(t)), n2);
  return Math.min(2.5, Math.pow(Math.max(s, 1e-4), -1 / n1));
};
const applySuper = () => {
  const m  = uniforms.uSuperM.value, n1 = uniforms.uSuperN1.value, n2 = uniforms.uSuperN2.value;
  let mx = 0;
  for (let i = 0; i < 4000; i++) {          // 4000 點就夠準，跑起來不到 1 毫秒
    const lat = Math.asin(Math.min(1, Math.max(-1, (i * 0.7548776662 % 1) * 2 - 1)));
    const lon = (i * 0.5698402910 % 1) * 2 * Math.PI - Math.PI;
    const r1 = superR(lon, m, n1, n2), r2 = superR(lat, m, n1, n2);
    mx = Math.max(mx, Math.hypot(r1 * Math.cos(lon) * r2 * Math.cos(lat),
                                 r2 * Math.sin(lat),
                                 r1 * Math.sin(lon) * r2 * Math.cos(lat)));
  }
  uniforms.uSuperNorm.value = 1 / Math.max(mx, 1e-3);
};
bindSlider('sSuperM', 'vSuperM', 'uSuperM', 0, applySuper);
bindSlider('sSuperN1', 'vSuperN1', 'uSuperN1', 2, applySuper);
bindSlider('sSuperN2', 'vSuperN2', 'uSuperN2', 2, applySuper);

bindSlider('sWaft', 'vWaft', 'uWaft', 2);
/* 滑桿是百分比（看得懂的單位），uniform 要 0~1。

   而且 uniform 不是直接吃滑桿值 —— 揮散粒子會自己呼吸：從設定值外擴兩成
   再收回來，一秒出去、一秒回來（見主迴圈）。滑桿存的是「基準」。 */
let waftPickBase = 0.50;
bindSlider('sWaftPick', 'vWaftPick', null, 0, (pct) => { waftPickBase = pct / 100; });
/* 直向螢幕上，形狀要改用寬度當基準。

   相機的 fov 是**垂直**的，所以形狀在畫面上有多大是畫面**高度**決定的，
   跟寬度無關。桌機寬、高度矮，這沒問題；直向手機反過來，同一顆球
   就溢出畫面—— 390×844 實量球徑到了螢幕寬度的 138%，上下左右都被切掉。

   算法是 min(1, PORTRAIT_GAIN × 寬/高)，增益的由來寫在 viewFit 那裡。
   橫向（乘完仍 ≥ 1）一律回 1，**桌機一點都沒變**；直向縮到佔寬度 75%。
   乘在滑桿值後面而不改滑桿本身，和點大小那邊一樣：
   滑桿是使用者的意圖，螢幕比例是裝置的性質，兩件事不要混在同一個數字裡。
   碰撞判定（overShape）讀的是 uniform 不是滑桿，所以自動跟著縮。

   **高度基準要凍結，不能每次 resize 都重量。** innerHeight 在手機上有兩個
   不是使用者本意的變動源，兩個都只改高度、不改寬度：

     1. 軟鍵盤 —— 面板裡有「文字內容」輸入框，而手機版面板就是底部抽屜，
        輸入框正好在鍵盤上方。實測 390×844 → 390×480，形狀當場放大 76%
        （uScale 9.24 → 16.25），收鍵盤再彈回去。
     2. 網址列收合 —— 捲動途中 innerHeight 會變 5~10%，形狀跟著抖一下。

   這和本檔 .sec--hero 那段是同一個教訓：**怕變的量不能綁到會變的高度。**
   所以觸控裝置只認寬度的變化（直向↔橫向互轉一定改寬度，剛好分得開）；
   滑鼠裝置沒有鍵盤和網址列這兩件事，照常每次重量。 */
/* 文字形狀的尺寸上限。

   **把形狀擐大的是視窗高度，不是寬度** —— 相機的 fov 是垂直的，
   每世界單位占幾像素 = (視窗高/2) / (tan(fov/2) × 距離)，裡面沒有寬度。
   實測（TEAMMAX 的畫面寬度）：
     1280×900 → 584px、1920×900 → 599px（同高度加寬只差 2.6%）
     1280×1200 → 804px（同寬度加高 900→1200 就漲了 38%）
   所以「按寬度設上限」是空包彈，要釘的是畫出來的像素大小。

   錮點取 900：那是 1280 那一檔量的高度，文字寬 584px（佔畫面 45.6%）。
   視窗再高就按比例縮回去，像素大小就停在那裡。要讓文字大一點就把 900 調大。

   用 fitH 不用 innerHeight：軟鍵盤和網址列會改 innerHeight，文字會跟著跳。
   手機（844 < 900）算出來是 1，完全不受影響。 */
const TEXT_CAP_H = 900;
const textFit = () => Math.min(1, TEXT_CAP_H / fitH);

/* 第 2 段那顆球要佔畫面寬度的 SPHERE_WIDTH。
   基準是實測來的：fit = 1、視窗 901px 高、uScale 20 的時候，
   球的可見寬度是 630px（門檻取到看得出邊界的那一圈）。
   可見寬度只跟視窗**高度**成正比（fov 是垂直的，理由見 TEXT_CAP_H 上方），
   所以換算式裡沒有寬度，寬度只出現在「目標是多少」那一邊。 */
const SPHERE_WIDTH = 0.90;
const SPHERE_FIT_MAX_W = 640;   // 只有這個寬度以下才套，桌機維持原樣
const SPHERE_REF_W = 624;    // 基準可見寬度（px），校正過，見上方
const SPHERE_REF_H = 901;    // 量基準時的視窗高
const SPHERE_REF_S = 20;     // 量基準時的 uScale
const sphereFit = () => {
  if (window.innerWidth > SPHERE_FIT_MAX_W) return 1;
  const base = SPHERE_REF_W * (window.innerHeight / SPHERE_REF_H)
             * (uniforms.uScale.value / SPHERE_REF_S);
  return base > 0 ? SPHERE_WIDTH * window.innerWidth / base : 1;
};
/* 最後一段的內文要貼在**文字形狀的可見下緣**底下 TEXT_GAP_PX，
   不是畫面高度的某個百分比 —— 形狀的大小跟著視窗高度走（fov 是垂直的），
   用百分比釘的話，換一個視窗比例間距就跑掉了。

   幾何下緣算得出來：形狀中心在 vh/2 − SHAPE_OFFSET.y·k − uTextLift·k，
   半高是烘焙座標的最低點 × uScale × uTextFit × k。**但看得見的邊比幾何邊低**
   （粒子有點大小、還有打散和揮散），實測 901px 高的視窗上幾何下緣 364px、
   看得見的字底 406px，所以乘一個 TEXT_EDGE 校正。 */
const TEXT_GAP_PX = 45;    // 形狀可見下緣 → 那句話
const TEXT_EDGE = 1.82;    // 可見半高 ÷ 幾何半高，實測校正
let textLowY = null;       // 烘焙座標的最低點，量一次就好
const brandCopy = document.querySelector('.copy--low');
function textBottomPx() {
  const vh = window.innerHeight;
  // 這裡不能用 DEG：它宣告在更後面，初始化時呼叫會踩到 TDZ
  const k = (vh / 2) / (Math.tan(CAM.fov * Math.PI / 360) * -SHAPE_OFFSET.z);
  if (textLowY === null) {
    const a = bakeCache.get(200);
    if (a) { let lo = 0; for (let i = 1; i < a.length; i += 3) if (a[i] < lo) lo = a[i];
             textLowY = lo; }
  }
  const low = Math.abs(textLowY === null ? 0.185 : textLowY);   // 還沒烘好就用實測值頂著
  const cy = vh / 2 - SHAPE_OFFSET.y * k - uniforms.uTextLift.value * k;
  return cy + low * uniforms.uScale.value * uniforms.uTextFit.value * k * TEXT_EDGE;
}
function placeBrandCopy() {
  if (brandCopy) brandCopy.style.top = Math.round(textBottomPx() + TEXT_GAP_PX) + 'px';
}
const applyScaleFit = () => {
  uniforms.uScale.value = parseFloat(document.getElementById('sScale').value) * viewFit();
  uniforms.uTextFit.value = textFit();
  uniforms.uSphereFit.value = sphereFit();   // 要在 uScale 之後算
  placeBrandCopy();                          // 要在 uTextFit 之後算
};
bindSlider('sScale', 'vScale', null, 1, applyScaleFit);
bindSlider('sDotShape', 'vDotShape', null, 2, applyDotSizes);
bindSlider('sScatter', 'vScatter', null, 2, applyScatter);
bindSlider('sSpin', 'vSpin', 'uSpin', 2);

/* ── 形狀的旋轉：一般形狀自轉，文字定在正面 ────────────────────

   文字 360 度轉起來完全讀不出字，所以它是唯一的特例：**預設就是完全正面**，
   只有滑鼠碰到它時才會被撥動（左右各 15 度），放手就自己轉回正面。

   這裡本來有一根「晃動幅度」滑桿，讓文字自己小幅來回擺。拿掉了 ——
   兩個理由：正面才是文字該有的樣子（要讀的東西不該一直在動），而且
   15 度是**總量**上限，晃動先把額度吃掉的話滑鼠就幾乎撥不動它。

   為什麼角度在 JS 算而不是丟給 shader：兩種轉法要能**平滑接軌**。
   自轉角是一直累加的（幾分鐘後就好幾千度），文字角永遠在 ±15 度以內；
   在 shader 裡直接 mix 兩個角度的話，一次轉場會暴衝好幾圈。

   接軌用兩個小手法，缺一個就會看到畫面跳一下：
     ① 進文字時把角度**挪到離目前自轉角最近的那一圈**（textTurns）。
        轉一整圈等於沒轉，所以這只是選一條最短路徑回到正面，最多半圈。
     ② 文字期間**自轉先停著**（乘 1 - textBlend）。不停的話文字擺著的
        那幾十秒自轉角照樣在累加，切回圓球時要一次補回來，會暴衝。 */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const TEXT_SHAPE = 200;         // 和 SHAPES 裡的文字同一個編號
const POLY_SHAPE = 17;          // 隨機離散
/* 「形狀文字」那一類。文字轉一下就讀不出來；隨機離散是擺在畫面平面上的
   角形，轉到側面就只剩一條厚度 —— 兩個都定在正面、都吃揮散、都不吃打散
   和自轉。shader 端對應的是 pinMix。

   寫成函式宣告不是箭頭函式：markShapeUI 在檔案裡比這裡早，
   函式宣告會提升，const 不會。 */
function isPinned(id) { return id === TEXT_SHAPE || id === POLY_SHAPE; }
let spinAngle = 0;              // 自轉角，一直累加
let textMode = 0;               // 這一幀想要哪一種：0 自轉、1 定正面
let textBlend = 0;              // 兩者之間的補間，跟形狀轉場差不多快
let textTurns = 0;              // 進入定正面時鎖定的圈數，見上面 ①

/* 滑鼠能把形狀轉多少。只有左右，沒有上下。數字是「半個畫面」對應的角度，
   所以一般形狀寫 180 度 —— 滑鼠從最左掃到最右剛好轉完一整圈，任何一面都看得到。
   文字只有 15 度，因為它一轉就讀不出來。 */
const YAW_FREE  = 180 * DEG;
const YAW_PIN   =  18 * DEG;   // 形狀文字：左右總共 36 度
const PITCH_PIN =  12 * DEG;   // 形狀文字：上下總共 24 度
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

/* ── 游標有沒有碰到形狀 ──────────────────────────────────
   滑鼠要**碰到形狀本身**才轉得動它，游標在角落亂晃不算。

   形狀是一團霧，沒有明確邊界，所以判定用一個包住它的圓角矩形，而且刻意
   放寬一點：邊緣本來就是漸淡的，判定太緊會在還看得到粒子的地方就失效。

   不必動投影矩陣 —— 形狀釘在相機座標系（見 SHAPE_OFFSET），距離是定值，
   一個比例尺就夠：一個世界單位等於幾個像素 = (視窗高/2) ÷ (tan(半個FOV) × 距離)。 */
let pointerX = -1e5, pointerY = -1e5;   // 原始游標位置（CSS 像素）
let pointerOnUI = false;                // 游標在面板或導覽列上 —— 那不算碰到形狀
let hitR = { x: 1, y: 1 };              // 形狀在 unit 空間佔多大，見 measureHit
/* 判定要放寬兩種量，只放一種會出事：
   HIT_PAD 是比例，處理「霧的邊緣是漸淡的」；
   hitEdge() 是粒子那一圈，處理「粒子本身有大小」—— 點畫出來就佔十幾個像素，
   幾何範圍到了，畫面上的字還多出一圈。文字只有 56 像素高，4% 的比例只補
   2 像素，補不到那一圈：實測畫出來 72 高、判定只有 60，游標明明壓在筆畫上
   卻抓不到。薄的形狀一定要有這一項。

   這一項**不寫死成常數**，但也**不能純比例**，實測兩邊都會偏：

   gl_PointSize 的單位是**裝置像素**，這裡的座標是 CSS 像素，差一個 pixelRatio；
   而點的大小又跟著視窗高度和「粒子大小」滑桿走。瀏覽器縮放同時動這兩邊
   （縮到 90%：CSS 像素變多、pixelRatio 變小），所以要除以 pixelRatio 換算。

   但「畫出來比幾何範圍多多少」不是線性的 —— 點精靈有徑向衰減，點放大時
   看得見的那一圈長得比點本身慢。實測（1268×618、預設景深）每邊要補的量：
     粒子大小 0.10 → 5.6px、0.30 → 7.6px、0.90 → 9.6px
   滑桿走了九倍，要補的只從 5.6 長到 9.6。純比例算出來 0.90 會補到四十幾，
   判定區比文字大了 84%；0.10 又只補四點多，等於沒補。所以夾住上下限，
   8～22 這個區間涵蓋了「滑桿全範圍 × 縮放 50%～100%」量到的所有情況。 */
const HIT_PAD = 1.04;
const hitEdge = () =>
  clamp(uniforms.uDotShape.value / renderer.getPixelRatio() * 20, 8, 22);

/* 程序形狀都被正規化到約 1，只有烘焙的（文字）差很多 ——「TEAMMAX」的寬
   是高的七、八倍，用圓形判定會整條讀不到。所以烘焙完直接量它的實際範圍。 */
function measureHit(arr) {
  let mx = 0, my = 0;
  for (let i = 0; i < arr.length; i += 3) {
    const x = Math.abs(arr[i]), y = Math.abs(arr[i + 1]);
    if (x > mx) mx = x;
    if (y > my) my = y;
  }
  return { x: mx || 1, y: my || 1 };
}

function overShape() {
  // 形狀還沒成形就沒有東西可以碰。0.5 是「看得出是個形狀」的分界
  if (pointerOnUI || smoothProgress < 0.5) return false;
  const k = (window.innerHeight / 2) / (Math.tan(CAM.fov * DEG / 2) * -SHAPE_OFFSET.z);
  const cx = window.innerWidth / 2 + SHAPE_OFFSET.x * k;
  const cy = window.innerHeight / 2 - SHAPE_OFFSET.y * k;
  /* 打散是**切線方向**的位移，所以外緣是直角三角形的斜邊，不是直接相加。
     形狀文字那一類不吃打散（見 shader 的 pinMix），判定區也就不該把它算進去 */
  // 文字有自己的尺寸上限（見 textFit），判定區要跟著縮，否則抓得到空氣
  const tf = currentShape === 200 ? uniforms.uTextFit.value
           : (currentShape === 6 ? uniforms.uSphereFit.value : 1);
  const s = uniforms.uScale.value * tf * k * HIT_PAD, e = hitEdge();
  const sc = isPinned(currentShape) ? 0 : uniforms.uScatter.value;
  const dx = Math.abs(pointerX - cx) / (Math.hypot(hitR.x, sc) * s + e);
  const dy = Math.abs(pointerY - cy) / (Math.hypot(hitR.y, sc) * s + e);
  /* 2.5 次方 = 介於橢圓（2）和矩形（∞）之間的圓角矩形。圓球那類用橢圓剛好，
     但文字是一長條，橢圓會把頭尾兩個字的上下角切掉，摸不到 */
  return Math.pow(dx, 2.5) + Math.pow(dy, 2.5) <= 1;
}

/* ── 滑鼠轉動：抓住的模型 ────────────────────────────────
   碰到形狀的當下把游標位置記成原點，之後只算**位移**。

   為什麼不用絕對對應（游標在畫面哪裡就轉幾度）：形狀只佔畫面中間一塊，
   游標踏上去的瞬間角度會從 0 跳到對應值，一次好幾十度。抓住的模型從哪裡
   碰到都是 0，不會跳。

   而且用的是**原始**游標位置，不是平滑過的 uMouse —— 抓的瞬間兩者可能差
   很多，拿平滑值當原點的話手停下來之後形狀還會自己再滑一段。抖動改成平滑
   「結果」（mouseYaw 追著 yawTarget 跑）。 */
let mouseYaw = 0;      // 目前實際套用的左右角度
let mousePitch = 0;    // 目前實際套用的上下角度（只有形狀文字那一類有）
let yawTarget = 0;     // 滑鼠想要的左右角度
let pitchTarget = 0;   // 滑鼠想要的上下角度
let grabbing = false;  // 上一格碰到了沒
let grabX = 0, grabYaw = 0;       // 抓住當下的游標位置與角度
let grabY = 0, grabPitch = 0;

/* 放手回正：**有終點的補間**，不是指數收斂。

   指數收斂沒辦法同時滿足「一半 0.6 秒」和「全程 2 秒」—— 半衰 0.6 秒的
   指數要走到剩百分之一得花 4 秒，而且永遠不會真的歸零。所以改成走完就停。

   剩餘量 = (1 − t)^HOME_POW，t 是走完的比例：
     t = 0.3（0.6 秒）→ 剩 0.5      t = 1（2 秒）→ 剩 0，真的回到正中間
   次方是解出來的：ln(0.5) ÷ ln(0.7) = 1.9434。

   用 (1−t)^n 而不是 t^(1/n)：後者在起點的斜率是無限大，放手的瞬間會抽一下。 */
const HOME_SECS = 2.0;
const HOME_POW  = 1.9434;
let homeT = 1, homeYaw0 = 0, homePitch0 = 0;

// dt 用參數傳而不是直接讀 clock —— 這樣除錯時可以在主控台一格一格手動推進
// （見檔尾的 __dbg），不必等真的跑那麼多幀
function updateRotation(dt) {
  const speed = uniforms.uSpin.value;
  spinAngle += dt * speed * (1 - textBlend);

  const pinned = isPinned(currentShape);
  const over = overShape();

  const rawX = pointerX / window.innerWidth * 2 - 1;
  const rawY = pointerY / window.innerHeight * 2 - 1;
  if (over && !grabbing) { grabX = rawX; grabYaw = mouseYaw; grabY = rawY; grabPitch = mousePitch; }
  grabbing = over;

  if (over) {
    yawTarget = grabYaw + (rawX - grabX) * (pinned ? YAW_PIN : YAW_FREE);
    if (pinned) {
      yawTarget = clamp(yawTarget, -YAW_PIN, YAW_PIN);
      // 往下拖 = 把頂端推遠。rawY 往下是變大，所以要減
      pitchTarget = clamp(grabPitch - (rawY - grabY) * PITCH_PIN, -PITCH_PIN, PITCH_PIN);
    }
    // 抓著的時候要跟手，所以是快的指數追蹤
    mouseYaw   += (yawTarget   - mouseYaw)   * approach(0.14, dt);
    mousePitch += (pitchTarget - mousePitch) * approach(0.14, dt);
    // 一直重設回正的起點，放手的瞬間就是從這裡開始走
    homeT = 0; homeYaw0 = mouseYaw; homePitch0 = mousePitch;
  } else if (pinned) {
    // 放手：走一段有終點的補間回到正中間
    homeT = Math.min(1, homeT + dt / HOME_SECS);
    const left = Math.pow(1 - homeT, HOME_POW);
    mouseYaw = homeYaw0 * left;
    mousePitch = homePitch0 * left;
    yawTarget = 0; pitchTarget = 0;
  } else {
    // 一般形狀放開停在原地，不會把你轉的收回去
    mouseYaw += (yawTarget - mouseYaw) * approach(0.045, dt);
    mousePitch += (0 - mousePitch) * approach(0.045, dt);
  }

  const want = pinned ? 1 : 0;
  if (want && !textMode) {
    /* 切到文字時，超出文字額度的那部分滑鼠角度挪進自轉角 —— 總角度一點沒變，
       畫面不會跳，但 mouseYaw 回到文字的量級，放開時才不會空轉一大段才有反應 */
    const keep = clamp(mouseYaw, -YAW_PIN, YAW_PIN);
    spinAngle += mouseYaw - keep;
    mouseYaw = yawTarget = grabYaw = keep;
    /* 進文字時挑「離現在最近的那一圈」轉回正面。基準要用**含滑鼠**的實際角度，
       不能只用 spinAngle —— 滑鼠最多會偏 180 度，用錯基準就會多繞半圈 */
    textTurns = Math.round((spinAngle + mouseYaw) / TAU);
  }
  textMode = want;
  textBlend += (want - textBlend) * approach(0.08, dt);

  const freeYaw = spinAngle + mouseYaw;
  const textYaw = textTurns * TAU + clamp(mouseYaw, -YAW_PIN, YAW_PIN);

  uniforms.uSpinAngle.value = freeYaw + (textYaw - freeYaw) * textBlend;
  // 上下只有形狀文字那一類有，所以直接乘 textBlend 淡進淡出
  uniforms.uPitchAngle.value = mousePitch * textBlend;
}

applyDotSizes();

/* ══════════════════════════════════════════════════════════
   進度來源
   ══════════════════════════════════════════════════════════ */
let manualMode = false, targetProgress = 0, smoothProgress = 0;
const progressSlider = document.getElementById('sProgress');
const progressLabel = document.getElementById('vProgress');
const modeLabel = document.getElementById('mode');

const heroPin  = document.querySelector('.sec--hero .pin');
const copyEls  = [...document.querySelectorAll('.copy')];
/* 每段內文三個數字：標題透明度、內文透明度、垂直位移。
   一般的段落三者連動（同一個 revealOf 的值）；分段揭示的段落各走各的。 */
let copyState = copyEls.map(() => ({ title: 0, body: 0, shift: 0 }));

/* ── 捲動停點 ────────────────────────────────────────────
   原版只有一個進度來源：hero 被捲掉多少 → 收斂 0→1，之後的 section 只換
   形狀、進度**永遠停在 1**。這裡要的是「收斂 → 散開 → 再收斂」，
   進度必須回得去，所以改成多停點內插。

   每個 section 自己宣告要什麼狀態，捲動只負責在相鄰兩個停點之間內插：

     data-stop      我是一個停點
     data-converge  0 = 維持背景形態、1 = 收斂成形狀
     data-shape     收斂目標（converge=1 的停點才要寫）
     data-field     背景形態的分支編號（converge=0 的停點才要寫）
     data-amp       起伏高度（同上）
     data-speed     流動速度（同上）

   amp 和 speed 都只是 float uniform，但**改的當下都會跳**：speed 改的是
   `t = uTime * uWaveSpeed` 的斜率，一改相位就整個位移。所以和 field 一樣，
   只在段界換手（那裡背景剛好看不見）。

   要加一段就多一個帶 data-stop 的 section，這裡一行都不用改。 */
const STOPS = [...document.querySelectorAll('[data-stop]')].map((el) => ({
  el,
  conv:  +(el.dataset.converge || 0),
  shape: el.dataset.shape != null ? +el.dataset.shape : null,
  field: el.dataset.field != null ? +el.dataset.field : null,
  amp:   el.dataset.amp   != null ? +el.dataset.amp   : null,
  speed: el.dataset.speed != null ? +el.dataset.speed : null,
}));
/* 停點兩側各留多久的靜止區（視窗高的倍數）。這一段裡形狀完全不動，
   變形集中在兩個靜止區中間跑完 —— 不留的話形狀永遠在動，沒有一格站定。

   **這個值和 .sec--shape 的內距、分段揭示那段的高度是綁在一起的三個數。**
   它決定「靜止區有多長」，那兩個決定「停點隔多遠」；三者一起乘二，
   全頁的捲動距離就加倍。單獨改一個會把變形和揭示的比例弄亂。
   單段淡入的段落還有第四個約束：內文的淡入範圍是 ±0.62 個視窗高
   （REVEAL_NONE），靜止區要包得住它。 */
const STOP_HOLD = 0.81;
let activeSection = STOPS.find((s) => s.shape != null)?.el || null;

/* ── 分段揭示 ────────────────────────────────────────────
   宣告 data-reveal="staged" 的段落走這條：形狀站定之後，
   標題先從畫面正中間淡入 → 內文再淡入 → 兩者一起往上退場。

   **整段都跑在停點的靜止區裡**（錨點 ±STOP_HOLD，那一段的收斂進度恆為 1），
   所以形狀從頭到尾一動也不動 —— 這是「揭示歸揭示、變形歸變形」的前提。

   q 是靜止區裡的位置：0 = 剛收斂完，1 = 準備開始變下一個形狀。
   節奏全寫在下面這張表，改快慢只動它。中間刻意留空檔：
   0.14~0.16 讓標題單獨站一下，0.32~0.68 讓標題和內文完整停著不動。 */
const STAGE = {
  title: [0.00, 0.14],   // 標題淡入
  body:  [0.16, 0.32],   // 內文淡入
  exit:  [0.68, 1.00],   // 一起往上收出畫面（不淡出）
};
const ramp = (q, [a, b]) => Math.min(1, Math.max(0, (q - a) / (b - a)));
// 每段內文屬於哪個停點；沒有的話（理論上不會）就走一般的揭示
const copyStops = copyEls.map((el) => STOPS.find((st) => st.el.contains(el)) || null);
/* ── 右側的段落指示 ────────────────────────────────────
   幾個停點就幾顆點，**由 STOPS 生出來**，不寫死在 HTML 裡 ——
   哪天加一段，點也會自己跟著多一顆。
   放大用 transform 不改寬高：改寬高的話每顆點的中心會跟著位移，
   整排會在切換的時候上下抖一下。 */
const dotsBox = document.createElement('div');
dotsBox.id = 'dots';
/* 點也能按，行為和左上導覽列一樣：跳到那一章的開頭再播那一章。
   名稱直接抄導覽列的連結文字 —— 同一個地方兩個入口，講法要一致。 */
const dotLabel = (st) => {
  const link = document.querySelector('#nav .bar > a[href="#' + st.el.id + '"]');
  // 首頁在導覽列上是字標不是文字，只好寫死。讀 <html lang> 不讀 lang 變數：
  // 這個函式在 lang 宣告之前就會被叫一次（建點點的時候），會踩到 TDZ
  if (!link) return document.documentElement.lang === 'en' ? 'Home' : '首頁';
  return link.textContent.trim();
};
const dots = STOPS.map((st, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'dot';
  b.setAttribute('aria-label', dotLabel(st));
  b.addEventListener('click', () => playChapter(i));
  return dotsBox.appendChild(b);
});
document.body.appendChild(dotsBox);
let dotAt = -1;
function setDot(k) {
  if (k === dotAt) return;   // 只有換了才寫，不必每格碰 DOM
  if (dots[dotAt]) dots[dotAt].classList.remove('on');
  dotAt = k;
  if (dots[k]) dots[k].classList.add('on');
}
/* ── 最後一段：收斂完成才開始計時淡入 ──────────────────────
   別段的內文都由**捲動位置**決定透明度；最後一段不是 ——
   它要等粒子把那五個字寫完（收斂進度到 1）的那一瞬間才起算，
   然後花 BRAND_FADE_S 秒淡進來，中途再怎麼捲都不影響快慢。

   所以判斷條件有兩個，缺一不可：
     activeSection === brandEl   第 2 段的收斂進度也會到 1，要排除掉
     smoothProgress > 0.98       收斂真的走完，不是還在路上。門檻不取 0.995：
                                 捲到底之後進度還要平滑 0.6 秒才追得到那裡，
                                 讀起來像卡了一下。0.98 大約離底 100px 就成立

   條件一旦不成立就把計時歸零（捲回上一段再下來會重播一次），
   這也是「淡出」——沒有另外寫淡出，離開就是直接回 0。 */
const BRAND_DELAY_S = 0;          // 那句話不等，收斂完成就開始淡入
const BRAND_FADE_S = 3.0;         // 那句話淡入多久
const BRAND_TAIL_DELAY_S = 1.0;   // 信箱與地址晚 1 秒才開始（同一個起點）
const BRAND_TAIL_FADE_S = 3.0;    // 它們自己淡多久
const brandIdx = copyEls.findIndex((el) => el.classList.contains('copy--low'));
const brandEl  = brandIdx < 0 ? null : (copyStops[brandIdx] || {}).el || null;
const brandTail = document.querySelector('.copy--low .tail');
let brandT0 = null;    // 收斂完成的那一刻（秒），null = 還沒到
let brandFade = 0;
/* ── 標題「從四面八方收回中心」 ────────────────────────────
   宣告 data-title-fx="converge" 的段落，標題不是整塊淡入，而是拆成
   一個字一個 span，每個字從自己的方向飛回定位。

   **拆字要跳過 <br> 和 <em>**：只包文字節點裡的字，元素結構原封不動 ——
   否則 <em> 的顏色和換行會一起掉。空白照原樣留著，包起來會多出
   可換行的節點，標題的斷行會亂。 */
const TITLE_SPREAD  = 0.42;   // 起始距離最遠佔視窗高的幾成
const TITLE_STAGGER = 0.35;   // 最晚出發的字晚多少（進度單位）
function splitChars(root) {
  const chars = [];
  const walk = (node) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const ch of child.nodeValue) {
          if (!ch.trim()) { frag.appendChild(document.createTextNode(ch)); continue; }
          const sp = document.createElement('span');
          sp.className = 'ch';
          sp.textContent = ch;
          frag.appendChild(sp);
          chars.push(sp);
        }
        child.replaceWith(frag);
      } else if (child.nodeType === 1 && child.tagName !== 'BR') {
        walk(child);
      }
    }
  };
  walk(root);
  return chars;
}

/* 逐字收斂用的版本：拆完再給每個字一組方向、距離、延遲。 */
function splitTitle(root) {
  const chars = splitChars(root);
  /* 方向、距離、延遲全部由「第幾個字」推導，**不用 Math.random** ——
     每次重整都一樣，除錯時對得起來，而且不必存亂數種子。
     角度用黃金角：相鄰的字散往完全不同的方向，不會整排往同一邊倒。
     距離和延遲用兩個不同的無理數取小數，彼此不會同步。 */
  return chars.map((el, i) => {
    const a = i * 2.399963;                              // 黃金角（弧度）
    const r = 0.45 + ((i * 0.6180339887) % 1) * 0.55;    // 距離倍率 0.45~1.0
    return {
      el,
      dx: Math.cos(a) * r,
      dy: Math.sin(a) * r,
      delay: ((i * 0.7548776662) % 1) * TITLE_STAGGER,
    };
  });
}
// 標題和內文各自的元素。查一次存起來，不要每格 querySelector
let stageParts;
const buildStageParts = () => copyEls.map((el, i) => {
  const title = el.querySelector('.stage-title');
  const st = copyStops[i];
  const fx = title && st && st.el.dataset.titleFx === 'converge';
  return {
    title,
    body:  el.querySelector('.stage-body'),
    chars: fx ? splitTitle(title) : null,
    lastE: -1,   // 上一格的標題進度，沒變就不重寫那一排 transform
  };
});

stageParts = buildStageParts();

// 元素在整份文件裡的位置。offsetTop 累加而不用 getBoundingClientRect，
// 因為前者忽略 transform，量的是「版面上的位置」而不是「畫面上的位置」
const docTop = (el) => { let y = 0; for (let n = el; n; n = n.offsetParent) y += n.offsetTop; return y; };

/* 一段內文的「就位程度」：依**中心離視窗中心多遠**來算，不是依上下緣。

   用上下緣算的話（上緣進視窗就開始亮、下緣出視窗才全暗），一段內文的
   存在期 = 視窗高 + 自身高度，比它自己高出整整一個視窗。所以兩段內文的
   間距只要小於一個視窗高，就必然會有一段同時亮著 —— 這是幾何上的必然，
   把淡入距離調短也救不了（反而更糟，因為亮得更快）。

   改用中心距離就沒有這個下限。間距 0.5 個視窗高也能乾淨地一段接一段，
   中間還會空出一小段「只有形狀」的畫面，剛好讓變形有自己的舞台。

   前提是內文本身要比視窗矮，否則永遠到不了全亮。 */
const REVEAL_FULL = 0.30;   // 中心離視窗中心 0.30 個視窗高以內 → 全亮
const REVEAL_NONE = 0.62;   // 超過 0.62 → 全暗
function revealOf(el) {
  const vh = window.innerHeight;
  // 用 offsetTop 而不是 rect：內文帶著淡入的 transform，
  // 拿 rect 算會變成「位置影響透明度、透明度又改變位置」的回授
  const y = docTop(el) - window.scrollY + el.offsetHeight / 2;
  const d = Math.abs(y - vh / 2) / vh;
  return Math.min(1, Math.max(0, (REVEAL_NONE - d) / (REVEAL_NONE - REVEAL_FULL)));
}

progressSlider.addEventListener('input', () => {
  manualMode = true;
  targetProgress = parseFloat(progressSlider.value);
  modeLabel.innerHTML = '目前：<b style="color:#8fa8ff">手動預覽</b><br>捲動頁面即回到跟隨模式。';
});

const smoothstep = (x) => x * x * (3 - 2 * x);
/* 一段變形的緩動。**起步要有速度**，這是 TOP_BAND 那個設定能不能被看見的關鍵。

   本來用 smoothstep，它在 u = 0 的斜率是 0。實測：變形在文字進到上方 20% 那一刻
   準時啟動了，但等文字整片離開畫面（往前只走了整段的 14%），進度才動了 0.2% ——
   人眼完全看不出來，等於這個設定沒生效。

   換成 sin(u × π/2)：起步斜率 1.57，同樣那 14% 已經跑完 22%，看得很清楚；
   收尾仍然是水平切線，形狀停進下一個定格時不會有煞車感。
   起步的速度跳變在這裡是**要的** —— 它是「文字退到頂端」和「形狀開始變」
   之間的因果關係，那一下就是要被看見。 */
const easeSegment = (u) => Math.sin(u * Math.PI / 2);
/* **最後一段用線性**。sin 那條是先快後慢，最後 20% 的捲動只換到 4% 的進度 ——
   中間幾段這樣很好（變形早早看得出來，尾巴輕輕收住），但最後一段的終點
   就是**頁尾**：人已經捲到底了，畫面卻還在做那 4% 看不出來的收尾，
   感覺就是「形狀早就出現了，卻還要再捲一段才有下文」。
   改成線性之後，看得見的變化一路演到最底那一格，到底＝剛好完成。 */
const segEase = (i, u) => (i === STOPS.length - 2 ? u : easeSegment(u));
// 停點的錨是 section 的**中心**，不是上緣 —— 內文也擺在中心，兩者要對齊
const anchorOf = (st) => docTop(st.el) + st.el.offsetHeight / 2;
/* 分段揭示的內文退場時要往上移多遠：從畫面中線走到完全越過上緣，
   也就是半個視窗 + 半個自己，再多留 24px 免得柔光罩的邊還露在上面。
   **copyStateOf 和 transitionStart 都吃這一條**，抽出來才不會兩邊走鐘。 */
const riseOf = (el, vh) => (vh + el.offsetHeight) / 2 + 24;

/* ── 變形要從哪個捲動位置開始 ────────────────────────────
   一般停點：靜止區的邊界（錨點 + STOP_HOLD），也就是內文整片離開之後。

   分段揭示的停點提早：**內文往上退到畫面頂端那 25% 的時候就開始變**。
   等它整片離開才動的話，中間會有一段「文字走了、形狀還沒動」的空白捲動，
   而那正是最容易讓人以為卡住的地方。提早之後兩件事接得上 ——
   文字還在往上收，背景已經動起來了。

   算法：內文停在中線時上緣在 (視窗高 − 自己的高) / 2，退場會讓它往上移
   riseOf 那麼多。要上緣落到 TOP_BAND × 視窗高，退場就得走完
     out = (原本的上緣 − 門檻) / 退場總距離
   再把 out 換回 q（退場區間的內插），最後換成捲動位置。 */
const TOP_BAND = 0.25;
function transitionStart(st, vh) {
  const H = STOP_HOLD * vh;
  const copy = st.el.querySelector('.copy--staged');
  if (!copy) return anchorOf(st) + H;
  const out = Math.min(1, Math.max(0,
    ((vh - copy.offsetHeight) / 2 - TOP_BAND * vh) / riseOf(copy, vh)));
  const q = STAGE.exit[0] + out * (STAGE.exit[1] - STAGE.exit[0]);
  return anchorOf(st) - H + q * 2 * H;
}

/* 現在落在第幾段（第 i 個停點 → 第 i+1 個），以及這一段走了幾成。
   每格重量而不快取：內文的高度會隨視窗寬度變，錨跟著變。 */
/* 最後一段的變形**收在頁尾那一格**，不收在靜止區的起點。
   收在靜止區起點的話，後面還剩一個多視窗的捲動什麼都不會變 ——
   而那正是整頁的結尾，停在「還能捲、但畫面不動」的狀態最難看。
   拉到頁尾之後，捲到底的那一格剛好就是粒子把字寫完、最亮的那一格。 */
const lastRef = () => document.documentElement.scrollHeight - window.innerHeight / 2;
function segmentAt(ref, vh) {
  let i = 0;
  while (i < STOPS.length - 2 && ref >= anchorOf(STOPS[i + 1])) i++;
  const from = transitionStart(STOPS[i], vh);
  const to   = i === STOPS.length - 2
    ? lastRef()
    : anchorOf(STOPS[i + 1]) - STOP_HOLD * vh;
  const u = to > from ? (ref - from) / (to - from) : (ref < from ? 0 : 1);
  return { i, u: Math.min(1, Math.max(0, u)) };
}

/* 一段內文這一格該長什麼樣。四個數字：
     title / body  兩段文字各自的透明度
     shift         垂直位移（px）
     dim           粒子要讓位多少（不等於 body，見下）

   分段揭示的段落**不由 JS 定位**，靠 CSS 的 .stage-pin（sticky）釘在畫面
   正中間。曾經用 JS 每格算「要位移多少才會置中」，結果會一格一格跳 ——
   捲動由合成執行緒處理、transform 由主執行緒隔一格才寫進去，兩者永遠差
   一幀。sticky 沒有這個時間差。JS 只剩退場那一段的位移要算，而那時候
   內文本來就在動，差一幀看不出來。 */
function copyStateOf(el, i, vh, ref) {
  const st = copyStops[i];
  if (!st || st.el.dataset.reveal !== 'staged') {
    const r = revealOf(el);
    return { title: r, body: r, shift: (1 - r) * 30, dim: r };
  }
  const q = Math.min(1, Math.max(0,
    (ref - (anchorOf(st) - STOP_HOLD * vh)) / (2 * STOP_HOLD * vh)));
  const out = ramp(q, STAGE.exit);
  const rise = riseOf(el, vh);
  /* 退場的淡出：**跟位置走，不跟進度走**。上緣進到畫面頂端那 25%
     （TOP_BAND，和背景開始變形是同一條線）才開始淡，上緣到 0 就全消。
     所以文字是「一邊往上收、一邊淡掉」，最後一段路不會硬生生被切掉。
     這一份透明度給**容器**，不給兩個孩子 —— 標題那條逐字收斂讀的是
     cs.title，把淡出乘進去的話每個字會被當成「還沒收回來」再飛出去一次。 */
  const top = (vh - el.offsetHeight) / 2 - out * rise;
  const fade = Math.min(1, Math.max(0, top / (TOP_BAND * vh)));
  return {
    title: ramp(q, STAGE.title),
    body:  ramp(q, STAGE.body),
    shift: -out * rise,
    fade,
    /* 粒子讓位要跟著「內文還看不看得見」。用 body 的話，字都淡掉了
       球還壓著暗，接著就那樣暗暗地變成下一個形狀。 */
    dim: ramp(q, STAGE.body) * fade,
  };
}

function readScroll() {
  const vh = window.innerHeight;
  const ref = window.scrollY + vh / 2;
  copyState = copyEls.map((el, i) => copyStateOf(el, i, vh, ref));
  if (STOPS.length < 2) return;

  const { i, u } = segmentAt(ref, vh);
  const A = STOPS[i], B = STOPS[i + 1];
  // 右側的段落指示：離哪個停點近就亮哪一個（i + u 是小數段位，四捨五入）
  setDot(Math.min(STOPS.length - 1, Math.round(i + u)));

  if (!manualMode) targetProgress = A.conv + (B.conv - A.conv) * segEase(i, u);

  /* 形狀取這一段裡「要收斂的那一端」，背景形態取「不收斂的那一端」。

     兩者都只在**段界**換手，而段界就是某個停點的錨 —— 錨上的進度必定是
     那個停點的 conv（0 或 1），不會是中間值。所以：
       換形狀時另一端的 conv 是 0 → 進度 0 → 形狀看不見 → 切了不會閃
       換背景時另一端的 conv 是 1 → 進度 1 → 背景看不見 → 同理
     uField 是整數 uniform、沒有中間態，這是它唯一能安靜切換的時機。 */
  const shaped  = B.conv > A.conv ? B : (A.conv > B.conv ? A : (A.shape != null ? A : B));
  const fielded = A.conv === 0 ? A : B;
  if (shaped.shape != null) { activeSection = shaped.el; setShape(shaped.shape); }
  if (fielded.field != null) uniforms.uField.value = fielded.field;
  if (fielded.amp   != null) uniforms.uWaveHeight.value = fielded.amp;
  if (fielded.speed != null) uniforms.uWaveSpeed.value  = fielded.speed;
}

/* 導覽列的錨點要落在**停點**上，不是 section 的上緣。
   section 高 200svh、上緣離停點還有 80svh，瀏覽器原生的跳法會把人
   丟在變形跑到一半的地方 —— 那正是這一頁最不該停的位置。 */
/* 跳轉時間**按跨了幾段算**：一段 NAV_STAGE_S 秒。
   收斂 → 現場是一段（3 秒），收斂 → 服務是兩段（6 秒）。

   為什麼不用 scrollTo({ behavior: 'smooth' })：那條的時間由瀏覽器決定，
   而且和距離無關 —— 這一頁每段之間隔了三、四個視窗高，兩段和一段的
   捲動距離差一倍，用原生的跳法兩者花一樣久，中間的變形就會被快轉過去。

   起點取的是**小數的段位**（segmentAt 的 i + u），不是最近的停點：
   停在段落中間時按下去，時間會照剩下的比例縮短，不會硬湊成整段。 */
const NAV_STAGE_S = 3.0;
const NAV_LAST_STAGE_S = 3.0;   // 最後一段（現場 → 服務）。兩個值分開留著，
                                // 之後要讓某一段快慢不同才不用改結構
let navAnim = null, navTimer = null;
// 第 i 段滑到第 i+1 段要幾秒
const glideSeconds = (i) =>
  (i === STOPS.length - 2 ? NAV_LAST_STAGE_S : NAV_STAGE_S);
function navCancel() {
  if (navAnim) { cancelAnimationFrame(navAnim); navAnim = null; }
  if (navTimer) { clearTimeout(navTimer); navTimer = null; }
}
/* 播放中讓播放鈕閃爍。**不能放進 navCancel**：glideTo 每次開始都會先
   navCancel 一次（取消上一段的 rAF），放進去的話每跨一段就熄一次。
   熄燈只有兩個時機：整串播完，或使用者自己動把它接管走。 */
const playBtn = document.querySelector('#nav .play');
const setPlaying = (on) => {
  if (playBtn) playBtn.classList.toggle('playing', on);
};
function navStop() { navCancel(); setPlaying(false); }
function glideTo(y, seconds, done) {
  navCancel();
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const to = Math.min(Math.max(0, y), Math.max(0, max));
  const from = window.scrollY, dist = to - from;
  if (!dist || seconds <= 0) {
    navAnim = null; window.scrollTo(0, to); if (done) done(); return;
  }
  const t0 = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - t0) / (seconds * 1000));
    // easeInOutQuad：兩端都收斂，中間最快。線性的話起步和煞車都很生硬
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    window.scrollTo(0, from + dist * e);
    if (t < 1) { navAnim = requestAnimationFrame(step); }
    else { navAnim = null; if (done) done(); }
  };
  navAnim = requestAnimationFrame(step);
}
/* 「從頭播一次」：每一頁的**開頭**先停 NAV_HOLD_S 秒讓那一段的畫面
   自己走完（分段揭示的文字、形狀站定），再滑到下一頁。
   總長 = 停 × (段數) + 滑 × (段數) = 3 × 1.5 + 3 × 3 = 13.5 秒。
   最後一頁不再停 —— 那裡接手的是內文的計時淡入。 */
const NAV_HOLD_S = 1.5;
/* 第一頁停久一點：它的「內容」就是大標題逐字浮現，那要 HERO_INTRO_S
   （0.5 + 2.5 = 3 秒）才走得完。照 1.5 秒就滑走的話，字打到一半就被帶離開。 */
const holdOf = (i) => (i === 0 ? Math.max(NAV_HOLD_S, HERO_INTRO_S) : NAV_HOLD_S);
const stopY = (i) => (i === STOPS.length - 1
  ? document.documentElement.scrollHeight
  : anchorOf(STOPS[i]) - window.innerHeight / 2);
/* 一個章節的**起點**：靜止區的開頭（形狀剛站定、文字還沒出現）。
   stopY 則是它的**終點**：文字全部呈現、停著不動的那一格。 */
const chapterStart = (i) => Math.max(0,
  anchorOf(STOPS[i]) - STOP_HOLD * window.innerHeight - window.innerHeight / 2);
/* 左上導覽列：**只播那一個章節**，播完就停，不會接著往下跑。

   先瞬移到章節起點，再滑到它的完成狀態。為什麼瞬移而不是滑過去：
   滑到一個**在後面**的章節是順的，但滑回前面的章節等於把整套變形倒著
   播一遍 —— 形狀往回散、文字倒退淡出，看起來像壞掉。倒帶不值得看，
   所以直接切過去，讓「往前播」才有畫面。

   第一段是例外：它的章節就是大標題逐字浮現，不用捲，重播一次就好。 */
function playChapter(i) {
  navStop();
  window.scrollTo(0, chapterStart(i));
  readScroll();          // 瞬移之後補一次，否則狀態還停在原本的位置
  setPlaying(true);
  if (i === 0) {
    // 首頁那一章不用捲，長度就是逐字浮現走完的時間
    replayHeroIntro();
    navTimer = setTimeout(() => { navTimer = null; setPlaying(false); },
                          HERO_INTRO_S * 1000);
    return;
  }
  glideTo(stopY(i), glideSeconds(i - 1), () => setPlaying(false));
}
/* 右上的播放鈕不一樣：它是**整套從頭播到尾**，一段接一段。 */
function playFrom(i) {
  navStop();
  window.scrollTo(0, stopY(i));
  readScroll();          // 瞬移之後補一次，否則狀態還停在原本的位置
  setPlaying(true);
  if (i === 0) replayHeroIntro();   // 回到首頁就把大標題再逐字走一次
  const hop = (j) => {
    if (j >= STOPS.length - 1) { setPlaying(false); return; }
    navTimer = setTimeout(() => {
      navTimer = null;
      glideTo(stopY(j + 1), glideSeconds(j), () => hop(j + 1));
    }, holdOf(j) * 1000);
  };
  hop(i);
}
/* 使用者自己動的話就把動畫讓出去 —— 不讓的話兩邊每格互相蓋，
   畫面會抖到停不下來。 */
['wheel', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, () => {
    navStop();   // 連播放鈕的閃爍一起熄掉
  }, { passive: true });
});
document.querySelectorAll('#nav a[href^="#"]').forEach((a) => {
  a.addEventListener('click', (e) => {
    const id = a.getAttribute('href').slice(1);
    const st = STOPS.find((s) => s.el.id === id);
    if (!st && id !== 'top') return;      // 不認識的錨點交還給瀏覽器
    e.preventDefault();
    /* 左上那幾個（logo／收斂／現場／服務）只播自己那一章；
       右上的播放鈕才是整套從頭播到尾。 */
    const whole = a.classList.contains('play');   // 播放鈕＝整套從頭播到尾
    if (whole) playFrom(0);
    else playChapter(st ? STOPS.indexOf(st) : 0);
  });
});

window.addEventListener('scroll', () => {
  if (manualMode) {
    manualMode = false;
    modeLabel.innerHTML = '目前：跟隨捲動<br>拖動「收斂進度」可手動預覽，再捲動即回到跟隨模式。';
  }
}, { passive: true });

/* ── 版面除錯輔助線 ──
   位置一律用 offsetTop 累加，不用 getBoundingClientRect：
   內文帶著淡入的 transform，用 rect 量出來的線會跟著動畫上下飄 */
const guideBox = document.getElementById('guides');

function buildGuides() {
  const vh = window.innerHeight;
  const rows = [];
  document.querySelectorAll('.sec').forEach((s) => rows.push([docTop(s), 's', s.id + ' 起點']));
  copyEls.forEach((c, i) => {
    const t = docTop(c);
    rows.push([t, 'c', '內文 ' + (i + 1) + ' 上緣']);
    rows.push([t + c.offsetHeight, 'c', '內文 ' + (i + 1) + ' 下緣']);
  });
  rows.push([document.body.scrollHeight, 's', '頁面結束']);

  guideBox.innerHTML = rows.sort((a, b) => a[0] - b[0]).map(([y, cls, text]) =>
    `<div class="g ${cls}" style="top:${y}px"><b>${text} · ${(y / vh).toFixed(2)}vh</b></div>`
  ).join('');
}
buildGuides();

const guideToggle = document.getElementById('cGuides');
const syncGuides = () => document.body.classList.toggle('guides', guideToggle.checked);
guideToggle.addEventListener('change', syncGuides);
syncGuides();

/* 面板開關：只在窄螢幕看得到（見 CSS 的 720px 斷點）。
   選 class 而不是直接改 style：當下要不要顯示是 CSS 的事，
   這裡只負責「使用者想不想看」。桌機寬度下那個 class 本來就沒作用。 */
const panelToggle = document.getElementById('panelToggle');
const setPanelOpen = (open) => {
  document.body.classList.toggle('panelOpen', open);
  panelToggle.setAttribute('aria-expanded', String(open));
  panelToggle.textContent = open ? '收起' : '調整';
};
panelToggle.addEventListener('click', () => {
  setPanelOpen(!document.body.classList.contains('panelOpen'));
});
// Esc 收起。只在已經展開時接手，不會抓走其他地方的 Esc
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('panelOpen')) setPanelOpen(false);
});

const targetMouse = new THREE.Vector2(0, 0);
window.addEventListener('pointermove', (e) => {
  targetMouse.set((e.clientX / window.innerWidth) * 2 - 1,
                  (e.clientY / window.innerHeight) * 2 - 1);
  // 原始位置另外留一份給碰撞判定用（見 overShape）—— 那裡不能吃平滑過的值
  pointerX = e.clientX; pointerY = e.clientY;
  pointerOnUI = !!(e.target.closest && e.target.closest('#panel, #nav, #panelToggle'));
});

/* 觸控沒有「游標離開」這件事。手指放開之後 pointerX/Y 停在最後的位置，
   overShape() 就永遠回 true —— 形狀被當成「一直被抓著」，homeT 每格被清成 0，
   釘住的形狀（文字、隨機離散）再也不會自己轉回正面。
   把座標丟到畫面外，等於補上那個不存在的「離開」。
   targetMouse（相機視差）刑意不動：手指一放相機就彈回中間反而像壞掉。 */
const releasePointer = (e) => {
  if (e.pointerType === 'mouse') return;
  pointerX = -1e4; pointerY = -1e4; pointerOnUI = false;
};
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

/* ══════════════════════════════════════════════════════════
   主迴圈
   ══════════════════════════════════════════════════════════ */
const fpsLabel = document.getElementById('fps');
const statFps = document.getElementById('statFps');
const clock = new THREE.Clock();
let reveal = 0, elapsed = 0, fpsFrames = 0, fpsLast = performance.now();
/* ── 第一段大標題的開場：逐字漸進浮現 ──────────────────────
   先靜置 DELAY 秒（讓波浪自己先出現一下，兩個一起進來會糊成一團），
   然後一個字接一個字淡進來 —— 每個字晚 STEP 秒開始、各自花 FADE 秒淡完，
   最後提示才進場。

   **不是打字機那種硬切**：每個字自己有一段淡入，前後兩個字的淡入是重疊的，
   所以讀起來是一串字連續浮出來，不是一格一格跳。

   **每個字從頭到尾都在版面上，只是透明度 0**，不是逐字插進 DOM ——
   後者每多一個字整行就要重排一次，中文標題會左右抖。 */
const HERO_INTRO_DELAY_S = 0.5;
let HERO_CHAR_STEP = 0.15;     // 每個字比前一個晚多少開始，由字數回推
const HERO_CHAR_FADE = 0.70;   // 單獨一個字淡入多久
const HERO_HINT_FADE_S = 0.8;  // 標題走完之後提示淡進來
let heroChars = splitChars(document.querySelector('#hero h1'));
const heroHint  = document.querySelector('.sec--hero .hint');
/* 逐字走完的總長釘在 HERO_TYPE_TARGET_S，每個字晚多少由字數回推。
   中文 13 個字算出來剛好是 0.15，換英文（27 個字）才會自己縮短。 */
const HERO_TYPE_TARGET_S = 2.5;
let HERO_TYPE_END = 0;   // 最後一個字淡完的時刻
let HERO_INTRO_S  = 0;   // 逐字整段走完要多久（含開頭的延遲）
function retimeHero() {
  const n = Math.max(1, heroChars.length);
  HERO_CHAR_STEP = Math.min(0.15,
    (HERO_TYPE_TARGET_S - HERO_CHAR_FADE) / Math.max(1, n - 1));
  HERO_TYPE_END = (n - 1) * HERO_CHAR_STEP + HERO_CHAR_FADE;
  HERO_INTRO_S = HERO_INTRO_DELAY_S + HERO_TYPE_END;
}
retimeHero();
let heroTyping = true;   // 走完就不再每格寫那一排透明度
/* 開場那一段要能**重播**：點 logo 回首頁、按「聯絡我們」從頭播的時候，
   大標題都要再逐字走一次。所以起算時刻改成變數，不再是「載入後第幾秒」——
   重播就是把它挪到現在。 */
let heroT0 = 0;
function replayHeroIntro() { heroT0 = elapsed; heroTyping = true; }

document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

/* 影格率無關的指數逼近。

   `x += (目標 - x) * 0.06` 這種寫法把速度和**影格數**綁死，不是和時間綁死 ——
   同一個 0.06 在 120Hz 螢幕上一秒逼近 120 次、30Hz 手機上只有 30 次，
   等於高更新率的螢幕平滑幾乎消失、低的又過黏。而且不會報錯，只是手感不對。

   換算成「這一格經過了多少時間」就三個裝置一致。60 是設計時的基準影格率，
   所以在 60Hz 上行為和原本完全相同。 */
const approach = (rate, dt) => 1 - Math.pow(1 - rate, dt * 60);

function tick() {
  requestAnimationFrame(tick);

  // 每格重讀而不是只在 scroll 事件裡讀：平滑捲動套件、鍵盤捲動、
  // 錨點跳轉都不見得會準時發 scroll 事件，每格量一次最省事也最穩
  readScroll();

  // 夾住 dt：分頁切回來的第一格可能隔了好幾秒，不夾的話畫面會瞬移
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  smoothProgress += (targetProgress - smoothProgress) * approach(0.06, dt);
  targetMouse.clampScalar(-1, 1);
  uniforms.uMouse.value.lerp(targetMouse, approach(0.05, dt));
  reveal = Math.min(1, reveal + 0.006 * dt * 60);

  uniforms.uTime.value = elapsed;
  // 捲動位置→收斂進度只在這一行換算。smoothProgress 本人不動，
  // 因為還有三個地方在用它（進度滑桿的顯示、標題淡出、選取判定），
  // 那三個問的是「捲到哪裡」，不是「形狀成形多少」。
  uniforms.uProgress.value = easeConverge(smoothProgress);
  uniforms.uReveal.value = reveal * reveal * (3 - 2 * reveal);

  if (shapeMixAnim !== null) {
    const k = Math.min(1, (performance.now() - shapeMixAnim) / 600);
    uniforms.uShapeMix.value = k * k * (3 - 2 * k);
    if (k >= 1) shapeMixAnim = null;
  }

  /* 揮散粒子的呼吸：從設定值外擴兩成再收回來，一秒出去、一秒回來。

     用升餘弦而不是三角波 —— 三角波在轉折點的速度會瞬間反向，看得出一個
     「頓」；升餘弦兩端的速度都是 0，出去和回來是連續接上的。
     週期 2 秒：cos(t × π) 的週期是 2π / π = 2。

     設定值 0 的時候乘出來還是 0，所以「關掉就是真的關掉」不必另外判斷。
     邊界本來就是軟的（見 shader 的 sel），所以數字連續變動不會有粒子瞬移。 */
  const breathe = 0.5 - 0.5 * Math.cos(elapsed * Math.PI);
  uniforms.uWaftPick.value = waftPickBase * (1 + 0.2 * breathe);

  updateRotation(dt);

  // 鏡頭視差：小幅度，維持原站那種沉穩感
  const kCam = approach(0.03, dt);
  camera.position.x += (targetMouse.x * 4 - camera.position.x) * kCam;
  camera.rotation.x += ((CAM.rot[0] - targetMouse.y * 0.02) - camera.rotation.x) * kCam;

  /* 形狀跟著相機走 —— 這樣視差拖動的只有背景，形狀的中心點釘在畫面上不動
     （見 SHAPE_OFFSET）。一定要放在相機更新**之後**，用的是這一格的姿態；
     放前面就會慢一格，滑鼠快掃時中心點還是會抖。 */
  uniforms.uCenter.value.copy(SHAPE_OFFSET).applyEuler(camera.rotation).add(camera.position);

  if (!manualMode) {
    progressSlider.value = smoothProgress;
    progressLabel.textContent = smoothProgress.toFixed(2);
  } else {
    progressLabel.textContent = targetProgress.toFixed(2);
  }

  /* Hero 標題：開場逐字浮現 + 捲動淡出，兩件事分開處理。
     捲動淡出給整個 .pin（收斂才走到 42% 就已經淡完，讓形狀獨佔畫面），
     開場則是逐字改透明度 —— 兩層相乘，一載入就往下捲也不會打架。

     計時用 elapsed，不另外記變數：它本來就是從載入開始累加的秒數，
     而且分頁切走再回來時 dt 有夾住，不會一口氣跳完。 */
  heroPin.style.opacity = Math.max(0, 1 - smoothProgress * 2.4);
  const tIntro = elapsed - heroT0 - HERO_INTRO_DELAY_S;
  if (heroTyping) {
    heroChars.forEach((el, i) => {
      const k = Math.min(1, Math.max(0,
        (tIntro - i * HERO_CHAR_STEP) / HERO_CHAR_FADE));
      el.style.opacity = k * k * (3 - 2 * k);
    });
    // 最後一格會把每個字都寫成 1，之後就不必再碰它們了
    if (tIntro >= HERO_TYPE_END) heroTyping = false;
  }
  // 提示等標題走完才進來
  const hintIn = Math.min(1, Math.max(0, (tIntro - HERO_TYPE_END) / HERO_HINT_FADE_S));
  heroHint.style.opacity = hintIn * hintIn * (3 - 2 * hintIn);
  /* 最後一段的透明度是**計時**的，不是捲動的（見 BRAND_FADE_S）。
     算在這裡而不是 readScroll：那邊只在捲動時跑，計時淡入需要每格更新。 */
  const brandOn = brandEl && activeSection === brandEl && smoothProgress > 0.98;
  if (!brandOn) brandT0 = null;
  else if (brandT0 === null) brandT0 = elapsed;
  const bk = brandT0 === null ? 0 : Math.min(1, Math.max(0,
    (elapsed - brandT0 - BRAND_DELAY_S) / BRAND_FADE_S));
  brandFade = bk * bk * (3 - 2 * bk);
  /* 信箱與地址晚 BRAND_TAIL_DELAY_S 秒才開始，起點和那句話是同一個。
     容器扛的是那句話的透明度，所以這裡給的是**相對值** ——
     乘回去剛好等於 tk 自己的曲線。前提是那句話先起跑、而且不比它慢淡完
     （0 秒 / 3 秒 對 1 秒 / 3 秒），brandFade 才會一直 ≥ tailFade。 */
  const tk = brandT0 === null ? 0 : Math.min(1, Math.max(0,
    (elapsed - brandT0 - BRAND_TAIL_DELAY_S) / BRAND_TAIL_FADE_S));
  const tailFade = tk * tk * (3 - 2 * tk);
  if (brandTail) {
    brandTail.style.opacity = brandFade > 0.001 ? tailFade / brandFade : 0;
  }
  /* **最後一段不讓位**：整頁的終點就是粒子把那五個字寫完、最亮的那一格，
     壓暗 45% 會讓終點反而比過程暗。這一段的可讀性交給文字底下的柔光罩，
     位置也錯開了（字在中線以上、內文在中線以下）。 */
  if (brandIdx >= 0 && copyState[brandIdx]) copyState[brandIdx].dim = 0;

  /* 內文：一般的段落淡入同時往上推 30px（靜止淡入會顯得沒有重量）；
     分段揭示的段落標題和內文各自淡入，位移由 copyStateOf 釘住。 */
  copyEls.forEach((el, i) => {
    const cs = copyState[i], parts = stageParts[i];
    if (i === brandIdx) {
      /* 這一段是 position: fixed，transform 被拿來水平置中了，
         不能再寫 translateY 進去。淡入淡出只動 opacity。 */
      el.style.opacity = brandFade;
      el.style.pointerEvents = brandFade > 0.9 ? 'auto' : 'none';
      return;
    }
    el.style.transform = 'translateY(' + cs.shift + 'px)';
    if (parts.title) {
      /* 進場的透明度分別給兩個孩子（疊乘的話標題會被壓兩次）；
         退場的淡出給容器，兩個一起淡（見 copyStateOf 的 fade）。 */
      el.style.opacity = cs.fade;
      parts.body.style.opacity = cs.body;
      if (!parts.chars) {
        parts.title.style.opacity = cs.title;
      } else if (parts.lastE !== cs.title) {
        /* 逐字收斂。位移量 = 剩下多少沒收（1 - 進度），所以進度 1 的時候
           每個字剛好回到自己的版面位置，不必再另外歸零。
           透明度給每個字自己，容器保持 1。 */
        parts.lastE = cs.title;
        parts.title.style.opacity = 1;
        const far = TITLE_SPREAD * window.innerHeight;
        for (const c of parts.chars) {
          const k = Math.min(1, Math.max(0,
            (cs.title - c.delay) / (1 - TITLE_STAGGER)));
          const left = 1 - k * k * (3 - 2 * k);   // 還沒收回來的比例
          c.el.style.transform =
            'translate(' + (c.dx * left * far).toFixed(1) + 'px,'
                         + (c.dy * left * far).toFixed(1) + 'px)';
          c.el.style.opacity = k;
        }
      }
    } else {
      el.style.opacity = cs.body;
    }
  });

  /* 粒子讓位給目前最顯眼的那段內文。讀的是 cs.dim 不是 cs.body ——
     兩者的差別寫在 copyStateOf：標題那一拍不讓位、退場移出畫面就還回去。 */
  const dim = 1 - Math.max(0, ...copyState.map((cs) => cs.dim)) * 0.45;
  if (Math.abs(dim - contentDim) > 0.002) { contentDim = dim; applyWaveAlpha(); }

  renderer.render(scene, camera);

  if (++fpsFrames >= 30) {
    const now = performance.now();
    const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
    fpsLabel.textContent = fps + ' fps';
    if (statFps) statFps.textContent = fps;
    fpsFrames = 0; fpsLast = now;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  /* 瀏覽器縮放也會發 resize，而且會**改變 devicePixelRatio** —— 不跟著更新的話
     算圖解析度會卡在開頁時的值：縮小到 90% 之後畫面其實比螢幕能顯示的還糊，
     縮大則是白算了多餘的像素。上限見 maxDPR()。 */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxDPR()));
  renderer.setSize(window.innerWidth, window.innerHeight);
  applyDotSizes();
  remeasureFit();   // 先決定這次算不算新的寬高基準（見 viewFit 上方）
  applyScaleFit();  // 直向↔橫向互轉時形狀大小要跟著換基準
  applyCount();     // 粒子數跟著形狀面積走。內部有「值沒變就不重建」的閘，
                    // 所以拖視窗連發 resize 不會一直重算網格和配對
  buildGuides();   // 版面用 vh 排的，視窗一變高度全都會跑掉
});

/* ── 中英切換 ──────────────────────────────────────────────
   每個要翻的元素身上掛一個 data-en，中文就是它原本的內容。例外是會被
   splitChars 改寫的三個標題：拆完之後 innerHTML 已經不是原文了，所以
   它們另外寫一份 data-zh。裝 SVG 的那幾個（字標、播放、兩顆開關）不能
   換 innerHTML，改用 data-en-label 只換 aria-label。 */
const LANG_KEY = 'wwwx-lang';
const I18N = [...document.querySelectorAll('[data-en]')].map((el) => ({
  el, en: el.dataset.en,
  zh: el.dataset.zh !== undefined ? el.dataset.zh : el.innerHTML,
}));
const I18N_LABEL = [...document.querySelectorAll('[data-en-label]')].map((el) => ({
  el, en: el.dataset.enLabel, zh: el.getAttribute('aria-label'),
}));
/* 換語言連分頁標題、描述、粒子寫的那幾個字一起換。粒子那一串不是裝飾，
   它是這一頁唯一的大標 —— 留著中文等於英文版沒有標題。 */
const META = {
  zh: { lang: 'zh-Hant', shape: '紅品牌策略',
        title: 'wwwx.red — 紅品牌策略',
        desc: '紅品牌策略 wwwx.red：把散落的訊息收斂成一個講得清楚的品牌核心，'
            + '再讓它在市場的雜訊裡站得住。' },
  en: { lang: 'en', shape: 'RED BRAND',
        title: 'wwwx.red — RED Brand Strategy',
        desc: 'RED Brand Strategy: we collapse scattered messages into one brand '
            + 'core, then make it hold up out in the noise.' },
};
const descEl = document.querySelector('meta[name="description"]');
const langBtn = document.querySelector('.switch--lang');
let lang = 'zh';

function setLang(next) {
  if (next === lang) return;
  lang = next;
  const en = lang === 'en', m = META[lang];
  for (const it of I18N) it.el.innerHTML = en ? it.en : it.zh;
  for (const it of I18N_LABEL) it.el.setAttribute('aria-label', en ? it.en : it.zh);
  document.documentElement.lang = m.lang;
  document.title = m.title;
  if (descEl) descEl.content = m.desc;
  langBtn.setAttribute('aria-pressed', en ? 'false' : 'true');

  /* 換 innerHTML 是**破壞性**的：原本那些 <span class="ch"> 全沒了，
     heroChars／stageParts 存的參照會指向已經不在文件裡的節點 —— 標題
     從此不再淡入，而且不會報錯。所以換完字一定要重拆、重建。 */
  heroChars = splitChars(document.querySelector('#hero h1'));
  retimeHero();
  // 開場已經走完的話，新拆出來的字沒人寫過透明度，要自己補上
  if (!heroTyping) for (const c of heroChars) c.style.opacity = 1;
  stageParts = buildStageParts();
  // 右側的點點借導覽列的字當標籤，換完要重讀一次
  dots.forEach((b, i) => b.setAttribute('aria-label', dotLabel(STOPS[i])));

  // 粒子寫的字是掃描畫布來的，換字等於整片點雲重算（九萬顆，約一兩百毫秒）
  if (textInput.value !== m.shape) { textInput.value = m.shape; rebakeText(); }
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
}

langBtn.addEventListener('click', () => setLang(lang === 'zh' ? 'en' : 'zh'));
/* 記住上次選的。讀不到（無痕、擋 storage）就維持中文，不去猜瀏覽器語言 ——
   猜錯的代價是一進來就是錯的語言，比自己按一下嚴重得多。 */
try { if (localStorage.getItem(LANG_KEY) === 'en') setLang('en'); } catch (e) {}

/* 預先烘好各 section 會用到的形狀。不預載的話，第一次捲到那一段才開始下載，
   畫面會停在上一個形狀等個幾百毫秒 —— 使用者只會覺得「卡住了」 */
STOPS.forEach((st) => {
  const def = SHAPES.find((x) => x.id === st.shape);
  // 烘好之後再放一次最後一段的內文：那時才量得到文字真正的下緣
  if (def && def.src) loadBake(def).then(placeBrandCopy).catch(() => {});
});

renderer.render(scene, camera);
tick();

// updateRotation 也掛出來：旋轉是逐幀累積的狀態，要驗「切到文字會不會轉回正面」
// 就得能一格一格手動推進，光看單一幀的 uSpinAngle 看不出東西
// overShape / setPointer：滑鼠碰撞判定沒有畫面可看，只能靠餵座標進去問結果
window.__dbg = { setLang, renderer, scene, camera, uniforms, geometry, buildGrid,
                 setShape, SHAPES, bakeCache, sampleText, updateRotation,
                 rollCloud, cloudMetrics, cloudBaseline, cloudProfile, cloudPoint,
                 CLOUD_BASE, rollEgg, eggProfile, rollHelix, helixProfile,
                 overShape, SHAPE_OFFSET, FIELDS,
                 setPointer: (x, y, ui) => { pointerX = x; pointerY = y; pointerOnUI = !!ui; },
                 rotState: () => ({ mouseYaw, yawTarget, grabbing, spinAngle, textBlend,
                                    hitR: { ...hitR }, spin: uniforms.uSpinAngle.value }) };
</script>
</body>
</html>
